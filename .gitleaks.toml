# Gitleaks repo config.
#
# Inherits the default ruleset and adds a path-based allowlist for the
# locations that legitimately carry secret-shaped fixtures by design:
#
#   1. packages/gateway/src/security/secret-patterns.test.ts
#      — unit-test fixtures that intentionally assert SECRET_PATTERNS
#        regexes fire on canonical prefix strings (PEM headers, `xoxb-…`,
#        `sk-…`, etc). Required for the Phase 5 `nimbus security scan`
#        test suite.
#
#   1b. packages/gateway/src/platform/gateway-log-file.test.ts
#      — unit-test fixtures that assert the gateway log scrubber
#        (`scrubRedactedValuePatterns`) redacts canonical secret-shaped
#        strings (`ghp_…`, `gho_…`, `xoxb-…`, `AKIA…`, `sk-…`, JWTs) from log
#        output. Same rationale as (1): the test's whole point is that these
#        prefixes are present so the scrubber can be proven to remove them.
#
#   2. docs/superpowers/plans/**/*.md
#      — historical implementation-plan docs frequently quoted test source
#        verbatim, so several plans covering security-adjacent work
#        reproduced the same fixture strings. The plans/ tree was pruned
#        from HEAD on 2026-05-28, but **gitleaks scans full git history**:
#        the files still exist in past commits, and a path-based allowlist
#        is the only durable suppression. Plans never carried real
#        credentials.
#
#   3. .claude/agents/**/*.md
#      — Nimbus dev-subagent instruction docs (PR #540) quote SonarCloud / CI
#        auth command examples. These use shell-variable placeholders
#        (`$SONAR_TOKEN`), never real credentials, but the default
#        `curl-auth-user` rule fires on the curl basic-auth form (`-u`)
#        regardless. nimbus-sonar-gate.md now uses a Bearer header
#        (gitleaks-safe), yet the `-u` form is baked into historical commit
#        bc77f751 on `main` that the full-history scan still sees — a path
#        allowlist is the durable suppression (same rationale as the plans
#        tree above).
#
#   4. packages/gateway/src/platform/gateway-log-file.test.ts
#      — the log-redaction unit test carries a synthetic 3-part JWT-shaped
#        fixture (`eyJ…` header, fake `AAAA_BBBB-CCCC` signature) to assert the
#        gateway log scrubber redacts JWTs. Never a real credential. The current
#        file no longer contains it, but the full-history/all-refs scan still
#        sees it in historical commits — a path allowlist is the durable fix
#        (same rationale as entry 1's secret-patterns.test.ts).
#
#   5. packages/gateway/src/connectors/lazy-mesh/phase3-config.test.ts
#      — the lazy-mesh phase-3 connector spawn test sets a synthetic TestFlight
#        credential (`testflight.private_key`, `-----BEGIN PRIVATE KEY-----\nabc\n`)
#        to assert the connector spawns when all three creds are present. The PEM
#        header trips the default `private-key` rule, but the body is the literal
#        `abc` — never a real key. Path allowlist, same rationale as entry 1.
#
#   6. scripts/install/windows/signature-verdict.test.ts
#      — pins the REAL, PUBLIC Nimbus release-signing GPG fingerprints: the
#        published primary (`5A20457C…`) and its signing subkey (`C4F331E9…`),
#        both already public in docs/SECURITY.md, scripts/release/nimbus-verify.sh,
#        and the installers themselves. The test's whole point is proving
#        Resolve-SignatureVerdict matches the PRIMARY fingerprint — the LAST
#        VALIDSIG field — and never the subkey at field 3, which was the
#        actual shipped Windows bug (a field-3-anchored implementation would
#        wrongly accept a signature). A synthetic/low-entropy substitute would
#        still pass while proving nothing real. Only the subkey line trips the
#        default `generic-api-key` rule (on entropy, via the `SUBKEY_FP`
#        identifier) — `PINNED_FP` on the very next line, same file, same
#        shape, does not, which is itself evidence of a false positive: a GPG
#        public key fingerprint is not a secret regardless of which side of
#        that rule's entropy threshold it happens to land on.
#
# Why path-based instead of fingerprint pins in `.gitleaksignore`:
# fingerprints are `<commit-sha>:<path>:<rule>:<line>`. Squash-merges rewrite
# the SHA, rebases shift line numbers, and the pin then misses the (now
# rewritten) commit — which is exactly how PR #391 broke `main` CI: the
# branch-SHA pins (5f889abd, 317c6f12) carried over but the squash-merge to
# 77fefdb4 was unpinned, failing every downstream PR's gitleaks job.

[extend]
useDefault = true

[allowlist]
description = "Synthetic fixtures for the secret-pattern + log-scrubber unit tests + pruned plan docs + dev-subagent instruction docs (historical commits) + a real-public-GPG-fingerprint parsing test"
paths = [
  '''packages/gateway/src/security/secret-patterns\.test\.ts''',
  '''packages/gateway/src/platform/gateway-log-file\.test\.ts''',
  '''packages/gateway/src/connectors/lazy-mesh/phase3-config\.test\.ts''',
  '''docs/superpowers/plans/.*\.md''',
  '''\.claude/agents/.*\.md''',
  '''scripts/install/windows/signature-verdict\.test\.ts''',
]
