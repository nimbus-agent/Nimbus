# Gitleaks repo config.
#
# Inherits the default ruleset and adds a path-based allowlist for two
# locations that legitimately carry secret-shaped fixtures by design:
#
#   1. packages/gateway/src/security/secret-patterns.test.ts
#      — unit-test fixtures that intentionally assert SECRET_PATTERNS
#        regexes fire on canonical prefix strings (PEM headers, `xoxb-…`,
#        `sk-…`, etc). Required for the Phase 5 `nimbus security scan`
#        test suite.
#
#   2. docs/superpowers/plans/**/*.md
#      — historical implementation-plan docs frequently quoted test source
#        verbatim, so several plans covering security-adjacent work
#        reproduced the same fixture strings. The plans/ tree was pruned
#        from HEAD on 2026-05-28, but **gitleaks scans full git history**:
#        the files still exist in past commits, and a path-based allowlist
#        is the only durable suppression. Plans never carried real
#        credentials.
#
#   3. .claude/agents/**/*.md
#      — Nimbus dev-subagent instruction docs (PR #540) quote SonarCloud / CI
#        auth command examples. These use shell-variable placeholders
#        (`$SONAR_TOKEN`), never real credentials, but the default
#        `curl-auth-user` rule fires on the curl basic-auth form (`-u`)
#        regardless. nimbus-sonar-gate.md now uses a Bearer header
#        (gitleaks-safe), yet the `-u` form is baked into historical commit
#        bc77f751 on `main` that the full-history scan still sees — a path
#        allowlist is the durable suppression (same rationale as the plans
#        tree above).
#
# Why path-based instead of fingerprint pins in `.gitleaksignore`:
# fingerprints are `<commit-sha>:<path>:<rule>:<line>`. Squash-merges rewrite
# the SHA, rebases shift line numbers, and the pin then misses the (now
# rewritten) commit — which is exactly how PR #391 broke `main` CI: the
# branch-SHA pins (5f889abd, 317c6f12) carried over but the squash-merge to
# 77fefdb4 was unpinned, failing every downstream PR's gitleaks job.

[extend]
useDefault = true

[allowlist]
description = "Synthetic fixtures for the secret-pattern unit tests + pruned plan docs + dev-subagent instruction docs (historical commits)"
paths = [
  '''packages/gateway/src/security/secret-patterns\.test\.ts''',
  '''docs/superpowers/plans/.*\.md''',
  '''\.claude/agents/.*\.md''',
]
