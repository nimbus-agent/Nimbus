# NOT EMBEDDED ANYWHERE — pulled from docs/README.md on 2026-08-25.
# The scripted brief this replays is hand-written, not captured: a
# "| Lane | Evidence |" table citing PR #214, ticket AUTH-88 and incident INC-31,
# in a format the `why` renderer does not produce. That string appears in exactly
# one file in this repo — the fixture beside this one — and nowhere in production.
# Rebuild the fixture from output captured against a REAL gateway before
# re-embedding. The fake gateway is fine as a transport; a hand-written brief is
# not fine as a demo.

name: zero-config
description: |
  The credential-free first run: `nimbus init` registers the repo you are
  standing in, `nimbus connector sync filesystem` indexes it, and `nimbus why`
  traces a line's provenance — no PAT, no API key, no LLM. Exercises the
  deterministic (no-LLM) brief render, which is the mode a first-time user
  actually lands in.

# Runs inside a fixture repo under the harness tmpdir rather than the recorder's
# checkout: `nimbus init` refuses to run outside a git repository and PRINTS the
# repo root, so recording it anywhere else would bake that machine's absolute
# path into the snapshot. Under tmpdir the existing <TMP> rule scrubs it.
setup:
  repo:
    dir: sample-repo
    files:
      "src/auth.ts": |
        export function verifyToken(token: string): boolean {
          return token.length > 0;
        }

events: zero-config/events.json

# Harness timings are wall-clock from the test run — every event lands inside a
# second, so an unpaced upload flashes past before it can be read. 3s a beat
# gives a viewer time to take in each command's output.
pacingSeconds: 3

steps:
  # `--no-sync` keeps recording deterministic: plain `nimbus init` would start a
  # real gateway, which a cast harness cannot do reproducibly. The next step
  # runs the sync explicitly, so the demo shows the same sequence the README
  # documents, just with the two halves visible separately.
  - input: nimbus init --no-sync
    expect: "code indexing on"

  - input: nimbus connector sync filesystem
    expect: "filesystem"

  - input: nimbus why src/auth.ts:2
    expect: "Rendered deterministically"
