<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360"
     role="img" aria-label="Nimbus architecture: connectors feed a local SQLite index; the engine reads the index and exposes it via CLI and UI; everything runs on your machine">
  <title>Nimbus architecture</title>
  <desc>Connectors to Local SQLite index to Engine plus HITL to CLI and UI — all on your machine</desc>

  <rect x="20" y="40" width="1040" height="280" rx="16" ry="16"
        fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
  <text x="1040" y="305" text-anchor="end"
        font-family="'JetBrains Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#7c3aed">
    your machine
  </text>

  <g font-family="'JetBrains Mono','Cascadia Code','Consolas',monospace" font-size="14" font-weight="600" fill="#1a1a1a">
    <rect x="60" y="140" width="200" height="80" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="160" y="186" text-anchor="middle">30 Connectors</text>

    <rect x="320" y="140" width="200" height="80" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="420" y="180" text-anchor="middle">Local SQLite</text>
    <text x="420" y="198" text-anchor="middle">Index</text>

    <rect x="580" y="140" width="200" height="80" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="680" y="180" text-anchor="middle">Engine</text>
    <text x="680" y="198" text-anchor="middle">+ HITL</text>

    <rect x="840" y="140" width="200" height="80" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="940" y="189" text-anchor="middle">CLI · UI</text>
  </g>

  <g stroke="#7c3aed" stroke-width="2" fill="#7c3aed">
    <line x1="260" y1="180" x2="320" y2="180"/>
    <polygon points="320,180 312,176 312,184"/>
    <line x1="520" y1="180" x2="580" y2="180"/>
    <polygon points="580,180 572,176 572,184"/>
    <line x1="780" y1="180" x2="840" y2="180"/>
    <polygon points="840,180 832,176 832,184"/>
  </g>
</svg>
