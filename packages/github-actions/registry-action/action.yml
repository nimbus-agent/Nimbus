name: "Nimbus extension registry"
description: >
  Runs a Nimbus extension registry repository's CI. `check` validates a publish
  pull request against the signed index on gh-pages and summarises it for the
  reviewer; `sign` validates every unsigned extension version on the default
  branch, signs the index with the registry root key and pushes it to gh-pages.
author: "Nimbus"
branding:
  icon: package
  color: blue

inputs:
  mode:
    description: "Which job this is — one of: check | sign | score (a registry) | score-package (a registry that publishes with `nimbus registry maintain add`) | liveness-check (observe each package's newest stable version, keyless) | trust-check | trust-sign (the Nimbus trust feed)."
    required: true
  default-branch:
    description: "The branch pull requests merge into (sign, score and trust-sign). Empty means origin's HEAD."
    required: false
    default: ""
  root-key:
    description: "The registry root signing key (sign), or the Nimbus trust root key (trust-sign). Pass via an environment secret — never inline."
    required: false
    default: ""

  github-token:
    description: "check and sign: the token `gh attestation verify` fetches a version's build provenance with (the workflow passes the job's github.token). Empty means no provenance is verified; nothing is refused either way. In check it is mutually exclusive with nimbus-gateway: set together, the check fails."
    required: false
    default: ""

  nimbus-gateway:
    description: "score, score-package and check: the ABSOLUTE path to a Nimbus gateway executable whose `__nimbus-eval` role starts a new version's server to list its tools (the baseline) and runs its eval suites, both in the platform sandbox (score: every unsigned version; score-package: the one package; check: the pull request's version, reported in the summary; empty means check runs nothing). A gateway older than the baseline gets no baseline and a warning. It runs extension code, so it is mutually exclusive with github-token in check (set together, the check fails; provenance is then left to the sign job) and score and score-package refuse root-key and github-token."
    required: false
    default: ""

  package:
    description: "score-package: the package to score, a .tgz file made by `nimbus extension pack` (relative to the workspace, or absolute). A directory, or anything else, is refused: this mode runs under Node and `nimbus registry maintain add` under Bun, and the two gzip a directory into different bytes, so give both the same file. It runs extension code in the platform sandbox, and the job holds no secret: root-key and github-token are refused. The job needs the same sandbox setup as a generated score job."
    required: false
    default: ""

  scores:
    description: "score and score-package: where scores.json is written (relative to the workspace); empty means scores.json. sign: the score job's scores.json to sign each version's quality from (untrusted, bound to each version's id, version and package digest); a version with evals/ and no valid score is not signed. Empty means sign records no quality."
    required: false
    default: ""

  liveness-key:
    description: "The registry liveness signing key. liveness-check, score, score-package and check with nimbus-gateway refuse it: those jobs run extension code and hold no secret."
    required: false
    default: ""

  results:
    description: "liveness-check: where the results file is written (relative to the workspace, or absolute); empty means liveness-results.json."
    required: false
    default: ""

  nimbus-version:
    description: "liveness-check: the Nimbus release number (for example 10.14.1) whose gateway nimbus-gateway points at. It is recorded in the results and checked again by the sign job."
    required: false
    default: ""

runs:
  using: "node24"
  main: "dist/index.js"
