name: "Nimbus extension registry"
description: >
  Runs a Nimbus extension registry repository's CI. `check` validates a publish
  pull request against the signed index on gh-pages and summarises it for the
  reviewer; `sign` validates every unsigned extension version on the default
  branch, signs the index with the registry root key and pushes it to gh-pages.
author: "Nimbus"
branding:
  icon: package
  color: blue

inputs:
  mode:
    description: "Which job this is — one of: check | sign (a registry) | trust-check | trust-sign (the Nimbus trust feed)."
    required: true
  default-branch:
    description: "The branch pull requests merge into (sign and trust-sign). Empty means origin's HEAD."
    required: false
    default: ""
  root-key:
    description: "The registry root signing key (sign), or the Nimbus trust root key (trust-sign). Pass via an environment secret — never inline."
    required: false
    default: ""

  github-token:
    description: "check and sign: the token `gh attestation verify` fetches a version's build provenance with (the workflow passes the job's github.token). Empty means no provenance is verified; nothing is refused either way."
    required: false
    default: ""

runs:
  using: "node24"
  main: "dist/index.js"
