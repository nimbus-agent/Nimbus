name: "Nimbus extension registry"
description: >
  Runs a Nimbus extension registry repository's CI. `check` validates a publish
  pull request against the signed index on gh-pages and summarises it for the
  reviewer; `sign` validates every unsigned extension version on the default
  branch, signs the index with the registry root key and pushes it to gh-pages.
author: "Nimbus"
branding:
  icon: package
  color: blue

inputs:
  mode:
    description: "Which job this is — one of: check | sign | score (a registry) | trust-check | trust-sign (the Nimbus trust feed)."
    required: true
  default-branch:
    description: "The branch pull requests merge into (sign, score and trust-sign). Empty means origin's HEAD."
    required: false
    default: ""
  root-key:
    description: "The registry root signing key (sign), or the Nimbus trust root key (trust-sign). Pass via an environment secret — never inline."
    required: false
    default: ""

  github-token:
    description: "check and sign: the token `gh attestation verify` fetches a version's build provenance with (the workflow passes the job's github.token). Empty means no provenance is verified; nothing is refused either way. In check it is mutually exclusive with nimbus-gateway: set together, the check fails."
    required: false
    default: ""

  nimbus-gateway:
    description: "score and check: the ABSOLUTE path to a Nimbus gateway executable whose `__nimbus-eval` role runs a new version's eval suites in the platform sandbox (score: every unsigned version with evals/; check: the pull request's version, reported in the summary; empty means check scores nothing). It runs extension code, so it is mutually exclusive with github-token in check (set together, the check fails; provenance is then left to the sign job) and score refuses root-key and github-token."
    required: false
    default: ""

  scores:
    description: "score: where scores.json is written (relative to the workspace); empty means scores.json. sign: the score job's scores.json to sign each version's quality from (untrusted, bound to each version's id, version and package digest); a version with evals/ and no valid score is not signed. Empty means sign records no quality."
    required: false
    default: ""

runs:
  using: "node24"
  main: "dist/index.js"
