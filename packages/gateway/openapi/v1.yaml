openapi: 3.1.0
info:
  title: Nimbus Local HTTP API
  version: 1.0.0
  description: |
    Read-only HTTP surface served by `nimbus serve` on `127.0.0.1`.
    Never exposed to a network outside the loopback interface.
    See https://github.com/nimbus-agent/Nimbus/blob/main/docs/architecture.md
    for the broader IPC story.
  license:
    name: AGPL-3.0
servers:
  - url: http://127.0.0.1:7474
    description: Local Gateway (default port; override with NIMBUS_HTTP_PORT)
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Gateway is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, gateway]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  gateway:
                    type: string

  /v1/items:
    get:
      operationId: listItems
      summary: List indexed items
      parameters:
        - { in: query, name: service, required: false, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { in: query, name: type, required: false, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
        - { in: query, name: since, required: false, schema: { type: string }, description: "Relative window, e.g. `7d`, `24h`." }
        - { in: query, name: sinceMs, required: false, schema: { type: integer } }
        - { in: query, name: untilMs, required: false, schema: { type: integer } }
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"

  /v1/items/{id}:
    get:
      operationId: getItem
      summary: Fetch one indexed item by id
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: "Item found (or `data: null`)."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    nullable: true
                    type: object

  /v1/connectors:
    get:
      operationId: listConnectors
      summary: List connector health snapshots
      responses:
        "200":
          description: Array of connector health rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { type: object }
                  meta:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /v1/people:
    get:
      operationId: listPeople
      summary: List indexed people
      responses:
        "200":
          description: A page of people.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { type: object } }
                  meta:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /v1/people/{id}:
    get:
      operationId: getPerson
      summary: Fetch one person by id
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: "Person found (or `data: null`)."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { nullable: true, type: object }

  /v1/audit:
    get:
      operationId: listAuditLog
      summary: Tail the audit log (most recent first)
      parameters:
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Recent audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { type: object } }
                  meta:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /v1/deployments:
    post:
      summary: Annotate a completed deployment.
      description: |
        Records a deployment event into the local index. Used by
        `nimbus-agent/annotate-action` (GitHub Actions) and the CLI
        counterpart `nimbus deploy annotate` to make DORA Deployment
        Frequency and Lead Time accurate without relying on the
        `ci_run.title` regex match. Loopback-only; bearer-auth via the
        `http_api.deployment_token` vault key.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentAnnotateInput"
      responses:
        "200":
          description: Annotation accepted (and either new or upserted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAnnotateResult"
        "400":
          description: Invalid request or unknown service.
        "401":
          description: Missing or invalid bearer token.
        "413":
          description: Request body exceeded 8 KiB.
        "429":
          description: Rate limited (60 req/min per token).
        "503":
          description: Write surface disabled or vault unavailable.

  /v1/openapi.json:
    get:
      operationId: getOpenApiSchema
      summary: This document, served as JSON
      responses:
        "200":
          description: The full OpenAPI 3.1 schema rendered as JSON.
          content:
            application/json:
              schema:
                type: object

  /v1/metrics/dora:
    get:
      operationId: getDoraMetrics
      summary: Compute the four DORA metrics for a configured service
      parameters:
        - in: query
          name: service
          required: true
          schema:
            type: string
        - in: query
          name: since
          required: false
          schema:
            type: string
            default: "30d"
          description: "Window: '<N>d' or '<N>h' (1..365)."
      responses:
        "200":
          description: Four-metric envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoraMetricsResult"
        "400":
          description: Bad request (missing/invalid service, malformed since).

  /v1/preflight/deploy:
    get:
      operationId: getDeployPreflight
      summary: Pre-deploy index check for a configured service
      parameters:
        - in: query
          name: service
          required: true
          schema:
            type: string
        - in: query
          name: target_ref
          required: true
          schema:
            type: string
          description: The branch/ref being deployed.
        - in: query
          name: max_findings
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Cap on findings per check.
      responses:
        "200":
          description: Preflight envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployPreflightResult"
        "400":
          description: Bad request (missing/invalid service, target_ref, or max_findings).

components:
  schemas:
    ItemPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { type: object }
        meta:
          type: object
          required: [total, limit, offset]
          properties:
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
    DoraMetricsResult:
      type: object
      required: [service, since_ms, computed_at, metrics]
      properties:
        service: { type: string }
        since_ms: { type: integer }
        computed_at: { type: string, format: date-time }
        metrics:
          type: object
          required: [deployment_frequency, lead_time_for_changes, change_failure_rate, mttr]
          properties:
            deployment_frequency: { $ref: "#/components/schemas/DoraMetricValue" }
            lead_time_for_changes: { $ref: "#/components/schemas/DoraMetricValue" }
            change_failure_rate: { $ref: "#/components/schemas/DoraMetricValue" }
            mttr: { $ref: "#/components/schemas/DoraMetricValue" }
    DoraMetricValue:
      type: object
      required: [value, unit, sample, gap]
      properties:
        value:
          type: number
          nullable: true
        unit:
          type: string
        sample:
          type: integer
        gap:
          nullable: true
          type: string
          # Mirrors `DoraGap` in src/metrics/dora.ts. `unknown_service` (F24b) means the id is in
          # neither [metrics.dora.<id>] nor [ci.service.<id>]; `no_repos` means it exists with no
          # repos bound. `mixed_source` was already missing here — synced in the same pass.
          enum:
            [
              unknown_service,
              no_pagerduty_mapping,
              no_repos,
              no_deployment_data,
              low_sample,
              approximate_lead_time,
              mixed_source,
            ]
    DeployPreflightResult:
      type: object
      required: [service, target_ref, computed_at, verdict, checks]
      properties:
        service: { type: string }
        target_ref: { type: string }
        computed_at: { type: string, format: date-time }
        verdict:
          type: string
          enum: [ok, warn]
        checks:
          type: object
          required: [active_p1_incidents, failing_ci_runs, merge_conflicts]
          properties:
            active_p1_incidents:
              $ref: "#/components/schemas/PreflightIncidentCheck"
            failing_ci_runs:
              $ref: "#/components/schemas/PreflightCiCheck"
            merge_conflicts:
              $ref: "#/components/schemas/PreflightPrCheck"
    PreflightIncidentCheck:
      type: object
      required: [count, findings, gap]
      properties:
        count: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/IncidentFinding" }
        gap: { $ref: "#/components/schemas/PreflightGap" }
    PreflightCiCheck:
      type: object
      required: [count, findings, gap]
      properties:
        count: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/CiFinding" }
        gap: { $ref: "#/components/schemas/PreflightGap" }
    PreflightPrCheck:
      type: object
      required: [count, findings, gap]
      properties:
        count: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/PrFinding" }
        gap: { $ref: "#/components/schemas/PreflightGap" }
    PreflightGap:
      nullable: true
      type: string
      # Mirrors `PreflightGap` in src/preflight/preflight.ts. `pagerduty_urgency_without_priority`
      # was already missing here — synced in the same pass as `unknown_service` (F24a).
      enum:
        [
          unknown_service,
          no_pagerduty_mapping,
          no_repos,
          unknown_mergeable_state,
          pagerduty_urgency_without_priority,
        ]
    IncidentFinding:
      type: object
      required: [id, title, status, severity, opened_at_ms, pagerduty_service_id, url]
      properties:
        id: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [triggered, acknowledged]
        severity: { type: string }
        opened_at_ms: { type: integer }
        pagerduty_service_id: { type: string }
        url:
          type: string
          nullable: true
    CiFinding:
      type: object
      required: [id, title, conclusion, modified_at_ms, branch, head_sha, url]
      properties:
        id: { type: string }
        title: { type: string }
        conclusion:
          type: string
          enum: [failure, cancelled, timed_out]
        modified_at_ms: { type: integer }
        branch: { type: string }
        head_sha:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    PrFinding:
      type: object
      required: [id, title, number, mergeable_state, modified_at_ms, url]
      properties:
        id: { type: string }
        title: { type: string }
        number: { type: integer }
        mergeable_state: { type: string }
        modified_at_ms: { type: integer }
        url:
          type: string
          nullable: true
    DeploymentAnnotateInput:
      type: object
      required: [service, provider, environment, sha, ref, status, started_at_ms]
      properties:
        service:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9._-]*$"
          description: Nimbus service id (matches `[ci.service.<id>]` or `[metrics.dora.<id>]`).
        provider:
          type: string
          enum: [github-actions, gitlab, jenkins, circleci, bitbucket, other]
        environment:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        sha:
          type: string
          minLength: 7
          maxLength: 64
          pattern: "^[0-9a-fA-F]{7,64}$"
        ref:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: string
          enum: [success, failure, cancelled, in_progress]
        started_at_ms:
          type: integer
          minimum: 0
        finished_at_ms:
          type: integer
          minimum: 0
        workflow_url:
          type: string
          format: uri
          maxLength: 2048
        run_id:
          type: string
          minLength: 1
          maxLength: 64
        job_id:
          type: string
          minLength: 1
          maxLength: 64
    DeploymentAnnotateResult:
      type: object
      required: [external_id, service, stored_at_ms, is_new, dora_eligible]
      properties:
        external_id:
          type: string
          description: Stable per-deployment identifier (three-tier rule — see §5.3 of the design).
        service:
          type: string
        stored_at_ms:
          type: integer
        is_new:
          type: boolean
        dora_eligible:
          type: boolean
          description: True iff status=success AND environment ∈ deploy-counted set.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: vault://http_api.deployment_token
      description: |
        Token stored under the vault key `http_api.deployment_token`.
        Set with `nimbus vault set http_api.deployment_token <value>`.
