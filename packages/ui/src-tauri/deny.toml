# cargo-deny configuration for the Tauri shell.
#
# Nimbus core (Gateway/CLI/MCP connectors) is AGPL-3.0; the SDK is MIT.
# This Tauri shell is part of the core (AGPL-3.0). Allowed-license list below
# enforces compatibility with AGPL-3.0 *or-later*: anything inbound must be
# permissive enough to be redistributed under AGPL-3.0.
#
# Run locally:  cargo deny --manifest-path packages/ui/src-tauri/Cargo.toml check all
# Docs:        https://embarkstudios.github.io/cargo-deny/

[graph]
# Match CI target. Add more triples as new platforms ship.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Transitive unmaintained advisories (can't fix without upstream Tauri bump
# or library author action) are ignored individually below. Workspace-direct
# unmaintained would still fail — that's the policy we want.
#
# Every row must still match a crate in Cargo.lock. cargo-deny warns
# `advisory-not-detected` for a row that matches nothing, and such a row is
# deleted, not kept "just in case": retire = delete the row, never leave drift.
# The 2026-10-03 dependency pass retired twenty rows that way. Only the first
# two went with its tauri 2.12.1 bump; the other eighteen already matched
# nothing before it:
#   - quick-xml 0.39.4 (RUSTSEC-2026-0194, RUSTSEC-2026-0195) left the graph.
#     plist 1.10.1 and wayland-scanner 0.31.11 now resolve quick-xml 0.41 and
#     0.42, both past the fix. `cargo audit` in security.yml dropped the same
#     two `--ignore` flags.
#   - The ten gtk3-rs "unmaintained" advisories (RUSTSEC-2024-0411 through
#     RUSTSEC-2024-0420) were WITHDRAWN upstream (rustsec/advisory-db#3189,
#     2026-08-14), so they no longer match any crate.
#   - fxhash (RUSTSEC-2025-0057), the unic-* crates (RUSTSEC-2025-0075,
#     -0080, -0081, -0098, -0100) and rand 0.7.3 (RUSTSEC-2026-0097) are no
#     longer in the graph at all.
#   - glib 0.18.5 (RUSTSEC-2024-0429, unsound VariantStrIter impls, fixed in
#     glib 0.20) IS still in the Linux graph via tray-icon -> libappindicator
#     -> gtk 0.18, but it needs no row. `unsound` defaults to the `workspace`
#     scope, which fails only for a DIRECT dependency, and glib is transitive.
#     `cargo audit` still lists it as an allowed warning. Re-add the row if
#     this file ever sets `unsound = "all"` or glib becomes a direct dependency.
ignore = [
  # --- proc-macro-error 1.0.4: unmaintained. Transitive via glib-macros 0.18.5
  #     (the Linux gtk3 stack under tray-icon). Proc-macro, build-time only.
  #     Revisit when Tauri moves its tray stack off gtk-rs 0.18.
  "RUSTSEC-2024-0370",
]

[licenses]
version = 2
# Permissive licenses compatible with AGPL-3.0 redistribution.
allow = [
  "AGPL-3.0-or-later",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.92
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = [
  # Known-bad / unmaintained crates we never want to pull in transitively.
  { name = "openssl", reason = "Prefer rustls; OpenSSL bindings add packaging risk." },
  { name = "openssl-sys", reason = "Prefer rustls." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
