# cargo-deny configuration for the Tauri shell.
#
# Nimbus core (Gateway/CLI/MCP connectors) is AGPL-3.0; the SDK is MIT.
# This Tauri shell is part of the core (AGPL-3.0). Allowed-license list below
# enforces compatibility with AGPL-3.0 *or-later*: anything inbound must be
# permissive enough to be redistributed under AGPL-3.0.
#
# Run locally:  cargo deny --manifest-path packages/ui/src-tauri/Cargo.toml check all
# Docs:        https://embarkstudios.github.io/cargo-deny/

[graph]
# Match CI target. Add more triples as new platforms ship.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Transitive unmaintained advisories (can't fix without upstream Tauri bump
# or library author action) are ignored individually below. Workspace-direct
# unmaintained would still fail — that's the policy we want.
ignore = [
  # --- gtk3-rs bindings: marked unmaintained 2024-10; transitive via Tauri
  #     2.x on Linux. Tauri is migrating to GTK4; revisit at next Tauri bump.
  "RUSTSEC-2024-0411", # atk
  "RUSTSEC-2024-0412", # gdk
  "RUSTSEC-2024-0413", # gdkwayland-sys
  "RUSTSEC-2024-0414", # gdkx11-sys
  "RUSTSEC-2024-0415", # gdkx11
  "RUSTSEC-2024-0416", # gtk
  "RUSTSEC-2024-0417", # gtk-sys
  "RUSTSEC-2024-0418", # atk-sys
  "RUSTSEC-2024-0419", # gdk-sys
  "RUSTSEC-2024-0420", # gtk3-macros
  # --- proc-macro-error: unmaintained. Transitive via borsh-derive. Shallow.
  "RUSTSEC-2024-0370",
  # --- fxhash: unmaintained. Transitive.
  "RUSTSEC-2025-0057",
  # --- unic-*: all open-i18n/rust-unic crates are unmaintained (transitive).
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property (new advisory, DB updated 2026-04)
  "RUSTSEC-2025-0098", # unic-char-property (original advisory)
  "RUSTSEC-2025-0100", # unic-ucd-ident
  # --- Concrete-bug advisories (not "unmaintained") — kept separate so a
  #     future maintainer can audit blast radius rather than reflexively
  #     re-ignore.
  # glib 0.18.5 unsoundness in VariantStrIter Iterator/DoubleEndedIterator
  # impls. Fixed in glib 0.20. Transitive via tray-icon → tauri 2.10.3
  # (Linux GTK stack). Nimbus does not use VariantStrIter directly; trigger
  # path is GVariant iteration inside Tauri's GTK code on malformed input.
  # Revisit when Tauri bumps gtk-rs to 0.20+.
  "RUSTSEC-2024-0429",
  # rand 0.7.3 unsoundness when combined with a custom logger using
  # rand::rng(). Fixed in rand 0.8.6. Build-time only: pulled in via
  # phf_codegen → selectors → kuchikiki → tauri-utils (HTML perfect-hash
  # codegen). Runtime code uses rand 0.8.6 (also in lockfile). No runtime
  # exposure; revisit when tauri-utils drops the kuchikiki dep tree.
  "RUSTSEC-2026-0097",
  # quick-xml 0.39.4 DoS advisories (published 2026-07): RUSTSEC-2026-0194
  # (quadratic run time checking a start tag for duplicate attribute names)
  # and RUSTSEC-2026-0195 (unbounded namespace-declaration allocation in
  # NsReader → memory-exhaustion DoS). Both fixed in quick-xml >= 0.41.0, but
  # 0.41 is a semver-breaking 0.x-minor bump pinned by transitive deps
  # `plist` (macOS Info.plist bundling) and `wayland-scanner` (Linux Wayland)
  # — not reachable via `cargo update` without an upstream Tauri/plist bump.
  # Nimbus does not parse untrusted XML directly, and the Tauri desktop is
  # deferred to Phase 13 (unshipped) → no runtime exposure. Revisit when
  # Tauri bumps its plist/wayland-scanner dep tree past quick-xml 0.41.
  "RUSTSEC-2026-0194", # quick-xml quadratic duplicate-attribute check
  "RUSTSEC-2026-0195", # quick-xml NsReader unbounded namespace allocation
]

[licenses]
version = 2
# Permissive licenses compatible with AGPL-3.0 redistribution.
allow = [
  "AGPL-3.0-or-later",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.92
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = [
  # Known-bad / unmaintained crates we never want to pull in transitively.
  { name = "openssl", reason = "Prefer rustls; OpenSSL bindings add packaging risk." },
  { name = "openssl-sys", reason = "Prefer rustls." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
