name: Setup Rust + Tauri checks
description: >
  Install Linux libs (Linux only), Rust stable toolchain, restore Cargo cache,
  then optionally run rustfmt and clippy for packages/ui/src-tauri.

inputs:
  run-checks:
    description: Run rustfmt and clippy (set to false to only install and cache)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux libs for Tauri
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # The GHA ubuntu runner ships Microsoft apt repos (azure-cli + prod) that
        # periodically 403 during key rotations and fail `apt-get update` wholesale.
        # We don't need them here — drop them first. See scripts/linux/install-vault-deps.sh.
        sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          libsecret-tools gnome-keyring

    # Was `dtolnay/rust-toolchain` with no `toolchain:` input, which defaults to
    # `stable` — so this installed latest stable and then rust-toolchain.toml
    # pulled 1.95.0 down a second time on the first `cargo fmt`. Two toolchains,
    # two unretried downloads. The shared action installs the pinned one once.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust-toolchain

    - name: Rust cache (Tauri)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          packages/ui/src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('packages/ui/src-tauri/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Rustfmt (Tauri)
      if: inputs.run-checks == 'true'
      shell: bash
      working-directory: packages/ui/src-tauri
      run: cargo fmt --all -- --check

    - name: Clippy (Tauri)
      if: inputs.run-checks == 'true'
      shell: bash
      working-directory: packages/ui/src-tauri
      run: cargo clippy --all-targets --all-features -- -D warnings
