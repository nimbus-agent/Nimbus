name: Setup Nimbus CI (Bun)
description: Install Bun, restore ~/.bun/install/cache + node_modules, optionally verify bun.lock, then frozen install.

inputs:
  bun-version:
    description: Bun version passed to oven-sh/setup-bun
    required: false
    default: "1.3"
  verify-lock:
    description: Run bun install and fail if bun.lock is out of date
    required: false
    default: "true"
  frozen-install:
    description: Run bun install --frozen-lockfile
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (Node 24 runtime)
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun package download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    # node_modules is cached separately from the download cache so a hit
    # skips the link/extract pass entirely. Keyed strictly on bun.lock so a
    # lockfile change always misses the cache (no restore-keys — partial
    # restores would leave a stale tree that frozen-install can't repair).
    # Per-package node_modules are included because Bun's monorepo layout
    # puts non-hoistable deps under each workspace package.
    #
    # SKIPPED ON WINDOWS: Bun's monorepo layout under
    # `node_modules/.bun/<pkg>@<version>+<hash>/node_modules/<pkg>/` relies on
    # NT junctions, which `actions/cache@v5`'s tar pack/restore does not preserve
    # correctly. A restored tree on Windows produces EPERM reads on `.bun/...`
    # paths and yields stripped-down ambient `@types/bun` / `@types/node`
    # declarations (e.g. `Response.text/ok/status` go missing), failing
    # `bun run typecheck`. `bun install --frozen-lockfile` skips re-linking
    # a tree it considers installed, so the safety net does not repair it.
    # macOS (POSIX symlinks) and Linux are unaffected.
    - name: Cache node_modules
      if: runner.os != 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          packages/mcp-connectors/*/node_modules
          packages/github-actions/*/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}

    - name: Install and verify dependencies
      shell: bash
      env:
        VERIFY_LOCK: ${{ inputs.verify-lock }}
        FROZEN_INSTALL: ${{ inputs.frozen-install }}
      # On a node_modules cache hit, `bun install --frozen-lockfile` still
      # runs — it verifies the lockfile and the installed tree match, which
      # is the safety net for cache restores that lose Bun's internal
      # symlinks. With both caches warm this is near-instant (~2-3 s).
      run: |
        if [ "$VERIFY_LOCK" = "true" ]; then
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
        elif [ "$FROZEN_INSTALL" = "true" ]; then
          bun install --frozen-lockfile
        else
          bun install
        fi
