name: Nimbus CodeQL config

# Inherits the suite specified in the workflow (`queries: security-extended`)
# and applies the per-rule filters below.

queries:
  - uses: security-extended

# The GitHub Actions' committed `dist/index.js` bundles are BUILD OUTPUT: their own code is the
# `src/` CodeQL already scans, and the rest is vendored dependencies (minified `tar`, for one),
# which the dependency audits cover. Scanning the bundle reports a library's internals as this
# repository's code: `js/file-system-race` inside `tar`'s append path, for the registry action.
# `audit:action-dist` keeps each bundle tied to its sources and dependencies.
paths-ignore:
  - packages/github-actions/*/dist/**

query-filters:
  # `js/insufficient-password-hash` — pattern-matches any `createHash("sha256")`
  # whose input *could* be a credential. The only call site in this repo is
  # `deterministicGraphEntityId(type, externalId)` in
  # `packages/gateway/src/graph/relationship-graph.ts`, which hashes a public
  # graph entity type + external id (e.g. `"github_user"` + `"octocat"`) to
  # build a stable primary key for the `graph_entity` table. No credential
  # ever reaches it; the hash is for collision-resistant ID derivation, not
  # password storage. Suppressed at the rule level rather than per-line so the
  # signal isn't lost if other call sites ever appear (CodeQL would still flag
  # them in PR review even if they were also false positives, prompting a
  # reviewer to confirm the suppression is still scoped correctly).
  - exclude:
      id: js/insufficient-password-hash
  # `js/http-to-file-access` — flags `fetch()` data flowing into `fs.append*`
  # sinks. The only call site in this repo is the GitHub Action wrapper
  # `packages/github-actions/preflight-query/src/main.ts`, where the
  # operator's own local Nimbus Gateway is fetched and the bounded JSON
  # response is written to `$GITHUB_OUTPUT` and `$GITHUB_STEP_SUMMARY`
  # (workflow-job-scoped, no privilege escalation). The trust boundary is
  # the operator's machine — by design (Phase 5 T4 PR 3a), the Action
  # runs on a self-hosted runner that hosts the Gateway. The Action
  # additionally sanitizes the fetched envelope at a single explicit
  # barrier (`sanitizeEnvelope` in `main.ts`): strings pass through a
  # control-char allowlist + length cap, counts coerce through `Number()`
  # + `Math.trunc`, verdict narrows to a literal `"ok" | "warn"`. CodeQL
  # does not recognise user-defined sanitizers for this rule. Suppressed
  # globally so any future call site is still flagged in PR review,
  # prompting a reviewer to confirm the suppression is still scoped
  # correctly. Phase 5 T4 PR 3a.
  - exclude:
      id: js/http-to-file-access
