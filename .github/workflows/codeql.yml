name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "25 4 * * 1"

permissions:
  contents: read

# Cancel an in-flight CodeQL run when a newer commit lands on the same ref.
# Prevents the "1 configuration not found" PR-comment race where a stale PR
# analysis predates a newer main analysis and the alert-correlation engine
# can't match them. `cancel-in-progress: true` is safe here because every
# trigger re-uploads the SARIF; the latest run is always the authoritative one.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runner: ubuntu-24.04
            build-mode: none
          # Tauri shell, IPC bridge, updater signature verification, LAN crypto.
          # CodeQL Rust support requires build-mode: none — the extractor reads sources
          # via cargo metadata without compiling, so Tauri's GTK deps are unnecessary.
          - language: rust
            runner: ubuntu-24.04
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Rust (Rust only)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (SHA-pinned; version driven by input below)
        with:
          toolchain: "1.95.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild (JS/TS)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:${{ matrix.language }}"
