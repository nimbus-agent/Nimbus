name: Org drift sweep

on:
  schedule:
    # 07:00 UTC Mondays — early enough to act on during the week.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-drift-sweep
  cancel-in-progress: false

jobs:
  sha-pins:
    name: sha-pins (${{ matrix.repo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PUBLIC repos only — the default GITHUB_TOKEN checkout works anonymously
        # for public repos but cannot clone private ones, and a private entry
        # would fail at checkout indistinguishably from real drift.
        repo:
          - nimbus-client
          - nimbus-sdk
          - nimbus-vscode
          - nimbus-web-clipper
          - .github
          - linux-repo
          - homebrew-tap
          - scoop-bucket
    steps:
      - name: Checkout Nimbus (for the audit script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nimbus-agent/${{ matrix.repo }}
          path: target
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Audit action pins in ${{ matrix.repo }}
        run: bun scripts/structure-audit/check-action-sha-pins.ts --root target

  ruleset-drift:
    name: ruleset-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token (Administration:Read on the active repos)
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus,nimbus-client,nimbus-sdk,nimbus-vscode,nimbus-web-clipper
          # Administration:read is what `GET /repos/{o}/{r}/rulesets` needs. Note it
          # is NOT sufficient to read `bypass_actors` for org-level actors
          # (OrganizationAdmin comes back empty) — proven live that even adding
          # organization-administration:read does not restore it — so the drift
          # audit deliberately does not diff bypass actors. See the P1 progress
          # log in docs/infrastructure-roadmap.md.
          permission-administration: read
      - name: Audit ruleset drift across active repos
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-ruleset-drift.ts --strict

  org-settings-drift:
    name: org-settings-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          # org-settings-drift reads GET /orgs/nimbus-agent (org settings) — org-administration:read suffices.
          permission-organization-administration: read
      - name: Audit org settings drift
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-org-settings-drift.ts --strict

  team-reachability:
    name: team-reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          # team-reachability lists org teams + each team's repos — members:read. (Granted to the App at P6a apply time; until then this job's token mint fails, which is the expected pre-apply red.)
          permission-members: read
      - name: Audit team reachability
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-team-reachability.ts --strict

  cla-coverage:
    name: cla-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus,nimbus-sdk,nimbus-client,nimbus-vscode,nimbus-web-clipper,awesome-nimbus
          # cla-coverage reads .github/workflows/cla.yml from each gated repo — contents:read.
          permission-contents: read
      - name: Audit CLA coverage
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-cla-coverage.ts --strict

  release-staleness:
    name: release-staleness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # No App token: every read (Nimbus releases + manifest, the channel repos,
      # microsoft/winget-pkgs) is PUBLIC. The default github.token authenticates
      # gh at 5000 req/hr, far above this job's handful of reads + one search.
      - name: Audit release-train staleness
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/structure-audit/check-release-staleness.ts --strict

  actions-allowlist:
    name: actions-allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # No App token: `actions/permissions` and `actions/runs` on this repo are
      # readable by the default github.token, which already carries actions:read.
      - name: Audit the Actions allowlist + startup failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/structure-audit/check-actions-allowlist.ts --strict
