name: Org drift sweep

on:
  schedule:
    # 07:00 UTC Mondays — early enough to act on during the week.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-drift-sweep
  cancel-in-progress: false

jobs:
  sha-pins:
    name: sha-pins (${{ matrix.repo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PUBLIC repos only — the default GITHUB_TOKEN checkout works anonymously
        # for public repos but cannot clone private ones, and a private entry
        # would fail at checkout indistinguishably from real drift.
        repo:
          - nimbus-client
          - nimbus-sdk
          - nimbus-vscode
          - nimbus-web-clipper
          - create-nimbus-connector
          - .github
          - linux-repo
          - homebrew-tap
          - scoop-bucket
    steps:
      - name: Checkout Nimbus (for the audit script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nimbus-agent/${{ matrix.repo }}
          path: target
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Audit action pins in ${{ matrix.repo }}
        run: bun scripts/structure-audit/check-action-sha-pins.ts --root target

  ruleset-drift:
    name: ruleset-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token (Administration:Read on the active repos)
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus,nimbus-client,nimbus-sdk,nimbus-vscode,nimbus-web-clipper,create-nimbus-connector
          # Administration:read is what `GET /repos/{o}/{r}/rulesets` needs. Note it
          # is NOT sufficient to read `bypass_actors` for org-level actors
          # (OrganizationAdmin comes back empty) — proven live that even adding
          # organization-administration:read does not restore it — so the drift
          # audit deliberately does not diff bypass actors. See the P1 progress
          # log in docs/infrastructure-roadmap.md.
          permission-administration: read
      - name: Audit ruleset drift across active repos
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-ruleset-drift.ts --strict

  org-settings-drift:
    name: org-settings-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          # org-settings-drift reads GET /orgs/nimbus-agent (org settings) — org-administration:read suffices.
          permission-organization-administration: read
      - name: Audit org settings drift
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-org-settings-drift.ts --strict

  team-reachability:
    name: team-reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          # team-reachability lists org teams + each team's repos — members:read. (Granted to the App at P6a apply time; until then this job's token mint fails, which is the expected pre-apply red.)
          permission-members: read
      - name: Audit team reachability
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-team-reachability.ts --strict

  cla-coverage:
    name: cla-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus,nimbus-sdk,nimbus-client,nimbus-vscode,nimbus-web-clipper,awesome-nimbus,create-nimbus-connector
          # cla-coverage reads .github/workflows/cla.yml from each gated repo — contents:read.
          permission-contents: read
      - name: Audit CLA coverage
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-cla-coverage.ts --strict

  review-coverage:
    name: review-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        # Unlike the other sweep gates this one parses YAML, so it needs the
        # workspace's `yaml` devDependency present.
        run: bun install --frozen-lockfile
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus,nimbus-sdk,nimbus-client,nimbus-vscode,nimbus-web-clipper,create-nimbus-connector
          # review-coverage reads .coderabbit.yaml from each gated repo — contents:read.
          permission-contents: read
      - name: Audit review coverage
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bun scripts/structure-audit/check-review-coverage.ts --strict

  bypass-attestation:
    name: bypass-attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # No App token: this gate reads only the committed attestation + declared
      # config. Reading bypass_actors needs Administration:write, which is the
      # whole reason the attestation indirection exists.
      - name: Audit the bypass-actor attestation
        run: bun scripts/structure-audit/check-bypass-attestation.ts --strict

  # release-staleness moved to `release-channel-drift.yml` on 2026-08-09 — weekly
  # was too slow for a download channel (winget sat at 1.19.1 for six days across
  # seven releases), and a red job in a big sweep is not a signal anyone reads.
  # It now runs DAILY and files a release-health issue naming the findings.

  pin-freshness:
    name: pin-freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # No App token: every read (each pinned action's latest release + tag) is
      # PUBLIC. Results are cached per action, so this is a handful of requests.
      - name: Audit action-pin freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/structure-audit/check-pin-freshness.ts --strict

  ci-latency:
    name: ci-latency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # `actions: read` is all the Actions API needs for runs + jobs. Every
      # audited repo is public, so the default github.token reaches them.
      - name: Audit CI latency
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-latency/check.ts --strict

  actions-allowlist:
    name: actions-allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `actions: read` covers the workflow + run lists, which is the half that
    # matters most. The Actions ALLOWLIST endpoint additionally wants repo
    # Administration, and the GITHUB_TOKEN permissions block has no
    # `administration` scope at all — so that half may be unreadable here. The
    # audit degrades to a warning in that case rather than failing, so the
    # startup-failure detection still runs. To enable the allowlist half, mint
    # the release-bot App token with `permission-administration: read` (see the
    # ruleset-drift job above) and pass it as GH_TOKEN instead.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Audit the Actions allowlist + startup failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/structure-audit/check-actions-allowlist.ts --strict

  launcher-installer-contract:
    name: Launcher installer-path contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # nimbus-mcp vendors the installer's output directories as literals
    # (src/installer-contract.ts). Its own tests only prove it agrees with that
    # copy — nothing over there can see scripts/install/lib/paths.ts move, and
    # nothing HERE can see the vendored copy move. This job is the half that
    # watches the second direction; install-smoke.yml watches the first.
    permissions:
      contents: read
    steps:
      - name: Checkout Nimbus (owns scripts/install/lib/paths.ts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout nimbus-mcp (owns the vendored copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nimbus-agent/nimbus-mcp
          path: .nimbus-mcp
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Compare the vendored suffixes against resolveInstallDir
        run: |
          bun scripts/structure-audit/check-launcher-installer-contract.ts \
            .nimbus-mcp/src/installer-contract.ts
