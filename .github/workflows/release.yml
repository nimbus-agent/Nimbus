name: Release

on:
  push:
    tags:
      # Production releases (vN.N.N) get marked Latest and feed the auto-update manifest.
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-release tags (vN.N.N-rcN, -beta.N, -alpha.N, …) exercise the same
      # signing + packaging pipeline but are flipped to GitHub Pre-release via
      # the `contains(github.ref_name, '-')` check on the publish-release job.
      # The update-manifest job is also gated on the non-prerelease form so rc
      # builds do not consume CI minutes producing a manifest no one reaches.
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Single typecheck pass — no need to repeat across all build platforms
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: Typecheck
        run: bun run typecheck

  # Full test suite on the tagged commit — prevents publishing broken binaries.
  # Runs on ubuntu only (the full 3-OS matrix already runs on every push to main).
  test:
    name: Test suite (release gate)
    needs: validate
    uses: ./.github/workflows/_test-suite.yml
    with:
      runner: ubuntu-24.04
      run-packaging: false
    secrets:
      # Optional; the reusable workflow silently skips the SonarQube step
      # when this is unset.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      # Required by _test-suite.yml: the integration / e2e-gateway / e2e-cli
      # jobs declare `checks: write` for their dorny/test-reporter step. A
      # called workflow's jobs cannot request a permission the caller withholds,
      # so this must be granted here (matches the ci.yml callers).
      checks: write
      id-token: write

  build-gateway:
    name: Build Gateway — ${{ matrix.target.os }}
    needs: [validate, test]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            runner: ubuntu-24.04
            artifact: nimbus-gateway-linux-x64
            ext: ""
          # Intel/x64 image — matches nimbus-gateway-macos-x64 (macos-13 retired)
          - os: macos
            runner: macos-15-intel
            artifact: nimbus-gateway-macos-x64
            ext: ""
          # Apple Silicon — native arm64 binary (no Rosetta)
          - os: macos-arm64
            runner: macos-15
            artifact: nimbus-gateway-macos-arm64
            ext: ""
          - os: windows
            runner: windows-2025
            artifact: nimbus-gateway-windows-x64
            ext: ".exe"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # The gateway embeds the console's build output with `{ type: "file" }` imports, so its dist
      # must exist before the compile. The root `prepare` script already builds it during install;
      # this is the explicit form for the one place where a missing dist would be baked into a
      # user's binary rather than surfacing as a local error.
      - name: Build the admin console (embedded into the gateway binary)
        run: bun run build:console

      - name: Build Gateway binary (non-Windows)
        if: matrix.target.os != 'windows'
        run: |
          cd packages/gateway
          bun build src/index.ts --compile --outfile ../../dist/${{ matrix.target.artifact }}${{ matrix.target.ext }} --target bun

      # Windows PE resources (Details tab: Product name / File version / Company)
      # are stamped here so the exe reports Nimbus instead of the embedded Bun
      # runtime's own metadata. --windows-version wants a numeric 4-part
      # (major.minor.patch.revision); strip any prerelease suffix and pad ".0".
      - name: Build Gateway binary (Windows — with exe metadata)
        if: matrix.target.os == 'windows'
        shell: pwsh
        env:
          # Via env (not a ${{ }} run-body expansion) so a crafted tag name can't
          # inject into the script; then validate the derived 4-part numeric.
          REF_NAME: ${{ github.ref_name }}
        run: |
          $winver = $env:REF_NAME.TrimStart("v").Split("-")[0] + ".0"
          if ($winver -notmatch '^[0-9]+(\.[0-9]+){3}$') { throw "unexpected version from ref '$env:REF_NAME': $winver" }
          cd packages/gateway
          bun build src/index.ts --compile --outfile ../../dist/${{ matrix.target.artifact }}${{ matrix.target.ext }} --target bun `
            --windows-title "Nimbus Gateway" `
            --windows-publisher "Nimbus Contributors" `
            --windows-version "$winver" `
            --windows-description "Nimbus Gateway — local-first AI agent framework" `
            --windows-copyright "Copyright (c) Nimbus Contributors — AGPL-3.0-or-later"

      # sqlite-vec loadable extension. tryLoadFromSidecar() resolves it from
      # dirname(process.execPath), so it must travel with the binary into every archive and
      # installer. Its absence is a log.debug-level failure — semantic memory just stops working —
      # which is why no release before this one noticed it was never copied at all.
      - name: Copy sqlite-vec sidecar
        run: bun scripts/copy-vec0-sidecar.ts --dest dist

      - name: Sign binary (Linux GPG)
        if: matrix.target.os == 'linux'
        timeout-minutes: 15
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/sign-linux-gpg.sh dist/${{ matrix.target.artifact }}${{ matrix.target.ext }}

      - name: Sign binary (Ed25519 updater)
        timeout-minutes: 5
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: bun scripts/sign-ed25519.ts dist/${{ matrix.target.artifact }}${{ matrix.target.ext }}

      # Glob to include the binary plus the sidecar files produced by the
      # signing steps above:
      #   - <bin>.sha256 + <bin>.sig from sign-ed25519.ts (every platform)
      #   - <bin>.asc from sign-linux-gpg.sh (Linux only)
      # The update-manifest job downloads this artifact and reads <bin>.sha256
      # + <bin>.sig per target — without the sidecars, build-update-manifest.ts
      # fails with ENOENT and the v0.1.0 latest.json was never produced.
      #
      # vec0.* is a SECOND path entry rather than part of the glob above, which is anchored on the
      # binary's name. Both live under dist/, so the least-common-ancestor stays dist/ and every
      # file still lands at the artifact root. The downstream `Stage release assets`,
      # `Compute SHA256SUMS` and `Flatten artifact dir` steps all glob on the nimbus-gateway-*
      # prefix, so the sidecar never becomes a loose release asset — it ships inside the archives
      # and installers, which is where a user's binary can actually find it.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target.artifact }}
          path: |
            dist/${{ matrix.target.artifact }}${{ matrix.target.ext }}*
            dist/vec0.*
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.target.artifact }}${{ matrix.target.ext }}

  build-cli:
    name: Build CLI — ${{ matrix.target.os }}
    needs: [validate, test]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            runner: ubuntu-24.04
            artifact: nimbus-cli-linux-x64
            ext: ""
          - os: macos
            runner: macos-15-intel
            artifact: nimbus-cli-macos-x64
            ext: ""
          # Apple Silicon — native arm64 binary (no Rosetta)
          - os: macos-arm64
            runner: macos-15
            artifact: nimbus-cli-macos-arm64
            ext: ""
          - os: windows
            runner: windows-2025
            artifact: nimbus-cli-windows-x64
            ext: ".exe"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: Build CLI binary (non-Windows)
        if: matrix.target.os != 'windows'
        run: |
          cd packages/cli
          bun build src/index.ts --compile --outfile ../../dist/${{ matrix.target.artifact }}${{ matrix.target.ext }} --target bun

      # Stamp Windows PE resources so `nimbus.exe` reports Nimbus metadata in the
      # Details tab rather than the embedded Bun runtime's. See the gateway build
      # step above for the --windows-version numeric-4-part rationale.
      - name: Build CLI binary (Windows — with exe metadata)
        if: matrix.target.os == 'windows'
        shell: pwsh
        env:
          # Via env (not a ${{ }} run-body expansion) so a crafted tag name can't
          # inject into the script; then validate the derived 4-part numeric.
          REF_NAME: ${{ github.ref_name }}
        run: |
          $winver = $env:REF_NAME.TrimStart("v").Split("-")[0] + ".0"
          if ($winver -notmatch '^[0-9]+(\.[0-9]+){3}$') { throw "unexpected version from ref '$env:REF_NAME': $winver" }
          cd packages/cli
          bun build src/index.ts --compile --outfile ../../dist/${{ matrix.target.artifact }}${{ matrix.target.ext }} --target bun `
            --windows-title "Nimbus CLI" `
            --windows-publisher "Nimbus Contributors" `
            --windows-version "$winver" `
            --windows-description "Nimbus CLI — local-first AI agent framework" `
            --windows-copyright "Copyright (c) Nimbus Contributors — AGPL-3.0-or-later"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target.artifact }}
          path: dist/${{ matrix.target.artifact }}${{ matrix.target.ext }}
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.target.artifact }}${{ matrix.target.ext }}

  build-msi:
    name: Build .msi (Windows)
    needs: [build-gateway, build-cli]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/

      - name: Stage exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/msi-bin -Force | Out-Null
          Copy-Item dist/nimbus-gateway-windows-x64/nimbus-gateway-windows-x64.exe dist/msi-bin/nimbus-gateway.exe
          Copy-Item dist/nimbus-cli-windows-x64/nimbus-cli-windows-x64.exe          dist/msi-bin/nimbus.exe
          Copy-Item dist/nimbus-gateway-windows-x64/vec0.dll                        dist/msi-bin/vec0.dll

      - name: Install WiX v5 (pinned)
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build .msi
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Path dist/installers -Force | Out-Null
          ./scripts/package-windows-installer.ps1 -BinDir (Resolve-Path dist/msi-bin) -Version $v -Out dist/installers/nimbus-headless-windows-x64.msi

      - name: Sign .msi (seam — no-op until certs land)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign/sign-windows.ps1 -Target dist/installers/nimbus-headless-windows-x64.msi

      - name: Upload .msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nimbus-installer-msi
          path: dist/installers/nimbus-headless-windows-x64.msi
          if-no-files-found: error
          retention-days: 30

  build-pkg:
    name: Build .pkg (macOS)
    needs: [build-gateway, build-cli]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download macOS binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/

      - name: Build + sign per-arch .pkg
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist/installers
          for arch in x64 arm64; do
            stage="dist/pkg-bin-$arch"
            mkdir -p "$stage"
            cp "dist/nimbus-gateway-macos-$arch/nimbus-gateway-macos-$arch" "$stage/nimbus-gateway"
            cp "dist/nimbus-cli-macos-$arch/nimbus-cli-macos-$arch"         "$stage/nimbus"
            cp "dist/nimbus-gateway-macos-$arch/vec0.dylib"                 "$stage/vec0.dylib"
            chmod +x "$stage/nimbus" "$stage/nimbus-gateway"
            out="dist/installers/nimbus-headless-macos-$arch.pkg"
            bash scripts/package-macos-installer.sh --bin-dir "$stage" --version "$V" --out "$out"
            bash scripts/sign/sign-macos.sh "$out"
          done

      - name: Upload .pkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nimbus-installer-pkg
          path: dist/installers/nimbus-headless-macos-*.pkg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-gateway
      - build-cli
      - build-msi
      - build-pkg
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    # Keep GITHUB_TOKEN read-only here; GitHub Release API uses a minted release-bot App token (Contents RW).
    # id-token: write is required by anchore/sbom-action to attach an OIDC-signed attestation.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus
          permission-contents: write

      - name: Setup Bun and install dependencies (packaging)
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/

      - name: Linux installers (.deb + tarball + AppImage)
        shell: bash
        run: |
          set -e
          # Drop the GHA runner's preinstalled Microsoft apt repos (azure-cli + prod);
          # they periodically 403 and fail `apt-get update` wholesale. Not needed here.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          # Pin appimagetool; update hash when bumping the version.
          APPIMAGETOOL_VERSION="continuous"
          APPIMAGETOOL_URL="https://github.com/AppImage/AppImageKit/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -fsSL "$APPIMAGETOOL_URL" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          # Pinned nfpm (checksum-verified) for the .rpm. Update both when bumping.
          NFPM_VERSION="2.43.0"
          NFPM_TGZ="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          NFPM_SHA256="a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${NFPM_TGZ}" -o /tmp/nfpm.tgz
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          mkdir -p /tmp/nfpm && tar -xzf /tmp/nfpm.tgz -C /tmp/nfpm nfpm
          chmod +x /tmp/nfpm/nfpm
          # Materialize inputs into the bundle layout expected by package-linux-installers.ts.
          mkdir -p dist/headless-bundle
          cp dist/nimbus-gateway-linux-x64/nimbus-gateway-linux-x64 dist/headless-bundle/nimbus-gateway
          cp dist/nimbus-cli-linux-x64/nimbus-cli-linux-x64 dist/headless-bundle/nimbus
          cp dist/nimbus-gateway-linux-x64/vec0.so dist/headless-bundle/vec0.so
          chmod +x dist/headless-bundle/nimbus-gateway dist/headless-bundle/nimbus
          V="${GITHUB_REF_NAME#v}"
          bun scripts/package-linux-installers.ts \
            --bundle dist/headless-bundle \
            --version "$V" \
            --appimagetool /tmp/appimagetool \
            --rpm \
            --nfpm /tmp/nfpm/nfpm

      - name: Sign Linux installer artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -e
          for f in dist/installers/*.deb dist/installers/*.rpm dist/installers/*.AppImage dist/installers/*.tar.gz; do
            [ -f "$f" ] || continue
            bash scripts/sign-linux-gpg.sh "$f"
          done

      - name: Build macOS + Windows archives
        shell: bash
        run: |
          set -e
          mkdir -p dist/archives
          V="${GITHUB_REF_NAME#v}"

          # NOTE: install.sh / install.ps1 look for `nimbus` and `nimbus-gateway`
          # (or `.exe` on Windows) — NOT the `-<os>-<arch>` suffixed names. The
          # raw release assets keep their suffixed filenames (so users can grab
          # one binary from the release page without confusion), but inside the
          # extracted archive we rename to the canonical names that the install
          # scripts (and `nimbus start`) expect.

          # macOS x64 tarball
          mkdir -p dist/stage-macos-x64
          cp dist/nimbus-gateway-macos-x64/nimbus-gateway-macos-x64 dist/stage-macos-x64/nimbus-gateway
          cp dist/nimbus-cli-macos-x64/nimbus-cli-macos-x64         dist/stage-macos-x64/nimbus
          cp dist/nimbus-gateway-macos-x64/vec0.dylib               dist/stage-macos-x64/vec0.dylib
          cp scripts/release/archive-contents/README-QUICKSTART.txt dist/stage-macos-x64/
          cp scripts/release/archive-contents/LICENSE-AGPL.txt      dist/stage-macos-x64/
          cp scripts/install/unix/install.sh                         dist/stage-macos-x64/
          cp scripts/install/unix/uninstall.sh                       dist/stage-macos-x64/
          chmod +x dist/stage-macos-x64/nimbus dist/stage-macos-x64/nimbus-gateway dist/stage-macos-x64/install.sh dist/stage-macos-x64/uninstall.sh
          tar -czf dist/archives/nimbus-headless-macos-x64.tar.gz -C dist/stage-macos-x64 .

          # macOS arm64 tarball
          mkdir -p dist/stage-macos-arm64
          cp dist/nimbus-gateway-macos-arm64/nimbus-gateway-macos-arm64 dist/stage-macos-arm64/nimbus-gateway
          cp dist/nimbus-cli-macos-arm64/nimbus-cli-macos-arm64         dist/stage-macos-arm64/nimbus
          cp dist/nimbus-gateway-macos-arm64/vec0.dylib                 dist/stage-macos-arm64/vec0.dylib
          cp scripts/release/archive-contents/README-QUICKSTART.txt     dist/stage-macos-arm64/
          cp scripts/release/archive-contents/LICENSE-AGPL.txt          dist/stage-macos-arm64/
          cp scripts/install/unix/install.sh                             dist/stage-macos-arm64/
          cp scripts/install/unix/uninstall.sh                           dist/stage-macos-arm64/
          chmod +x dist/stage-macos-arm64/nimbus dist/stage-macos-arm64/nimbus-gateway dist/stage-macos-arm64/install.sh dist/stage-macos-arm64/uninstall.sh
          tar -czf dist/archives/nimbus-headless-macos-arm64.tar.gz -C dist/stage-macos-arm64 .

          # Windows x64 zip
          mkdir -p dist/stage-windows-x64
          cp dist/nimbus-gateway-windows-x64/nimbus-gateway-windows-x64.exe dist/stage-windows-x64/nimbus-gateway.exe
          cp dist/nimbus-cli-windows-x64/nimbus-cli-windows-x64.exe         dist/stage-windows-x64/nimbus.exe
          cp dist/nimbus-gateway-windows-x64/vec0.dll                       dist/stage-windows-x64/vec0.dll
          cp scripts/release/archive-contents/README-QUICKSTART.txt         dist/stage-windows-x64/
          cp scripts/release/archive-contents/LICENSE-AGPL.txt              dist/stage-windows-x64/
          cp scripts/install/windows/install.ps1                             dist/stage-windows-x64/
          cp scripts/install/windows/uninstall.ps1                           dist/stage-windows-x64/
          (cd dist/stage-windows-x64 && zip -r ../archives/nimbus-headless-windows-x64.zip .)

          # Cleanup
          rm -rf dist/stage-macos-x64 dist/stage-macos-arm64 dist/stage-windows-x64

      - name: Verify SIGNING-KEY placeholder is not in release assets
        shell: bash
        run: |
          set -e
          if grep -lR "PLACEHOLDER-DO-NOT-USE" docs/release/SIGNING-KEY.asc 2>/dev/null; then
            echo "::error::docs/release/SIGNING-KEY.asc still contains the PLACEHOLDER sentinel."
            echo "::error::Overwrite with the real production public-key body before tagging."
            exit 1
          fi

      # Generate a CycloneDX SBOM of the source tree. Captures Bun + Cargo
      # dependency graphs that produced the binaries downloaded above. Output is
      # attached to the release for downstream consumers and signed via OIDC by
      # the anchore action's call to attest-build-provenance.
      #
      # NOTE on `output-file`: anchore/sbom-action@v0.24.0 does NOT define any
      # action outputs (no `outputs:` block in its action.yml), so the previous
      # `${{ steps.sbom.outputs.fileName }}` reference always evaluated to the
      # empty string. Pin the local file path explicitly so the staging step
      # below can `cp` from a known location.
      - name: Generate SBOM (CycloneDX)
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          artifact-name: nimbus-${{ github.ref_name }}-sbom.cdx.json
          # Don't auto-attach to GitHub Release (we do it explicitly below to control filename).
          upload-release-assets: false
          upload-artifact: true

      - name: Stage release assets
        shell: bash
        run: |
          set -e
          mkdir -p dist/stage

          # actions/upload-artifact puts files under dist/<artifact-name>/<filename>.
          # The inner <filename> is ALREADY the final release name per the build
          # step (bun build --outfile <artifact-name>), so copying preserves the
          # end-user-facing filename exactly. That's what SHA256SUMS must list.

          # Raw binaries (every OS)
          cp dist/nimbus-gateway-linux-x64/nimbus-gateway-linux-x64*           dist/stage/
          cp dist/nimbus-cli-linux-x64/nimbus-cli-linux-x64*                   dist/stage/
          cp dist/nimbus-gateway-macos-x64/nimbus-gateway-macos-x64            dist/stage/
          cp dist/nimbus-cli-macos-x64/nimbus-cli-macos-x64                    dist/stage/
          cp dist/nimbus-gateway-macos-arm64/nimbus-gateway-macos-arm64        dist/stage/
          cp dist/nimbus-cli-macos-arm64/nimbus-cli-macos-arm64                dist/stage/
          cp dist/nimbus-gateway-windows-x64/nimbus-gateway-windows-x64.exe    dist/stage/
          cp dist/nimbus-cli-windows-x64/nimbus-cli-windows-x64.exe            dist/stage/

          # Linux installers + .asc sidecars
          cp dist/installers/*                                                  dist/stage/

          # Native installers built in dedicated OS jobs
          cp dist/nimbus-installer-msi/*.msi   dist/stage/
          cp dist/nimbus-installer-pkg/*.pkg   dist/stage/

          # Archives
          cp dist/archives/*                                                    dist/stage/

          # SBOM (path matches `output-file:` set on the SBOM step above).
          cp dist/sbom.cdx.json                                                "dist/stage/nimbus-${GITHUB_REF_NAME}-sbom.cdx.json"

          # Verify scripts (uploaded as release assets so users can curl them)
          cp scripts/release/nimbus-verify.sh                                   dist/stage/
          cp scripts/release/nimbus-verify.ps1                                  dist/stage/

          # Install scripts, as STANDALONE assets — not just bundled inside the
          # archives. README.md's quickstart tells people to fetch these straight
          # off the release:
          #   curl .../releases/latest/download/install.sh
          #   irm   .../releases/latest/download/install.ps1
          # `install.ps1` was never staged here, so that URL 404'd and the entire
          # Windows quickstart was dead — a platform-equality break (non-negotiable
          # #5) sitting on the front page. Staging all four keeps the documented
          # URLs true on every future release instead of depending on which files
          # happened to survive from an earlier one.
          cp scripts/install/unix/install.sh                                    dist/stage/
          cp scripts/install/unix/uninstall.sh                                  dist/stage/
          cp scripts/install/windows/install.ps1                                dist/stage/
          cp scripts/install/windows/uninstall.ps1                              dist/stage/

          # Stable-name aliases for the AppImage and .deb.
          #
          # `releases/latest/download/<name>` resolves an EXACT asset name — it does
          # not glob — so a versioned filename can never be linked from docs that
          # outlive one release. install.mdx and verify-your-download.mdx already
          # publish the unversioned names below, and every one of those URLs 404'd.
          # Aliasing here (rather than versioning the docs) keeps those commands
          # copy-pasteable forever.
          #
          # Safe for the signatures: GPG detached `.asc` signs CONTENT, not the
          # filename, so `gpg --verify Nimbus-x86_64.AppImage.asc
          # Nimbus-x86_64.AppImage` validates. And because this runs BEFORE
          # SHA256SUMS is computed over `dist/stage/*`, both names are listed and
          # `sha256sum -c` works whichever one the user downloaded.
          V="${GITHUB_REF_NAME#v}"
          cp "dist/stage/nimbus-headless-${V}-x86_64.AppImage"     dist/stage/Nimbus-x86_64.AppImage
          cp "dist/stage/nimbus-headless-${V}-x86_64.AppImage.asc" dist/stage/Nimbus-x86_64.AppImage.asc
          cp "dist/stage/nimbus-headless_${V}_amd64.deb"           dist/stage/nimbus_amd64.deb
          cp "dist/stage/nimbus-headless_${V}_amd64.deb.asc"       dist/stage/nimbus_amd64.deb.asc

          ls -la dist/stage/

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          set -e
          cd dist/stage
          # LC_ALL=C guarantees byte-identical output across runner images + locales.
          LC_ALL=C sha256sum * | LC_ALL=C sort -k2 > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS
          echo "=================="

      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -e
          bash scripts/sign-linux-gpg.sh dist/stage/SHA256SUMS
          ls -la dist/stage/SHA256SUMS*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          files: dist/stage/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Verify release assets are complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STAGE_DIR: dist/stage
        run: bun scripts/release/verify-release-assets.ts

  update-manifest:
    name: Publish updater manifest
    needs: publish-release
    # Skip for pre-release tags: production updater URL points at
    # `releases/latest/download/latest.json` which only resolves to the
    # non-prerelease "Latest" GitHub Release. Building a manifest for rc/
    # beta/alpha tags burns CI minutes producing an asset nobody reaches.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus
          permission-contents: write
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/
      - name: Flatten artifact dir
        run: |
          mkdir -p manifest-build
          cp dist/nimbus-gateway-linux-x64/nimbus-gateway-linux-x64* manifest-build/
          cp dist/nimbus-gateway-macos-x64/nimbus-gateway-macos-x64* manifest-build/
          cp dist/nimbus-gateway-macos-arm64/nimbus-gateway-macos-arm64* manifest-build/
          cp dist/nimbus-gateway-windows-x64/nimbus-gateway-windows-x64.exe* manifest-build/
      - name: Build latest.json
        working-directory: manifest-build
        run: |
          V="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          bun ../scripts/build-update-manifest.ts --version "$V" --output latest.json --base-url "$BASE"
      - name: Upload latest.json to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          files: manifest-build/latest.json

  alert-on-failure:
    name: Alert on release failure
    needs:
      - build-gateway
      - build-cli
      - build-msi
      - build-pkg
      - publish-release
      - update-manifest
    # failure() fires when ANY needed job FAILED. A skipped needed job counts as neutral (not a
    # failure), so this never fires spuriously on skips. Do NOT use always() — that would also
    # fire on a fully successful release. (plan-review #4)
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"
      - name: File release-health issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_KEY: run:${{ github.ref_name }}
          HEALTH_TITLE: "🚨 Release ${{ github.ref_name }} failed"
          HEALTH_BODY: "A job in the Release workflow for `${{ github.ref_name }}` failed — the published release may be missing assets. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bun scripts/release/open-health-issue.ts
