name: install-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/install/**"
      - "scripts/package-linux-installers.ts"
      - "scripts/release/connector-handshake-smoke.ts"
      - ".github/workflows/install-smoke.yml"
      - ".github/workflows/release.yml"
      - "packages/gateway/src/**"
      - "packages/cli/src/**"
      # The binary embeds the admin console (asserted by the /admin check) and is built from the
      # gateway's manifest and the lockfile, so a change to any of them changes what is installed.
      - "packages/admin-console/**"
      - "packages/gateway/package.json"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Decide smoke matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pick matrix
        id: pick
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FULL='["ubuntu-24.04","macos-14","windows-2022"]'
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Use the SHAs from the PR payload rather than an `origin/<branch>`
          # tracking ref: actions/checkout does not reliably map remote branch
          # refs on a pull_request checkout, and `origin/main` can fail with
          # "ambiguous argument". Both SHAs are present because fetch-depth: 0.
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if echo "$CHANGED" | grep -qE '^(scripts/install/|scripts/package-linux-installers\.ts|scripts/release/connector-handshake-smoke\.ts|\.github/workflows/(install-smoke|release)\.yml)'; then
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: ${{ matrix.os }} install smoke
    needs: scope
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.matrix) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # The Vault is OS-native, and on Linux that means libsecret. Installing
      # `secret-tool` alone is NOT enough: libsecret talks to a Secret Service
      # provider over D-Bus, so without a session bus and an unlocked keyring
      # the Gateway still aborts with "Vault operation failed". This block
      # reproduces what a desktop Linux user already has.
      #
      # A headless Linux box has none of it, which is why `nimbus init` fails
      # there — tracked separately as a launch blocker; see the Gate 1 runbook.
      - name: Provide a Linux keyring session (vault prerequisite)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus-x11
          # Export the bus + daemon addresses to every later step.
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

          # Starting the daemon is not enough on a fresh runner: there is no
          # keyring file, so it exposes no collection and secret-tool fails
          # with `Object does not exist at path .../collection/login`. Create
          # an unlocked, empty-password default keyring first and alias it as
          # the default collection.
          mkdir -p "$HOME/.local/share/keyrings"
          # Written with printf rather than a heredoc on purpose: a heredoc
          # body has to start at column 0, which would terminate this `run: |`
          # block scalar and make the whole workflow file invalid.
          printf '%s\n' \
            '[keyring]' \
            'display-name=login' \
            'ctime=0' \
            'mtime=0' \
            'lock-on-idle=false' \
            'lock-after=false' \
            > "$HOME/.local/share/keyrings/login.keyring"
          printf 'login' > "$HOME/.local/share/keyrings/default"

          # `--unlock` reads the password from stdin; empty matches the
          # empty-password keyring written above.
          eval "$(printf '' | gnome-keyring-daemon --unlock --components=secrets --daemonize)"
          echo "GNOME_KEYRING_CONTROL=${GNOME_KEYRING_CONTROL:-}" >> "$GITHUB_ENV"
          # Prove the Secret Service is actually answering before the smoke
          # test depends on it, so a keyring failure is diagnosed here rather
          # than surfacing later as an opaque gateway abort.
          echo -n "smoke-value" | secret-tool store --label=nimbus-smoke service nimbus-smoke key probe
          test "$(secret-tool lookup service nimbus-smoke key probe)" = "smoke-value"
          secret-tool clear service nimbus-smoke key probe
          echo "Secret Service responding."

      - name: Build Gateway + CLI
        run: bun run --filter '@nimbus/gateway' --filter '@nimbus/cli' build

      # Build outputs:
      #   CLI:     packages/cli/dist/nimbus      (Unix)
      #            packages/cli/dist/nimbus.exe  (Windows — Bun appends .exe automatically)
      #   Gateway: dist/nimbus-gateway           (Unix, repo root dist/)
      #            dist/nimbus-gateway.exe       (Windows, repo root dist/)

      # The sqlite-vec loadable extension. Every real release archive ships one beside the
      # gateway binary (release.yml runs this exact script into `dist` before staging any
      # archive/installer) and both install.ps1/install.sh have a sidecar-copy step that only
      # this job's served-release legs exercise — so it has to be real, not a stub, to prove
      # anything. `bun install` on this runner already resolved the platform-specific
      # `sqlite-vec-<os>-<arch>` optional dependency the same way the release build does, so
      # this reuses that same real native module rather than fabricating one — producing
      # dist/vec0.so (Linux), dist/vec0.dylib (macOS) or dist/vec0.dll (Windows).
      - name: Copy sqlite-vec sidecar
        run: bun scripts/copy-vec0-sidecar.ts --dest dist

      # nimbus-sandbox-helper.exe (I15): win32.ts resolves it from dirname(process.execPath), the
      # same way tryLoadFromSidecar() resolves vec0.dll above, so it has to travel beside the
      # gateway binary into every archive and installer — mirrors release.yml's own
      # "Build sandbox helper (Windows)" step. Unlike vec0.dll, install.ps1 now REQUIRES this
      # file to be present (C1): without it every connector spawn refuses to run unsandboxed.
      - name: Build sandbox helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun run build:sandbox-helper:win32
          Copy-Item packages/gateway/src-native/sandbox-helper-win32/nimbus-sandbox-helper.exe dist/

      - name: Stage a fake release dir (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          # Copy real built binaries into the staging dir at the same level as the install script
          cp packages/cli/dist/nimbus         "$STAGE/nimbus"
          cp dist/nimbus-gateway              "$STAGE/nimbus-gateway"
          chmod +x "$STAGE/nimbus" "$STAGE/nimbus-gateway"
          # The sqlite-vec sidecar (and, on macOS, the full SQLite it needs to load — #1505) travel
          # beside the binaries in every real release, and install.sh's sidecar-copy loop picks
          # them up from here. Without them this LOCAL install would be one no user receives, and
          # the "Vector search" assertion in the quickstart step below would be testing that.
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp dist/vec0.so "$STAGE/vec0.so"
          else
            cp dist/vec0.dylib "$STAGE/vec0.dylib"
            test -n "${NIMBUS_SQLITE_PATH:-}" || {
              echo "::error::NIMBUS_SQLITE_PATH unset — setup-nimbus-ci did not build the bundled SQLite"; exit 1; }
            cp "$NIMBUS_SQLITE_PATH" "$STAGE/libsqlite3.dylib"
          fi
          cp scripts/install/unix/install.sh   "$STAGE/"
          cp scripts/install/unix/uninstall.sh "$STAGE/"
          chmod +x "$STAGE/install.sh" "$STAGE/uninstall.sh"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Run install.sh + verify (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Use a sandboxed HOME so the smoke test doesn't pollute the runner's
          # actual rc files. Then source the rc file the installer wrote
          # so we can invoke `nimbus` directly.
          export HOME="$RUNNER_TEMP/fake-home"
          mkdir -p "$HOME"
          "$STAGE/install.sh" --yes
          for rc in "$HOME/.zshrc" "$HOME/.bash_profile" "$HOME/.bashrc" "$HOME/.profile"; do
            if [ -f "$rc" ]; then
              # shellcheck disable=SC1090
              . "$rc"
              break
            fi
          done
          # Smoke: both work without a running Gateway.
          nimbus --help
          nimbus --version

      - name: Quickstart smoke — init + why (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # No `NIMBUS_SKIP_EMBEDDING_RUNTIME` here — deliberately. This job used
        # to set it because the gateway would not bind its socket until the
        # embedding runtime finished, which on a cold machine meant fetching
        # MiniLM from a third-party CDN; the macOS runner sat at "starting
        # embedding runtime" for 300 s without binding. #928 removed that
        # coupling (bind-first: the runtime constructs in the background and a
        # failed fetch settles to `unavailable` while the gateway keeps
        # serving), so the skip now hides the very configuration real users run.
        #
        # Green is still NOT coupled to that CDN: nothing asserted below needs a
        # vector — `index.demoSymbol` reads indexed symbols and `nimbus why`
        # uses blame + graph lanes. The embedding assertion after the quickstart
        # checks that embeddings are ENABLED, never that the model finished.
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/fake-home"

          # `nimbus init` prints only the PATH of the gateway log, never its
          # contents, so a failure here is undiagnosable from the CI log alone.
          # Dump it on any non-zero exit. Both platform log locations are
          # probed because dataDir is XDG on Linux and Application Support on
          # macOS.
          dump_gateway_log() {
            echo "----- gateway log (post-failure diagnostics) -----"
            for d in "$HOME/.local/share/nimbus/logs" \
                     "$HOME/Library/Application Support/Nimbus/logs"; do
              [ -d "$d" ] || continue
              for f in "$d"/*.log; do
                [ -f "$f" ] || continue
                echo "== $f =="
                tail -200 "$f"
              done
            done
            # The gateway log's last line is only the last thing WRITTEN, not
            # necessarily where execution stopped — nothing after the embedding
            # stage logs to stdout. Probe the actual end state instead of
            # inferring it. On macOS also check the /private-prefixed path:
            # /var and /tmp are symlinks into /private, and a bind/connect
            # mismatch across that boundary would look exactly like a hang.
            echo "----- socket + process probe -----"
            # Every expansion needs a default: this runs under `set -u`, where
            # a bare $XDG_RUNTIME_DIR aborts the probe on macOS (unset there).
            for d in "${TMPDIR:-/tmp}" "/private${TMPDIR:-/tmp}" /tmp "${XDG_RUNTIME_DIR:-}"; do
              [ -n "$d" ] && [ -d "$d" ] || continue
              ls -la "$d" 2>/dev/null | grep -i nimbus || true
            done
            echo "-- contents of any nimbus socket dir --"
            for d in "${TMPDIR:-/tmp}/nimbus" "/tmp/nimbus"; do
              [ -d "$d" ] && ls -la "$d" || true
            done
            echo "-- live gateway processes --"
            ps aux 2>/dev/null | grep "[n]imbus-gateway" || echo "(none)"
            # The gateway stays alive but never binds, and nothing after the
            # embedding stage writes to stdout — so the log cannot say where it
            # stopped. Sample the live process for an actual stack; this needs
            # no product change and no elevated privileges for our own process.
            if [ "$(uname)" = "Darwin" ]; then
              gwpid="$(pgrep -f nimbus-gateway | head -1 || true)"
              if [ -n "$gwpid" ]; then
                echo "-- sample of pid $gwpid --"
                sample "$gwpid" 3 -mayDie 2>&1 | head -120 || true
              fi
            fi
            echo "----- end gateway log -----"
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then dump_gateway_log; fi; exit "$rc"' EXIT

          # macOS keychain setup MUST live here, after HOME is exported, not in
          # an earlier step: `security default-keychain -s` records the choice
          # in $HOME/Library/Preferences, and the gateway inherits this sandboxed
          # HOME. Setting it under the runner's real HOME leaves the gateway
          # still resolving the locked login keychain — which blocks forever in
          # a GUI authorization prompt (see the socket probe below).
          if [ "$(uname)" = "Darwin" ]; then
            mkdir -p "$HOME/Library/Preferences" "$HOME/Library/Keychains"
            security create-keychain -p "" nimbus-smoke.keychain
            security set-keychain-settings -u nimbus-smoke.keychain
            security unlock-keychain -p "" nimbus-smoke.keychain
            security default-keychain -s nimbus-smoke.keychain
            security list-keychains -d user -s nimbus-smoke.keychain
            # Prove a non-interactive add/read/delete works under THIS HOME
            # before the smoke test depends on it.
            security add-generic-password -a nimbus-smoke -s nimbus-smoke -w probe
            test "$(security find-generic-password -a nimbus-smoke -s nimbus-smoke -w)" = "probe"
            security delete-generic-password -a nimbus-smoke -s nimbus-smoke >/dev/null
            echo "Keychain accepts non-interactive writes under $HOME."
          fi

          for rc in "$HOME/.zshrc" "$HOME/.bash_profile" "$HOME/.bashrc" "$HOME/.profile"; do
            if [ -f "$rc" ]; then . "$rc"; break; fi
          done

          REPO="$RUNNER_TEMP/demo-repo"
          mkdir -p "$REPO" && cd "$REPO"
          printf 'export function verifyToken(raw: string): boolean {\n  return raw.length > 0;\n}\n' > auth.ts
          git init -q
          git config user.email "smoke@example.com"
          git config user.name  "Smoke Test"
          git add -A && git commit -q -m "add auth helpers"

          # The read-only HTTP API starts ONLY when NIMBUS_HTTP_PORT is a positive integer at the
          # moment the gateway spawns (platform/assemble.ts collectSidecarsFromEnv), and `nimbus
          # init` is what spawns it here — so this has to be exported BEFORE init, not before the
          # curl below. A fixed port, because the runner is ours alone for the job's lifetime.
          export NIMBUS_HTTP_PORT=17474
          # setup-nimbus-ci exports NIMBUS_SQLITE_PATH (the build tree's libsqlite3.dylib) for the
          # whole job on macOS. A user has no such variable, so drop it: the "Vector search"
          # assertion below must be satisfied by the libsqlite3.dylib install.sh placed beside
          # the installed gateway, not by a path into this checkout.
          unset NIMBUS_SQLITE_PATH

          nimbus init | tee "$RUNNER_TEMP/init.log"
          # `nimbus init` EXITS 0 even when indexing fails: syncAndPickDemo()
          # catches every error and degrades to null, by design, because the
          # config edit is the durable half of the work. So the exit code proves
          # nothing here and these string assertions are load-bearing.
          if grep -q "indexing did not complete" "$RUNNER_TEMP/init.log"; then
            echo "::error::nimbus init reported that indexing did not complete"; exit 1
          fi
          # Positive proof, and race-free: "Try it:" is printed ONLY when
          # index.demoSymbol returned a real symbol, which requires a populated
          # index. The generic "Next:" block is what an empty index produces.
          grep -q "Try it:" "$RUNNER_TEMP/init.log" || {
            echo "::error::nimbus init did not produce a demo symbol — index is empty"; exit 1; }

          # Regression guard for #895 specifically: this exact invocation
          # returned "Invalid serviceId" and exit 1 before the fix.
          nimbus connector sync filesystem
          nimbus why auth.ts:1 | tee "$RUNNER_TEMP/why.log"
          grep -q "## Authorship" "$RUNNER_TEMP/why.log" || {
            echo "::error::nimbus why produced no Authorship section"; exit 1; }
          grep -q "Smoke Test" "$RUNNER_TEMP/why.log" || {
            echo "::error::nimbus why did not resolve the commit author"; exit 1; }

          # The gateway logs `[gateway] embeddings: <state>` at bind time (#928).
          # Assert embeddings are genuinely ON in this run — the guard against
          # someone quietly restoring NIMBUS_SKIP_EMBEDDING_RUNTIME and turning
          # this job back into a test of a configuration nobody ships.
          #
          # `disabled` is the ONLY failing state. `warming` and `unavailable`
          # both pass on purpose: the first means the fetch is still running,
          # the second that it failed — and bind-first says neither may stop the
          # gateway serving. Requiring `ready` would couple green CI to a
          # third-party CDN, which is exactly what made this job flaky before.
          embed_line=""
          for d in "$HOME/.local/share/nimbus/logs" \
                   "$HOME/Library/Application Support/Nimbus/logs"; do
            [ -d "$d" ] || continue
            for f in "$d"/*.log; do
              [ -f "$f" ] || continue
              line=$(grep -h "\[gateway\] embeddings:" "$f" | tail -1 || true)
              [ -n "$line" ] && embed_line="$line"
            done
          done
          if [ -z "$embed_line" ]; then
            echo "::error::gateway never logged its embedding readiness — expected '[gateway] embeddings: <state>'"
            exit 1
          fi
          echo "observed: $embed_line"
          case "$embed_line" in
            *"embeddings: disabled"*)
              echo "::error::embeddings are DISABLED — the skip flag is back, so this job no longer covers the shipped first-run configuration"
              exit 1
              ;;
          esac

          # sqlite-vec must actually LOAD in the installed binary — semantic search, hybrid ranking
          # and session recall are all off without it, and the only other signal is one log line.
          # `nimbus doctor`'s exit code is deliberately ignored: other lines (no LLM, no connector
          # credentials) legitimately fail on a bare runner. The Vector search line is the claim.
          nimbus doctor > "$RUNNER_TEMP/doctor.log" 2>&1 || true
          cat "$RUNNER_TEMP/doctor.log"
          grep -qF "[ok] Vector search" "$RUNNER_TEMP/doctor.log" || {
            echo "::error::nimbus doctor did not report '[ok] Vector search' — sqlite-vec is not loaded in the installed binary"; exit 1; }
          # macOS: an [ok] alone is not enough. The PAL falls back to Homebrew's SQLite after the
          # bundled copy, and this runner image HAS Homebrew SQLite, so the line would stay green
          # with the bundled libsqlite3.dylib missing or broken. Doctor names the library that was
          # installed ("using full SQLite at <path>"); require it to be the one beside the
          # installed gateway. Both spellings, in case execPath resolves symlinks.
          if [ "$(uname)" = "Darwin" ]; then
            BIN_DIR="$HOME/.local/bin"
            BIN_DIR_REAL="$(cd "$BIN_DIR" && pwd -P)"
            if ! grep -qF "using full SQLite at $BIN_DIR/libsqlite3.dylib" "$RUNNER_TEMP/doctor.log" &&
               ! grep -qF "using full SQLite at $BIN_DIR_REAL/libsqlite3.dylib" "$RUNNER_TEMP/doctor.log"; then
              echo "::error::vector search did not load through the installed $BIN_DIR/libsqlite3.dylib — see the Vector search line above for the library that was used"
              exit 1
            fi
          fi

          # The HTTP API answers, and serves its OpenAPI document from INSIDE the compiled binary
          # (an embedded asset, not a path relative to the source tree). Retried briefly: the
          # sidecar binds during gateway boot, which `nimbus init` does not wait on specifically.
          API="http://127.0.0.1:${NIMBUS_HTTP_PORT}"
          code=""
          for _ in $(seq 1 30); do
            code="$(curl -s -o "$RUNNER_TEMP/openapi.json" -w '%{http_code}' "$API/v1/openapi.json" || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || {
            echo "::error::GET /v1/openapi.json returned '${code}', expected 200 — is the HTTP API up on $API?"; exit 1; }
          grep -q '"openapi"' "$RUNNER_TEMP/openapi.json" || {
            echo "::error::GET /v1/openapi.json returned 200 but the body is not an OpenAPI document"; head -c 400 "$RUNNER_TEMP/openapi.json"; exit 1; }

          # The admin console, embedded in the binary and bearer-gated by the vault key
          # http_api.deployment_token. Negative control first: without a token the route must
          # refuse — otherwise the 200 below would not prove the bearer was checked at all.
          code="$(curl -s -o /dev/null -w '%{http_code}' "$API/admin" || true)"
          [ "$code" = "401" ] || {
            echo "::error::GET /admin without a bearer returned '${code}', expected 401"; exit 1; }
          # The token is resolved per request, so setting it on the running gateway is enough.
          # `vault.set` is HITL-gated (I2); NIMBUS_SCRIPT_CONSENT_SOURCE answers that ONE prompt
          # through the CLI's own scripted-consent handler — the gate still fires.
          ADMIN_TOKEN="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::add-mask::$ADMIN_TOKEN"
          printf '%s\n' '{"approved":true,"note":"install-smoke admin token"}' > "$RUNNER_TEMP/consent.jsonl"
          NIMBUS_SCRIPT_CONSENT_SOURCE="$RUNNER_TEMP/consent.jsonl" \
            nimbus vault set http_api.deployment_token "$ADMIN_TOKEN"
          code="$(curl -s -o "$RUNNER_TEMP/admin.html" -w '%{http_code}' \
            -H "Authorization: Bearer $ADMIN_TOKEN" "$API/admin" || true)"
          if [ "$code" != "200" ]; then
            echo "::error::GET /admin with the bearer returned '${code}', expected 200 (503 = the admin console was not embedded in this binary)"
            cat "$RUNNER_TEMP/admin.html" || true
            exit 1
          fi
          grep -q "<title>Nimbus Admin Console</title>" "$RUNNER_TEMP/admin.html" || {
            echo "::error::GET /admin returned 200 but not the admin console's index.html"; head -c 400 "$RUNNER_TEMP/admin.html"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $ADMIN_TOKEN" "$API/admin/main.js" || true)"
          [ "$code" = "200" ] || {
            echo "::error::GET /admin/main.js returned '${code}', expected 200 — index.html is embedded but its script is not"; exit 1; }

          nimbus stop || true

      # A bundled connector, run out of the INSTALLED gateway binary, must answer an MCP client
      # with a non-empty tool list. Stricter than test:connector-boot on purpose: there a
      # "<VAR> is not set" refusal passes; here it fails (see the script's header).
      - name: Connector answers an MCP client (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release/connector-handshake-smoke.ts "$RUNNER_TEMP/fake-home/.local/bin/nimbus-gateway" github

        # Name is quoted: an unquoted ` #932)` would be parsed as a YAML comment
        # and silently truncate the step name in the Actions UI.
      - name: "Locked keychain fails fast, never hangs (macOS, issue #932)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Issue #932: a LOCKED keychain used to send the gateway into
          # AuthorizationCopyRights -> synchronous XPC -> mach_msg and block
          # forever. Because bun:ffi calls are synchronous, that also froze the
          # event loop: no timeout, no log line, no bound socket. `nimbus init`
          # simply hung — the worst possible first-run experience.
          #
          # This step recreates exactly that state. It runs AFTER the smoke test
          # so it inherits a HOME that is already installed and initialised: the
          # config and the Vault keys exist, so gateway startup is guaranteed to
          # touch the keychain and cannot fail early for an unrelated reason.
          export HOME="$RUNNER_TEMP/fake-home"
          LOG="$RUNNER_TEMP/locked.log"
          RCFILE="$RUNNER_TEMP/locked.rc"
          GW="$HOME/.local/bin/nimbus-gateway"
          rm -f "$RCFILE"

          # Harness faults must not masquerade as product faults: a missing
          # binary would otherwise be reported as "no remedy in the output".
          if [ ! -x "$GW" ]; then
            echo "::error::harness broken: $GW is missing or not executable"; exit 1
          fi

          security lock-keychain nimbus-smoke.keychain
          echo "Locked nimbus-smoke.keychain; starting gateway."

          # NOTE: macOS has no GNU `timeout` (and no `gtimeout` without brew
          # coreutils), so the watchdog is written by hand. The sentinel file is
          # the exit signal rather than `kill -0`, because a finished background
          # child stays a waitable zombie and `kill -0` keeps succeeding on it —
          # which would report every run as a hang.
          # `set +e` inside the subshell is load-bearing: subshells inherit
          # errexit, so without it a non-zero gateway exit aborts the subshell
          # BEFORE the sentinel is written — and every real failure then looks
          # like a hang. (Caught by rehearsing this step locally; a passing
          # exit-0 case hid it, because only non-zero exits trip errexit.)
          ( set +e; "$GW" > "$LOG" 2>&1; echo "$?" > "$RCFILE" ) &
          runner_pid=$!
          for _ in $(seq 1 90); do
            [ -f "$RCFILE" ] && break
            sleep 1
          done

          if [ -f "$RCFILE" ]; then
            rc="$(cat "$RCFILE")"
            hung=0
          else
            rc="-"
            hung=1
            kill -9 "$runner_pid" 2>/dev/null || true
            pkill -f 'nimbus-gateway' 2>/dev/null || true
          fi
          echo "gateway exited rc=$rc hung=$hung"
          echo "----- gateway output -----"
          cat "$LOG" || true
          echo "----- end gateway output -----"

          # Unlock again so nothing downstream inherits a locked keychain.
          security unlock-keychain -p "" nimbus-smoke.keychain || true

          if grep -qi "command not found" "$LOG"; then
            echo "::error::harness broken: a command used by this step is unavailable"; exit 1
          fi
          if [ "$hung" -eq 1 ]; then
            echo "::error::gateway HUNG on a locked keychain (90s watchdog) — #932 has regressed"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::gateway exited 0 with a locked keychain — expected a fast, explicit failure"
            exit 1
          fi
          # A fast failure is only useful if it says what to do about it.
          grep -q "security unlock-keychain" "$RUNNER_TEMP/locked.log" || {
            echo "::error::failed fast but without the actionable keychain remedy"; exit 1; }
          grep -q "Nimbus never prompts" "$RUNNER_TEMP/locked.log" || {
            echo "::error::message does not explain that Nimbus deliberately never prompts"; exit 1; }
          echo "Locked keychain produced a fast, actionable failure (rc=$rc)."

      - name: Run uninstall.sh + verify (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Same sandboxed HOME the install step used — uninstall.sh resolves
          # its removal targets and rc files relative to it.
          export HOME="$RUNNER_TEMP/fake-home"
          "$STAGE/uninstall.sh" --yes
          for bin in nimbus nimbus-gateway; do
            if [ -e "$HOME/.local/bin/$bin" ]; then
              echo "::error::uninstall did not remove $bin"
              exit 1
            fi
          done
          # Verify the marker block is gone from any rc file install.sh wrote to
          for rc in "$HOME/.zshrc" "$HOME/.bash_profile" "$HOME/.bashrc" "$HOME/.profile"; do
            if [ -f "$rc" ] && grep -qF "# >>> nimbus PATH >>>" "$rc"; then
              echo "::error::uninstall did not strip the PATH marker block from $rc"
              exit 1
            fi
          done

      # ---------------------------------------------------------------------
      # Served-release (remote-mode) proof (Unix).
      #
      # Everything above this point is LOCAL mode: binaries staged BESIDE the
      # install script, no network. Task 3-5's scripts/install/install-remote*
      # tests already run the real installer end-to-end against a served
      # fixture in CI (test:ci's `scripts` target) — but with STUB binaries.
      # The one gap those tests cannot close is that they never run the REAL
      # binaries this job just built through the remote path. These steps
      # close it: pack the SAME staged binaries from $STAGE into a
      # correctly-named release archive, serve it over 127.0.0.1, and drive
      # install.sh's --from-release path against it.
      - name: Pack a served-release fixture from the staged binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="0.0.0-test"
          SERVE="$RUNNER_TEMP/serve"
          PAYLOAD="$RUNNER_TEMP/remote-payload"
          mkdir -p "$SERVE" "$PAYLOAD/bin"

          # Reuse the binaries this job already built and staged — do not
          # rebuild, do not use stand-ins.
          cp "$STAGE/nimbus"         "$PAYLOAD/bin/nimbus"
          cp "$STAGE/nimbus-gateway" "$PAYLOAD/bin/nimbus-gateway"
          chmod +x "$PAYLOAD/bin/nimbus" "$PAYLOAD/bin/nimbus-gateway"

          # sqlite-vec sidecar — real archives ship one (release.yml's stage-macos-*/
          # headless-bundle steps; scripts/package-linux-installers.ts's stageVec0()).
          # Placed in $PAYLOAD/bin regardless of OS: the packing branch below packs the
          # Linux tarball FROM $PAYLOAD (bin/ prefix survives, matching the real
          # bin/vec0.so layout) but the macOS tarball FROM $PAYLOAD/bin (flattened to
          # top-level, matching the real top-level vec0.dylib layout) — so one source
          # location produces the correct extracted layout on both.
          if [ "$RUNNER_OS" = "Linux" ]; then
            VEC0_SRC="dist/vec0.so"
          else
            VEC0_SRC="dist/vec0.dylib"
          fi
          cp "$VEC0_SRC" "$PAYLOAD/bin/$(basename "$VEC0_SRC")"

          # The full SQLite that sidecar needs to load on macOS (#1505). Real macOS archives ship
          # one, so the served fixture must too — otherwise the assertion below would prove nothing
          # about install.sh's own copy loop. Taken from NIMBUS_SQLITE_PATH, which setup-nimbus-ci
          # exported after building it, for release.yml's reason: one artifact per job, not two.
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -n "${NIMBUS_SQLITE_PATH:-}" || {
              echo "::error::NIMBUS_SQLITE_PATH unset — setup-nimbus-ci did not build the bundled SQLite"; exit 1; }
            cp "$NIMBUS_SQLITE_PATH" "$PAYLOAD/bin/libsqlite3.dylib"
          fi

          # Names + layout MUST match scripts/install/lib/release-assets.ts's
          # assetNameFor() and the real release.yml packaging: the Linux
          # tarball is versioned and nests binaries under bin/; the macOS
          # tarball is unversioned and top-level. Do not "harmonise" these.
          if [ "$RUNNER_OS" = "Linux" ]; then
            ASSET="nimbus-headless-linux-amd64-v${VER}.tar.gz"
            tar -czf "$SERVE/$ASSET" -C "$PAYLOAD" .
          else
            ARCH="$(uname -m)"
            if [ "$ARCH" = "arm64" ]; then
              ASSET="nimbus-headless-macos-arm64.tar.gz"
            else
              ASSET="nimbus-headless-macos-x64.tar.gz"
            fi
            tar -czf "$SERVE/$ASSET" -C "$PAYLOAD/bin" .
          fi

          # Real SHA256SUMS format: "<64 lowercase hex><TWO spaces><filename>".
          # Written by hand rather than trusting sha256sum/shasum's own
          # separator so the format is guaranteed regardless of which tool a
          # given runner has.
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$SERVE/$ASSET" | cut -d' ' -f1)"
          else
            digest="$(shasum -a 256 "$SERVE/$ASSET" | cut -d' ' -f1)"
          fi
          printf '%s  %s\n' "$digest" "$ASSET" > "$SERVE/SHA256SUMS"

          echo "REMOTE_VER=$VER" >> "$GITHUB_ENV"
          echo "REMOTE_ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Start the release fixture server (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/install/serve-fixture.ts "$RUNNER_TEMP/serve" 8788 &
          echo $! > "$RUNNER_TEMP/serve.pid"
          for _ in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:8788/SHA256SUMS" >/dev/null && break
            sleep 0.2
          done
          curl -fsS "http://127.0.0.1:8788/SHA256SUMS" >/dev/null || {
            echo "::error::release fixture server never answered"; exit 1; }

      - name: Install from a served release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # A FRESH sandboxed HOME, distinct from the local-mode HOME above —
          # the runner's real profile stays untouched, and this run cannot be
          # satisfied by a leftover local-mode install.
          export HOME="$RUNNER_TEMP/fake-home-remote"
          mkdir -p "$HOME"
          NIMBUS_INSTALL_BASE_URL="http://127.0.0.1:8788" \
            sh scripts/install/unix/install.sh --from-release "$REMOTE_VER" --yes \
            | tee "$RUNNER_TEMP/remote-install.log"

          # Asserting only that the binary exists would also pass under LOCAL
          # mode — these two markers are printed ONLY by the remote fetch +
          # verify path (fetch_release / verify), so they prove the remote
          # path actually ran.
          grep -q "Downloading" "$RUNNER_TEMP/remote-install.log" || {
            echo "::error::installer never reported a download — the remote path did not run"; exit 1; }
          grep -q "sha256 verified" "$RUNNER_TEMP/remote-install.log" || {
            echo "::error::installer never reported sha256 verification — the remote path did not run"; exit 1; }

          test -x "$HOME/.local/bin/nimbus" || { echo "::error::remote install did not place the binary"; exit 1; }

          # Proves install.sh's sidecar-copy loop (the `for cand in ... vec0.so vec0.dylib
          # ... bin/vec0.so bin/vec0.dylib` block) actually ran against the served archive,
          # not just that binaries landed — the whole reason this job packs a real sidecar.
          if [ "$RUNNER_OS" = "Linux" ]; then VEC0_NAME="vec0.so"; else VEC0_NAME="vec0.dylib"; fi
          test -f "$HOME/.local/bin/$VEC0_NAME" || {
            echo "::error::remote install did not place the sqlite-vec sidecar ($VEC0_NAME) — the sidecar-copy path in install.sh did not run"; exit 1; }

          # Same proof for the full SQLite build (#1505). On macOS the sidecar above is INERT
          # without it, so an install that placed one and not the other is an install with no
          # vector search — which is exactly the state this pair of files exists to end.
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -f "$HOME/.local/bin/libsqlite3.dylib" || {
              echo "::error::remote install did not place libsqlite3.dylib — the sqlite-copy path in install.sh did not run, and vec0.dylib cannot load without it"; exit 1; }
          fi

          "$HOME/.local/bin/nimbus" --version

      - name: Stop the release fixture server (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: kill "$(cat "$RUNNER_TEMP/serve.pid")" 2>/dev/null || true

      - name: Stage a fake release dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item packages\cli\dist\nimbus.exe             $stage\
          Copy-Item dist\nimbus-gateway.exe                  $stage\
          Copy-Item dist\nimbus-sandbox-helper.exe           $stage\
          # The sqlite-vec sidecar ships beside the binaries in the real Windows zip and install.ps1
          # copies it from here; without it this local install is one no user receives, and the
          # "Vector search" assertion in the quickstart step would be testing that.
          Copy-Item dist\vec0.dll                            $stage\
          Copy-Item scripts\install\windows\install.ps1      $stage\
          Copy-Item scripts\install\windows\uninstall.ps1    $stage\
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run install.ps1 + verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Sandbox LOCALAPPDATA so the smoke test doesn't write to the runner's
          # real install dir. The PATH update still hits HKCU\Environment for
          # the user the runner runs as — that's accepted because runners are
          # disposable.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "fake-localappdata"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          & "$env:STAGE\install.ps1" -Yes
          $userPath = [Environment]::GetEnvironmentVariable("PATH", "User")
          $env:PATH = "$userPath;$env:PATH"
          # Smoke: both work without a running Gateway.
          nimbus --help
          nimbus --version

      - name: Quickstart smoke — init + why (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "fake-localappdata"
          $userPath = [Environment]::GetEnvironmentVariable("PATH","User")
          $env:PATH = "$userPath;$env:PATH"

          $repo = Join-Path $env:RUNNER_TEMP "demo-repo"
          New-Item -ItemType Directory -Path $repo -Force | Out-Null
          Set-Location $repo
          "export function verifyToken(raw: string): boolean {`n  return raw.length > 0;`n}" |
            Set-Content -Path (Join-Path $repo "auth.ts") -Encoding utf8
          git init -q
          git config user.email "smoke@example.com"
          git config user.name  "Smoke Test"
          git add -A; git commit -q -m "add auth helpers"

          # The read-only HTTP API starts ONLY when NIMBUS_HTTP_PORT is set at the moment the
          # gateway spawns, and `nimbus init` is what spawns it — so export it BEFORE init.
          $env:NIMBUS_HTTP_PORT = "17474"

          $init = nimbus init 2>&1 | Out-String
          Write-Host $init
          # `nimbus init` exits 0 even when indexing fails (syncAndPickDemo
          # degrades to null by design), so these string checks are the real
          # assertions — the exit code proves nothing.
          if ($init -match "indexing did not complete") {
            Write-Error "nimbus init reported that indexing did not complete"; exit 1
          }
          # Positive, race-free proof: "Try it:" appears only when
          # index.demoSymbol returned a real symbol from a populated index.
          if ($init -notmatch "Try it:") {
            Write-Error "nimbus init did not produce a demo symbol — index is empty"; exit 1
          }

          # Regression guard for #895: this exact call returned
          # "Invalid serviceId" and exit 1 before the fix.
          nimbus connector sync filesystem
          $why = nimbus why auth.ts:1 2>&1 | Out-String
          Write-Host $why
          if ($why -notmatch "## Authorship") {
            Write-Error "nimbus why produced no Authorship section"; exit 1
          }
          if ($why -notmatch "Smoke Test") {
            Write-Error "nimbus why did not resolve the commit author"; exit 1
          }

          # Same guard as the Unix leg: prove embeddings are ENABLED, never that
          # the model finished. Windows never set NIMBUS_SKIP_EMBEDDING_RUNTIME,
          # so this leg has always exercised the shipped configuration — the
          # assertion keeps it that way.
          $logDir = Join-Path $env:LOCALAPPDATA "Nimbus\data\logs"
          $embedLine = $null
          if (Test-Path $logDir) {
            $embedLine = Get-ChildItem -Path $logDir -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { Select-String -Path $_.FullName -Pattern '\[gateway\] embeddings:' } |
              Select-Object -Last 1
          }
          if ($null -eq $embedLine) {
            Write-Error "gateway never logged its embedding readiness — expected '[gateway] embeddings: <state>'"
            exit 1
          }
          Write-Host "observed: $($embedLine.Line)"
          if ($embedLine.Line -match 'embeddings: disabled') {
            Write-Error "embeddings are DISABLED — this job no longer covers the shipped first-run configuration"
            exit 1
          }

          # sqlite-vec must LOAD in the installed binary. doctor's exit code is ignored on purpose
          # (other lines legitimately fail on a bare runner) and LASTEXITCODE is reset so the
          # Actions pwsh wrapper does not fail the step on it later.
          $doctor = nimbus doctor 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          Write-Host $doctor
          if ($doctor -notmatch [regex]::Escape("[ok] Vector search")) {
            Write-Error "nimbus doctor did not report '[ok] Vector search' — sqlite-vec is not loaded in the installed binary"
            exit 1
          }

          # curl.exe (not Invoke-WebRequest): it reports a status code without throwing on non-2xx,
          # and behaves the same under Windows PowerShell 5.1 and pwsh.
          $api = "http://127.0.0.1:$($env:NIMBUS_HTTP_PORT)"
          $openapiFile = Join-Path $env:RUNNER_TEMP "openapi.json"
          $code = ""
          for ($i = 0; $i -lt 30; $i++) {
            $code = curl.exe -s -o $openapiFile -w "%{http_code}" "$api/v1/openapi.json"
            if ($code -eq "200") { break }
            Start-Sleep -Seconds 1
          }
          if ($code -ne "200") {
            Write-Error "GET /v1/openapi.json returned '$code', expected 200 — is the HTTP API up on $api?"
            exit 1
          }
          if ((Get-Content -Raw $openapiFile) -notmatch '"openapi"') {
            Write-Error "GET /v1/openapi.json returned 200 but the body is not an OpenAPI document"
            exit 1
          }

          # Admin console: negative control first (no bearer → 401), then set the vault key the
          # route is gated on and expect the embedded index.html. vault.set is HITL-gated (I2);
          # NIMBUS_SCRIPT_CONSENT_SOURCE answers that one prompt via the CLI's scripted handler.
          $code = curl.exe -s -o NUL -w "%{http_code}" "$api/admin"
          if ($code -ne "401") {
            Write-Error "GET /admin without a bearer returned '$code', expected 401"
            exit 1
          }
          $adminToken = [guid]::NewGuid().ToString("N") + [guid]::NewGuid().ToString("N")
          Write-Host "::add-mask::$adminToken"
          $consentFile = Join-Path $env:RUNNER_TEMP "consent.jsonl"
          '{"approved":true,"note":"install-smoke admin token"}' |
            Set-Content -Path $consentFile -Encoding ascii
          $env:NIMBUS_SCRIPT_CONSENT_SOURCE = $consentFile
          nimbus vault set http_api.deployment_token $adminToken
          $vaultExit = $LASTEXITCODE
          Remove-Item Env:\NIMBUS_SCRIPT_CONSENT_SOURCE
          if ($vaultExit -ne 0) {
            Write-Error "nimbus vault set http_api.deployment_token exited $vaultExit"
            exit 1
          }
          $adminFile = Join-Path $env:RUNNER_TEMP "admin.html"
          $code = curl.exe -s -o $adminFile -w "%{http_code}" -H "Authorization: Bearer $adminToken" "$api/admin"
          if ($code -ne "200") {
            if (Test-Path $adminFile) { Get-Content -Raw $adminFile | Write-Host }
            Write-Error "GET /admin with the bearer returned '$code', expected 200 (503 = the admin console was not embedded in this binary)"
            exit 1
          }
          if ((Get-Content -Raw $adminFile) -notmatch [regex]::Escape("<title>Nimbus Admin Console</title>")) {
            Write-Error "GET /admin returned 200 but not the admin console's index.html"
            exit 1
          }
          $code = curl.exe -s -o NUL -w "%{http_code}" -H "Authorization: Bearer $adminToken" "$api/admin/main.js"
          if ($code -ne "200") {
            Write-Error "GET /admin/main.js returned '$code', expected 200 — index.html is embedded but its script is not"
            exit 1
          }
          $global:LASTEXITCODE = 0

          nimbus stop

      # Mirrors the Unix step: a bundled connector, run out of the INSTALLED gateway binary, must
      # answer an MCP client with a non-empty tool list; a credential refusal is a failure here.
      - name: Connector answers an MCP client (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gw = Join-Path $env:RUNNER_TEMP "fake-localappdata\Programs\Nimbus\bin\nimbus-gateway.exe"
          bun scripts/release/connector-handshake-smoke.ts $gw github
          if ($LASTEXITCODE -ne 0) {
            Write-Error "connector handshake smoke failed (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Run uninstall.ps1 + verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Same sandboxed LOCALAPPDATA the install step used — uninstall.ps1
          # resolves its removal targets relative to it.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "fake-localappdata"
          & "$env:STAGE\uninstall.ps1" -Yes
          foreach ($bin in @("nimbus.exe","nimbus-gateway.exe")) {
            if (Test-Path "$env:LOCALAPPDATA\Programs\Nimbus\bin\$bin") {
              Write-Error "uninstall did not remove $bin"
              exit 1
            }
          }
          $userPath = [Environment]::GetEnvironmentVariable("PATH","User")
          if ($userPath -and (($userPath -split ";") | Where-Object { $_ -ieq "$env:LOCALAPPDATA\Programs\Nimbus\bin" })) {
            Write-Error "uninstall did not remove the PATH segment"
            exit 1
          }

      # ---------------------------------------------------------------------
      # Served-release (remote-mode) proof (Windows). Mirrors the Unix block
      # above: pack the SAME staged binaries into a correctly-named archive,
      # serve it over 127.0.0.1, and drive install.ps1's -FromRelease path
      # against it — proving the REAL built binaries survive the download
      # path, not just the stub binaries scripts/install/install-remote-
      # windows.test.ts already covers.
      - name: Pack a served-release fixture from the staged binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "0.0.0-test"
          $serve = Join-Path $env:RUNNER_TEMP "serve"
          $payload = Join-Path $env:RUNNER_TEMP "remote-payload"
          New-Item -ItemType Directory -Path $serve -Force | Out-Null
          New-Item -ItemType Directory -Path $payload -Force | Out-Null

          # Reuse the binaries this job already built and staged — do not
          # rebuild, do not use stand-ins.
          Copy-Item (Join-Path $env:STAGE "nimbus.exe")                 (Join-Path $payload "nimbus.exe")
          Copy-Item (Join-Path $env:STAGE "nimbus-gateway.exe")         (Join-Path $payload "nimbus-gateway.exe")
          Copy-Item (Join-Path $env:STAGE "nimbus-sandbox-helper.exe")  (Join-Path $payload "nimbus-sandbox-helper.exe")

          # sqlite-vec sidecar — the real Windows zip ships vec0.dll at TOP LEVEL,
          # alongside the two .exe files (release.yml's `Stage Windows archive` step).
          # Copy-Item's wildcard below picks it up into the archive automatically.
          Copy-Item (Join-Path "dist" "vec0.dll") (Join-Path $payload "vec0.dll")

          # scripts/install/lib/release-assets.ts's assetNameFor(): unversioned,
          # binaries at TOP LEVEL of the zip (unlike the Linux tarball's bin/).
          $asset = "nimbus-headless-windows-x64.zip"
          $zipPath = Join-Path $serve $asset
          Compress-Archive -Path (Join-Path $payload "*") -DestinationPath $zipPath -Force

          # Real SHA256SUMS format: "<64 lowercase hex><TWO spaces><filename>".
          $digest = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumsPath = Join-Path $serve "SHA256SUMS"
          [System.IO.File]::WriteAllText($sumsPath, "$digest  $asset`n", [System.Text.UTF8Encoding]::new($false))

          "REMOTE_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REMOTE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start the release fixture server (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/install/serve-fixture.ts "$RUNNER_TEMP/serve" 8788 &
          echo $! > "$RUNNER_TEMP/serve.pid"
          for _ in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:8788/SHA256SUMS" >/dev/null && break
            sleep 0.2
          done
          curl -fsS "http://127.0.0.1:8788/SHA256SUMS" >/dev/null || {
            echo "::error::release fixture server never answered"; exit 1; }

      - name: Install from a served release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # A FRESH sandboxed LOCALAPPDATA, distinct from the local-mode one
          # above — the runner's real profile stays untouched, and this run
          # cannot be satisfied by a leftover local-mode install.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "fake-localappdata-remote"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $env:NIMBUS_INSTALL_BASE_URL = "http://127.0.0.1:8788"

          # *>&1, not 2>&1: install.ps1's "Downloading"/"sha256 verified"
          # lines are Write-Host calls, which land on the Information stream
          # (6) in PS 5.1+, NOT stdout/stderr — 2>&1 only merges the error
          # stream and would silently miss them, turning a real remote-path
          # regression into a false green.
          $out = & "$env:STAGE\install.ps1" -FromRelease $env:REMOTE_VER -Yes *>&1 | Out-String
          Write-Host $out

          # Asserting only that the binary exists would also pass under LOCAL
          # mode — these two markers are printed ONLY by the remote fetch +
          # verify path (Get-NimbusRelease), so they prove the remote path
          # actually ran.
          if ($out -notmatch "Downloading") {
            Write-Error "installer never reported a download — the remote path did not run"; exit 1
          }
          if ($out -notmatch "sha256 verified") {
            Write-Error "installer never reported sha256 verification — the remote path did not run"; exit 1
          }

          $installedNimbus = Join-Path $env:LOCALAPPDATA "Programs\Nimbus\bin\nimbus.exe"
          if (-not (Test-Path $installedNimbus)) {
            Write-Error "remote install did not place the binary"; exit 1
          }

          # Proves install.ps1's sidecar-copy block ($Vec0Src = ... vec0.dll / bin\vec0.dll
          # ... Copy-Item ...) actually ran against the served archive, not just that the
          # binaries landed — the whole reason this job packs a real sidecar.
          $installedVec0 = Join-Path $env:LOCALAPPDATA "Programs\Nimbus\bin\vec0.dll"
          if (-not (Test-Path $installedVec0)) {
            Write-Error "remote install did not place the sqlite-vec sidecar (vec0.dll) — the sidecar-copy path in install.ps1 did not run"; exit 1
          }

          # Proves install.ps1's REQUIRED helper-copy block actually ran: unlike vec0.dll, a
          # missing nimbus-sandbox-helper.exe means every connector spawn refuses to run
          # unsandboxed (fail-closed, I15) — a silent regression here disables the whole sandbox.
          $installedHelper = Join-Path $env:LOCALAPPDATA "Programs\Nimbus\bin\nimbus-sandbox-helper.exe"
          if (-not (Test-Path $installedHelper)) {
            Write-Error "remote install did not place the sandbox helper (nimbus-sandbox-helper.exe) — the helper-copy path in install.ps1 did not run"; exit 1
          }

          $env:PATH = "$(Split-Path $installedNimbus);$env:PATH"
          nimbus --version

      # ---------------------------------------------------------------------
      # Windows PowerShell 5.1 leg. Everything above on Windows (both the
      # local-mode job earlier and the served-release step just above) runs
      # under `shell: pwsh` — PowerShell 7. Stock Windows ships only 5.1, and
      # it was chosen as the declared support floor deliberately (install.ps1
      # carries `#Requires -Version 5.1` plus PS-5.1-specific TLS 1.2 and
      # $PSScriptRoot/$PSCommandPath handling for exactly this reason — see
      # the #1167 fix, both of whose failure modes were 5.1-only behaviours).
      # Before this leg, NOTHING anywhere — no CI job, no bun test — ever
      # executed install.ps1 on real Windows PowerShell 5.1; `shell: powershell`
      # appeared zero times in any workflow, and install-remote-windows.test.ts
      # resolves pwsh too. Reuses the SAME fixture server AND the SAME staged
      # release archive the PS7 leg above already packed and verified (still
      # running/served — the "Stop" step below tears the server down), with a
      # THIRD distinct sandboxed LOCALAPPDATA so this leg cannot be satisfied
      # by either the local-mode or the PS7 remote-mode install. No separate
      # packing step is needed here for that reason: $env:REMOTE_ASSET at
      # `http://127.0.0.1:8788/$env:REMOTE_ASSET` is already the real ~50-80
      # MB built binaries.
      #
      # REAL binaries, not stubs — Controller Ruling 17 revisited. This leg
      # used to serve a tiny stand-in PE (`Add-Type -OutputType
      # ConsoleApplication`) instead of the real archive: downloading the real
      # archive over 127.0.0.1 under Windows PowerShell 5.1's legacy
      # Invoke-WebRequest (WinINet-backed, unlike PS7's HttpClient) on
      # GitHub-hosted windows-2022 runners was measured transferring at
      # ~0.95 MB/s and landing PLAUSIBLE-SIZE-BUT-WRONG-CONTENT bytes —
      # deterministic across retries (3/3 identical), never reproducing off
      # CI and never on the PS7 leg in this same job. The working diagnosis
      # was real-time antivirus inline-scanning interfering with the legacy
      # WinINet stack's writes to disk. That diagnosis was never proven by a
      # controlled A/B (AV on vs AV off) — it is circumstantial (loopback
      # throughput collapse + PS7-immune + off-CI-immune), not confirmed.
      # `Get-NimbusRelease` in install.ps1 also gained `$ProgressPreference =
      # "SilentlyContinue"` around the same time (a REAL, separately-measured
      # ~182x throughput fix for 5.1's per-chunk console progress rendering,
      # not a CI-only workaround) — it is possible that fix alone removed
      # whatever was triggering the corruption, and the AV theory was never
      # re-tested in isolation after it landed. A future reader who sees this
      # leg green for a long stretch should weigh removing the exclusion
      # below (or re-running once without it) before assuming it is still
      # load-bearing.
      #
      # THE EXCLUSION: the user explicitly authorised adding a Windows
      # Defender path exclusion to this CI-only job to unblock real-binary
      # coverage (this was previously refused as a security-sensitive change
      # to shared CI infrastructure not owned by this change). It is scoped
      # as narrowly as this workflow can make it:
      #   - ONE directory: a dedicated, per-run temp folder under
      #     $env:RUNNER_TEMP (NOT a drive, NOT $env:RUNNER_TEMP itself, NOT a
      #     process-wide or file-extension-wide exclusion).
      #   - install.ps1's own download temp dir (`Get-NimbusRelease`'s
      #     $work, created under `[System.IO.Path]::GetTempPath()`) is
      #     redirected into exactly that folder for this one step, by
      #     overriding $env:TMP / $env:TEMP for that step's process only —
      #     so the exclusion covers precisely where the bytes for THIS leg's
      #     download land, and nothing else on the runner.
      #   - Added immediately before the download step and removed
      #     immediately after, in an `if: always()` step, so the runner is
      #     never left with a lingering exclusion even if the install step
      #     fails. GitHub-hosted runners are ephemeral and this VM is
      #     discarded either way, but a leaked exclusion is exactly the kind
      #     of thing a reused/self-hosted environment should never have to
      #     rely on chance for.
      #   - This exclusion is added and removed ONLY inside this CI job, on
      #     GitHub-hosted `windows-2022` runners. It never touches a
      #     developer machine or a user's install — nothing under
      #     scripts/install/ references Defender or `Add-MpPreference`.
      #
      # This leg invokes install.ps1 as a FILE (`-File ... -FromRelease`, see
      # the step below), not via `irm | iex`, so `$PSScriptRoot` is non-null
      # and `param()` binds normally, and `-FromRelease` means
      # `Resolve-LatestTag` is never called — none of those are exercised
      # here. What this leg's real, UNIQUE value is: it proves the 5.1
      # RUNTIME behaves correctly for `Write-Host` stream capture via
      # `*>&1`, the TLS 1.2 branch, and 5.1-specific
      # `Invoke-WebRequest`/`Get-FileHash`/`Expand-Archive` behaviour against
      # the SAME real binaries the PS7 leg in this same workflow already
      # proved survive the remote path — now with actual real-binary
      # realism too, not a stand-in. The genuine `irm | iex` one-liner PLUS
      # the inert-`#Requires`-under-`iex` / null-`$PSScriptRoot` /
      # `ResponseUri`-vs-`RequestMessage` behaviours, on real PowerShell 5.1,
      # are covered post-release, hand-dispatched, in
      # `released-install-smoke.yml:280-292`.
      - name: Confirm this leg runs on Windows PowerShell 5.1, not pwsh (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "PSVersionTable.PSVersion: $v"
          if ($v.Major -ge 6) {
            Write-Error "'shell: powershell' resolved to PSVersion $v (PowerShell 6+) -- expected Windows PowerShell 5.1. This leg exists specifically to prove 5.1 coverage; refusing to silently pass on the wrong runtime."
            exit 1
          }

      # See the big comment block above this leg for the full rationale.
      # Scope: exactly $env:RUNNER_TEMP\ps51-dl-tmp, the folder the very next
      # step points install.ps1's download temp dir at via $env:TMP/$env:TEMP
      # — nothing broader. Created here (not just excluded) so the exclusion
      # is in effect for a real, existing path before any bytes land in it.
      - name: Add a narrowly-scoped Defender exclusion for the PS5.1 download workaround (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ps51DlTmp = Join-Path $env:RUNNER_TEMP "ps51-dl-tmp"
          New-Item -ItemType Directory -Path $ps51DlTmp -Force | Out-Null
          Add-MpPreference -ExclusionPath $ps51DlTmp
          Write-Host "Defender exclusion added for $ps51DlTmp (CI-runner-only, removed later in this same job)."

      - name: Install from a served release (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # A THIRD sandboxed LOCALAPPDATA — distinct from BOTH the local-mode
          # one and the PS7 remote-mode one above — so this leg cannot be
          # satisfied by either earlier phase's install.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "fake-localappdata-remote-ps51"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $env:NIMBUS_INSTALL_BASE_URL = "http://127.0.0.1:8788"

          # Route install.ps1's own download temp dir (`Get-NimbusRelease`'s
          # $work, built from `[System.IO.Path]::GetTempPath()`) into the
          # SAME folder the Defender-exclusion step above just excluded.
          # .NET's GetTempPath() reads TMP, then TEMP, then USERPROFILE — set
          # both so the resolution is unambiguous regardless of which one a
          # future .NET/PowerShell version prefers. Scoped to THIS step's own
          # process only (PowerShell steps are separate processes; nothing is
          # written to $GITHUB_ENV), so no later step inherits it.
          $ps51DlTmp = Join-Path $env:RUNNER_TEMP "ps51-dl-tmp"
          $env:TMP = $ps51DlTmp
          $env:TEMP = $ps51DlTmp

          # *>&1, not 2>&1: confirmed empirically (not assumed — this leg
          # exists precisely because 5.1 and 7 can differ) that Write-Host
          # output is likewise invisible to 2>&1 and visible to *>&1 under
          # real Windows PowerShell 5.1, via an isolated local repro before
          # trusting it here. See the task report for that repro.
          $out = & "$env:STAGE\install.ps1" -FromRelease $env:REMOTE_VER -Yes *>&1 | Out-String
          Write-Host $out

          if ($out -notmatch "Downloading") {
            Write-Error "installer never reported a download on PowerShell 5.1 -- the remote path did not run"; exit 1
          }
          if ($out -notmatch "sha256 verified") {
            Write-Error "installer never reported sha256 verification on PowerShell 5.1 -- the remote path did not run"; exit 1
          }

          $installedNimbus = Join-Path $env:LOCALAPPDATA "Programs\Nimbus\bin\nimbus.exe"
          if (-not (Test-Path $installedNimbus)) {
            Write-Error "remote install (PowerShell 5.1) did not place the binary"; exit 1
          }

          # Same proof as the PS7 leg above, on PowerShell 5.1's own Copy-Item behaviour.
          $installedVec0 = Join-Path $env:LOCALAPPDATA "Programs\Nimbus\bin\vec0.dll"
          if (-not (Test-Path $installedVec0)) {
            Write-Error "remote install (PowerShell 5.1) did not place the sqlite-vec sidecar (vec0.dll) -- the sidecar-copy path in install.ps1 did not run"; exit 1
          }

          # Same proof as the PS7 leg above, on PowerShell 5.1's own Copy-Item behaviour.
          $installedHelper = Join-Path $env:LOCALAPPDATA "Programs\Nimbus\bin\nimbus-sandbox-helper.exe"
          if (-not (Test-Path $installedHelper)) {
            Write-Error "remote install (PowerShell 5.1) did not place the sandbox helper (nimbus-sandbox-helper.exe) -- the helper-copy path in install.ps1 did not run"; exit 1
          }

          $env:PATH = "$(Split-Path $installedNimbus);$env:PATH"
          nimbus --version

      # Mirrors the Add- step above: removes the SAME single path, always,
      # regardless of whether the install step above passed or failed — so a
      # failure in the leg this exclusion supports can never leave it behind.
      - name: Remove the Defender exclusion for the PS5.1 download workaround (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $ps51DlTmp = Join-Path $env:RUNNER_TEMP "ps51-dl-tmp"
          Remove-MpPreference -ExclusionPath $ps51DlTmp -ErrorAction SilentlyContinue
          Write-Host "Defender exclusion removed for $ps51DlTmp (best-effort; runner is discarded after this job regardless)."

      - name: Stop the release fixture server (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: kill "$(cat "$RUNNER_TEMP/serve.pid")" 2>/dev/null || true

  launcher-contract:
    name: Launcher installer-path contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This workflow already triggers on scripts/install/**, which is exactly the
    # set of changes that can break the launcher's vendored copy of the
    # installer's output directories. Running the audit here closes the PR-time
    # window that org-drift-sweep.yml's scheduled run leaves open.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout nimbus-mcp (owns the vendored copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nimbus-agent/nimbus-mcp
          path: .nimbus-mcp
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Compare the vendored suffixes against resolveInstallDir
        run: |
          bun scripts/structure-audit/check-launcher-installer-contract.ts \
            .nimbus-mcp/src/installer-contract.ts
