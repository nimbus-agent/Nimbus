name: Publish package managers

# Triggered by the Release workflow COMPLETING — not the `release: released`
# event. release-please publishes the (empty) GitHub Release the instant the
# release PR merges, which fires `released` ~18 min before release.yml finishes
# building + attaching SHA256SUMS/.msi/binaries. Keying off `released` therefore
# always raced an asset-less release ("no assets to download"). `workflow_run`
# fires only after release.yml has uploaded every asset.
#
# Each job's `if` gates on: the Release run SUCCEEDED, the ref is a `v*` tag (so
# sdk-*/client-* releases — which never build installers and don't trigger
# release.yml anyway — are doubly excluded), and the tag is NON-prerelease (no
# `-`, matching the old "released only fires for stable" behavior).
#
# `workflow_dispatch` lets a maintainer re-run a publish by tag if a run failed
# transiently (GitHub outage, expired PAT) — re-running is idempotent (no-op if unchanged).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: publish-pkgmgr-${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-and-publish:
    name: Generate + publish brew/scoop manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Stable `v*` tags whose Release build succeeded (or a manual re-run). See the
    # `on:` header for why this replaces the `release: released` trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the default branch; check out the released
          # tag's tree instead (head_sha = the commit release.yml built from).
          # Manual dispatch falls back to the tag input.
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag_name }}
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # Fail fast with an actionable message if the publish PAT is missing/empty.
      # On the upstream repo a missing secret means releases would silently fail to
      # publish, so we error loudly rather than skip. (Release events don't fire from
      # forks, so this is not a fork-noise concern.)
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: homebrew-tap,scoop-bucket
          permission-contents: write

      - name: Download SHA256SUMS from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir out

      - name: Generate manifests
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          bun scripts/release/package-manager-manifests.ts \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --sha256sums out/SHA256SUMS \
            --out-dir out
          echo "--- nimbus.rb ---"; cat out/nimbus.rb
          echo "--- nimbus.json ---"; cat out/nimbus.json

      # SIGNED commits, not `git clone` + `git push`.
      #
      # A commit pushed over HTTPS with an App installation token is UNSIGNED
      # (`verification.verified = false`) — indistinguishable from one an attacker
      # holding a leaked token would produce. homebrew-tap and scoop-bucket are what
      # `brew install` and `scoop install` read, so that is the shortest path from a
      # stolen token to code on a user's machine.
      #
      # The GraphQL `createCommitOnBranch` mutation moves commit construction
      # server-side: GitHub builds the tree, writes the commit and signs it, so the
      # result is Verified. That is the PREREQUISITE for adding `required_signatures`
      # to these repos' rulesets — a separate, later change. Enabling the ruleset
      # before this publisher moved would break the next publish.
      #
      # SELF-PROVING: the helper does not assume the commit came out signed, it
      # ASKS. The mutation selects the created commit's
      # `signature { isValid state wasSignedByGitHub }` and the step FAILS (non-zero,
      # with an ::error:: annotation) unless GitHub answers isValid:true + state:VALID
      # — a null signature, which is exactly what an unsigned commit returns, is a
      # failure, not a warning. So a green run here is evidence, not a hope, and
      # that is the property the later `required_signatures` step depends on.
      #
      # What is published is unchanged (the same generated manifest bytes); only the
      # commit mechanism differs. The helper is a no-op when the manifest already
      # matches (it compares git blob oids), replacing the old `git diff --cached`
      # check, and it re-reads + rebuilds rather than forcing if the branch moved.
      - name: Publish to homebrew-tap (signed commit)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          bun scripts/release/signed-commit.ts \
            --repo nimbus-agent/homebrew-tap \
            --message "nimbus ${TAG#v}" \
            --add "Formula/nimbus.rb=out/nimbus.rb"

      - name: Publish to scoop-bucket (signed commit)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          bun scripts/release/signed-commit.ts \
            --repo nimbus-agent/scoop-bucket \
            --message "nimbus ${TAG#v}" \
            --add "bucket/nimbus.json=out/nimbus.json"

  winget:
    name: Submit winget manifest PR
    runs-on: windows-latest
    timeout-minutes: 20
    # Stable `v*` tags whose Release build succeeded (or a manual re-run). See the
    # `on:` header for why this replaces the `release: released` trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    # No step-security/harden-runner here: it supports Linux runners only.
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the default branch; check out the released
          # tag's tree instead (head_sha = the commit release.yml built from).
          # Manual dispatch falls back to the tag input.
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag_name }}
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # Fail fast with an actionable message if the winget submission PAT is missing.
      # wingetcreate must fork microsoft/winget-pkgs + open a cross-repo PR, which the
      # fine-grained PACKAGE_MANAGER_PAT (scoped to our own channel repos) cannot do —
      # this needs a classic PAT with the `public_repo` AND `workflow` scopes (see the
      # sync step below for why `workflow` is not optional).
      - name: Require WINGET_PAT
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_PAT)) {
            Write-Output "::error::WINGET_PAT is not set. Add a classic PAT with the 'public_repo' AND 'workflow' scopes so wingetcreate can fork microsoft/winget-pkgs, sync + push to the fork, and open a PR (the fine-grained PACKAGE_MANAGER_PAT cannot). Repo Settings -> Secrets -> Actions."
            exit 1
          }

      # wingetcreate syncs its fork of winget-pkgs before submitting, and when that sync
      # fails it reports only "The forked repository could not be synced with the upstream
      # commits" — naming no cause. The cause is normally scope: GitHub refuses a
      # token-attributed write that creates or updates files under `.github/workflows/`
      # unless the PAT carries `workflow`, and winget-pkgs commits workflow files
      # regularly. A `public_repo`-only PAT therefore publishes fine until the first such
      # upstream commit, then fails EVERY release — winget sat at 1.19.1 from v1.20.0
      # through v1.26.0 exactly this way, while brew/scoop in this same workflow stayed
      # current, so the run was red but the symptom was one stale channel.
      #
      # Doing the sync here, explicitly, means the failure names its own cause. Idempotent:
      # a fork already level with upstream is a no-op, and a not-yet-existing fork is not
      # an error (wingetcreate creates it on the first-ever submission).
      - name: Sync the winget-pkgs fork with upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          $login = gh api user --jq .login
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::WINGET_PAT was rejected by the GitHub API — it is revoked or expired. Re-issue it (classic PAT, 'public_repo' + 'workflow')."
            exit 1
          }
          $fork = "$login/winget-pkgs"
          $branch = gh api "repos/$fork" --jq .default_branch 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "No $fork yet — wingetcreate will create it on submit."
            exit 0
          }
          $out = gh api -X POST "repos/$fork/merge-upstream" -f "branch=$branch" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output $out
            Write-Output "::error::Could not sync $fork ($branch) with microsoft/winget-pkgs. The usual cause is a WINGET_PAT missing the 'workflow' scope: upstream commits touch .github/workflows/, and GitHub refuses to replay those without it. Re-issue the classic PAT with BOTH 'public_repo' and 'workflow' (https://github.com/settings/tokens), or sync the fork by hand and re-run this workflow."
            exit 1
          }
          Write-Output $out

      - name: Download the released .msi + SHA256SUMS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" `
            --pattern SHA256SUMS --pattern nimbus-headless-windows-x64.msi --dir out
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed for $env:TAG" }

      - name: Resolve .msi URL + expected sha256 from SHA256SUMS
        id: msi
        shell: pwsh
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          $version = $env:TAG -replace '^v',''
          bun scripts/release/winget-manifest.ts `
            --version $version --repo "$env:GITHUB_REPOSITORY" --sha256sums out/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "winget-manifest helper failed (is the .msi in SHA256SUMS?)" }

      - name: Verify the downloaded .msi matches SHA256SUMS
        shell: pwsh
        run: |
          $expected = "${{ steps.msi.outputs.sha256 }}"
          $actual = (Get-FileHash -Algorithm SHA256 out/nimbus-headless-windows-x64.msi).Hash
          if ($actual.ToLower() -ne $expected.ToLower()) {
            Write-Output "::error::.msi sha256 mismatch (SHA256SUMS=$expected computed=$actual). Refusing to submit a winget PR for a tampered/incomplete asset."
            exit 1
          }
          Write-Output "verified .msi sha256 = $($actual.ToLower())"

      - name: Bootstrap wingetcreate (pinned + checksum-verified)
        shell: pwsh
        run: |
          $wcVersion = "1.12.8.0"
          $wcSha256 = "8bd738851b524885410112678e3771b341c5c716de60fbbecb88ab0a363ed85d"
          $wcUrl = "https://github.com/microsoft/winget-create/releases/download/v$wcVersion/wingetcreate.exe"
          $ProgressPreference = "SilentlyContinue"  # progress bar makes Invoke-WebRequest order-of-magnitude slower
          Invoke-WebRequest -Uri $wcUrl -OutFile wingetcreate.exe
          $actual = (Get-FileHash -Algorithm SHA256 wingetcreate.exe).Hash
          if ($actual.ToLower() -ne $wcSha256.ToLower()) {
            Write-Output "::error::wingetcreate.exe sha256 mismatch (pinned v$wcVersion): expected=$wcSha256 computed=$($actual.ToLower())"
            exit 1
          }
          Write-Output "wingetcreate v$wcVersion verified"

      - name: Submit winget manifest PR
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          $version = $env:TAG -replace '^v',''
          $url = "${{ steps.msi.outputs.url }}"
          $id = "${{ steps.msi.outputs.identifier }}"
          # `update` requires NimbusAgent.Nimbus to already exist in microsoft/winget-pkgs.
          # The FIRST-EVER submission is a one-time manual `wingetcreate new` by a maintainer
          # (see docs/install.md); CI then handles every subsequent stable release here.
          ./wingetcreate.exe update $id --version $version --urls "$url" --submit --token $env:WINGET_PAT
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate submit failed. If this is the first release, $id may not yet exist in winget-pkgs — bootstrap it once with 'wingetcreate new' (see docs/install.md)."
          }

  # A failure here used to alert NOBODY. This workflow runs on `workflow_run`, so
  # nothing blocks on it, no PR turns red, and the only notification goes to the
  # actor of the upstream run. The winget job failed nine consecutive times across
  # v1.20.0 → v1.26.0 while brew and scoop kept publishing, so even the run list
  # looked half-healthy; the stale channel was found by hand, six days late.
  #
  # `release.yml` has filed a release-health issue on failure since it shipped —
  # this is the same mechanism, one workflow later, where the assets actually
  # reach users.
  #
  # ONE issue per key, not one per tag: this failure mode recurs every release
  # until someone fixes the cause, and nine issues for one root cause is the kind
  # of noise people learn to filter. The state hash still comments on each new
  # tag, so a recurrence is visible without spawning a new thread.
  alert-on-failure:
    name: Alert on publish failure
    needs:
      - generate-and-publish
      - winget
    # failure() fires when a needed job FAILED; a skipped job is neutral, so the
    # by-design skips (sdk-*/client-* tags) never trip this. Not always() — that
    # would fire on success too.
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"
      - name: File a release-health issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_KEY: publish-package-managers
          HEALTH_TITLE: "🚨 Package-manager publish is failing"
          HEALTH_BODY: "Publishing `${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}` to the package managers failed — brew/scoop: `${{ needs.generate-and-publish.result }}`, winget: `${{ needs.winget.result }}`. Users of the failed channel stay on the previous version, and nothing else blocks on this workflow, so this issue is the only signal. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bun scripts/release/open-health-issue.ts

  # The other half: an alert that never clears is one people stop reading. A fully
  # successful publish closes the issue the failure opened.
  resolve-alert:
    name: Resolve publish alert
    needs:
      - generate-and-publish
      - winget
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"
      - name: Close the release-health issue, if any
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_KEY: publish-package-managers
          HEALTH_RESOLVE: "1"
          HEALTH_BODY: "Resolved: `${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}` published to every package-manager channel. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bun scripts/release/open-health-issue.ts
