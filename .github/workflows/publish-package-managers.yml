name: Publish package managers

# Triggered by the Release workflow COMPLETING — not the `release: released`
# event. release-please publishes the (empty) GitHub Release the instant the
# release PR merges, which fires `released` ~18 min before release.yml finishes
# building + attaching SHA256SUMS/.msi/binaries. Keying off `released` therefore
# always raced an asset-less release ("no assets to download"). `workflow_run`
# fires only after release.yml has uploaded every asset.
#
# Each job's `if` gates on: the Release run SUCCEEDED, the ref is a `v*` tag (so
# sdk-*/client-* releases — which never build installers and don't trigger
# release.yml anyway — are doubly excluded), and the tag is NON-prerelease (no
# `-`, matching the old "released only fires for stable" behavior).
#
# `workflow_dispatch` lets a maintainer re-run a publish by tag if a run failed
# transiently (GitHub outage, expired PAT) — re-running is idempotent (no-op if unchanged).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: publish-pkgmgr-${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-and-publish:
    name: Generate + publish brew/scoop manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Stable `v*` tags whose Release build succeeded (or a manual re-run). See the
    # `on:` header for why this replaces the `release: released` trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the default branch; check out the released
          # tag's tree instead (head_sha = the commit release.yml built from).
          # Manual dispatch falls back to the tag input.
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag_name }}
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # Fail fast with an actionable message if the publish PAT is missing/empty.
      # On the upstream repo a missing secret means releases would silently fail to
      # publish, so we error loudly rather than skip. (Release events don't fire from
      # forks, so this is not a fork-noise concern.)
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: homebrew-tap,scoop-bucket
          permission-contents: write

      - name: Download SHA256SUMS from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir out

      - name: Generate manifests
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          bun scripts/release/package-manager-manifests.ts \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --sha256sums out/SHA256SUMS \
            --out-dir out
          echo "--- nimbus.rb ---"; cat out/nimbus.rb
          echo "--- nimbus.json ---"; cat out/nimbus.json

      - name: Publish to homebrew-tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/nimbus-agent/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/nimbus.rb tap/Formula/nimbus.rb
          cd tap
          git config user.name "nimbus-release-bot"
          git config user.email "release-bot@nimbus-agent.invalid"
          # Stage first: on the first publish Formula/nimbus.rb is untracked, and
          # `git diff` ignores untracked files — staging then diffing --cached makes
          # the no-op check see new files too, so first-time publication isn't skipped.
          git add Formula/nimbus.rb
          if git diff --cached --quiet; then echo "no formula change"; exit 0; fi
          git commit -m "nimbus ${TAG#v}"
          git push

      - name: Publish to scoop-bucket
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/nimbus-agent/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/nimbus.json bucket/bucket/nimbus.json
          cd bucket
          git config user.name "nimbus-release-bot"
          git config user.email "release-bot@nimbus-agent.invalid"
          # Stage first (see homebrew-tap step): untracked bucket/nimbus.json would
          # otherwise be invisible to `git diff` and skip the first publication.
          git add bucket/nimbus.json
          if git diff --cached --quiet; then echo "no manifest change"; exit 0; fi
          git commit -m "nimbus ${TAG#v}"
          git push

  winget:
    name: Submit winget manifest PR
    runs-on: windows-latest
    timeout-minutes: 20
    # Stable `v*` tags whose Release build succeeded (or a manual re-run). See the
    # `on:` header for why this replaces the `release: released` trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    # No step-security/harden-runner here: it supports Linux runners only.
    steps:
      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the default branch; check out the released
          # tag's tree instead (head_sha = the commit release.yml built from).
          # Manual dispatch falls back to the tag input.
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag_name }}
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # Fail fast with an actionable message if the winget submission PAT is missing.
      # wingetcreate must fork microsoft/winget-pkgs + open a cross-repo PR, which the
      # fine-grained PACKAGE_MANAGER_PAT (scoped to our own channel repos) cannot do —
      # this needs a classic PAT with the `public_repo` scope.
      - name: Require WINGET_PAT
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_PAT)) {
            Write-Output "::error::WINGET_PAT is not set. Add a classic PAT with the 'public_repo' scope so wingetcreate can fork microsoft/winget-pkgs, push to the fork, and open a PR (the fine-grained PACKAGE_MANAGER_PAT cannot). Repo Settings -> Secrets -> Actions."
            exit 1
          }

      - name: Download the released .msi + SHA256SUMS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" `
            --pattern SHA256SUMS --pattern nimbus-headless-windows-x64.msi --dir out
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed for $env:TAG" }

      - name: Resolve .msi URL + expected sha256 from SHA256SUMS
        id: msi
        shell: pwsh
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          $version = $env:TAG -replace '^v',''
          bun scripts/release/winget-manifest.ts `
            --version $version --repo "$env:GITHUB_REPOSITORY" --sha256sums out/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "winget-manifest helper failed (is the .msi in SHA256SUMS?)" }

      - name: Verify the downloaded .msi matches SHA256SUMS
        shell: pwsh
        run: |
          $expected = "${{ steps.msi.outputs.sha256 }}"
          $actual = (Get-FileHash -Algorithm SHA256 out/nimbus-headless-windows-x64.msi).Hash
          if ($actual.ToLower() -ne $expected.ToLower()) {
            Write-Output "::error::.msi sha256 mismatch (SHA256SUMS=$expected computed=$actual). Refusing to submit a winget PR for a tampered/incomplete asset."
            exit 1
          }
          Write-Output "verified .msi sha256 = $($actual.ToLower())"

      - name: Bootstrap wingetcreate (pinned + checksum-verified)
        shell: pwsh
        run: |
          $wcVersion = "1.12.8.0"
          $wcSha256 = "8bd738851b524885410112678e3771b341c5c716de60fbbecb88ab0a363ed85d"
          $wcUrl = "https://github.com/microsoft/winget-create/releases/download/v$wcVersion/wingetcreate.exe"
          $ProgressPreference = "SilentlyContinue"  # progress bar makes Invoke-WebRequest order-of-magnitude slower
          Invoke-WebRequest -Uri $wcUrl -OutFile wingetcreate.exe
          $actual = (Get-FileHash -Algorithm SHA256 wingetcreate.exe).Hash
          if ($actual.ToLower() -ne $wcSha256.ToLower()) {
            Write-Output "::error::wingetcreate.exe sha256 mismatch (pinned v$wcVersion): expected=$wcSha256 computed=$($actual.ToLower())"
            exit 1
          }
          Write-Output "wingetcreate v$wcVersion verified"

      - name: Submit winget manifest PR
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          $version = $env:TAG -replace '^v',''
          $url = "${{ steps.msi.outputs.url }}"
          $id = "${{ steps.msi.outputs.identifier }}"
          # `update` requires NimbusAgent.Nimbus to already exist in microsoft/winget-pkgs.
          # The FIRST-EVER submission is a one-time manual `wingetcreate new` by a maintainer
          # (see docs/install.md); CI then handles every subsequent stable release here.
          ./wingetcreate.exe update $id --version $version --urls "$url" --submit --token $env:WINGET_PAT
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate submit failed. If this is the first release, $id may not yet exist in winget-pkgs — bootstrap it once with 'wingetcreate new' (see docs/install.md)."
          }
