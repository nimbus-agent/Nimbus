name: Docs Quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "packages/docs/**"
      - "**/*.md"
      - ".github/workflows/docs-quality.yml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      # cast-tripwire scope: the gate must fire on CLI rendering changes and
      # on changes to the tripwire itself or its scripts/snapshots.
      - "scripts/cast-driver/**"
      - "packages/cli/src/**"
      - "packages/cli/package.json"
      - "docs/demos/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/docs/**"
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      # cast-tripwire scope (matches pull_request.paths above)
      - "scripts/cast-driver/**"
      - "packages/cli/src/**"
      - "packages/cli/package.json"
      - "docs/demos/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: lychee link check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install lychee directly from its upstream release rather than via
      # `lycheeverse/lychee-action`, which is not on this repo's allowed-actions
      # allowlist (any third-party action outside the verified-creator set is
      # blocked). The binary download is checksum-verified to keep the supply-
      # chain story equivalent to the action.
      - name: Install lychee
        env:
          LYCHEE_VERSION: lychee-v0.24.2
          LYCHEE_TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          archive="lychee-${LYCHEE_TARGET}.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSL --fail -o "${archive}" \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/${archive}"
          curl -sSL --fail -o "${archive}.sha256" \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          tar -xzf "${archive}"
          # Upstream tarball extracts to `lychee-<target>/lychee`, not flat.
          sudo install -m 0755 "lychee-${LYCHEE_TARGET}/lychee" /usr/local/bin/lychee
          lychee --version

      - name: Run lychee
        # Pass the workflow token so lychee resolves github.com links via the GitHub
        # API instead of scraping HTML. Unauthenticated commit-page requests from the
        # runner's egress get rate-limited to 500s (verified: CHANGELOG.md commit
        # permalinks fail intermittently); the API path is rate-limit-resistant and
        # still genuinely validates each link. Needs only `contents: read`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lychee --config lychee.toml --no-progress 'docs/**/*.md' '*.md'

  # SEVEN jobs collapsed into one. Each of markdownlint / OG card / SVG audit /
  # README CLI tripwire / package READMEs / cast tripwire / Starlight build was
  # a separate runner paying its own Harden Runner + checkout + `bun install`
  # — roughly 30s of identical setup each — to run one `bun run` that finishes
  # in seconds. Seven runners for well under a minute of actual work.
  #
  # None of these seven names is a required status check (the General ruleset
  # requires only "PR quality — required gates", the six security contexts, the
  # two CodeQL contexts and "cla"), so collapsing them changes no merge gate.
  # `link-check` stays its own job: it is the slow one and it fetches the
  # network, so it should not serialise behind the fast static checks.
  #
  # The cost, stated plainly: fail-fast becomes fail-first. A markdownlint
  # failure now stops the steps after it, so a contributor sees one failure per
  # push instead of all of them at once. Acceptable here because these checks
  # are near-instant to re-run locally and rarely fail together.
  docs-checks:
    name: Docs checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Run markdownlint-cli2
        run: bun run lint:markdown

      - name: Run SVG asset audit
        run: bun run audit:svg-assets

      - name: Run README CLI-command tripwire
        run: bun run audit:readme-cli

      - name: Run package READMEs audit
        run: bun run audit:package-readmes

      - name: Render OG card
        run: bun run render:og-card

      - name: Verify PNG is up to date
        run: |
          if ! git diff --exit-code docs/og-card.png; then
            echo "::error::docs/og-card.png is out of date. Run 'bun run render:og-card' locally and commit the result."
            exit 1
          fi

      - name: Run build
        run: bun --cwd packages/docs run build

      - name: Run cast tripwire
        id: cast
        run: bun run record-casts --check --artifacts-dir=cast-artifacts

      - name: Upload drift artifacts
        if: failure() && steps.cast.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cast-drift
          path: cast-artifacts/
          retention-days: 7
