name: Docs Quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "packages/docs/**"
      - "**/*.md"
      - ".github/workflows/docs-quality.yml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      # cast-tripwire scope: the gate must fire on CLI rendering changes and
      # on changes to the tripwire itself or its scripts/snapshots.
      - "scripts/cast-driver/**"
      - "packages/cli/src/**"
      - "packages/cli/package.json"
      - "docs/demos/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/docs/**"
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      # cast-tripwire scope (matches pull_request.paths above)
      - "scripts/cast-driver/**"
      - "packages/cli/src/**"
      - "packages/cli/package.json"
      - "docs/demos/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: lychee link check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Install lychee directly from its upstream release rather than via
      # `lycheeverse/lychee-action`, which is not on this repo's allowed-actions
      # allowlist (any third-party action outside the verified-creator set is
      # blocked). The binary download is checksum-verified to keep the supply-
      # chain story equivalent to the action.
      - name: Install lychee
        env:
          LYCHEE_VERSION: lychee-v0.24.2
          LYCHEE_TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          archive="lychee-${LYCHEE_TARGET}.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSL --fail -o "${archive}" \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/${archive}"
          curl -sSL --fail -o "${archive}.sha256" \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          tar -xzf "${archive}"
          # Upstream tarball extracts to `lychee-<target>/lychee`, not flat.
          sudo install -m 0755 "lychee-${LYCHEE_TARGET}/lychee" /usr/local/bin/lychee
          lychee --version

      - name: Run lychee
        run: lychee --config lychee.toml --no-progress 'docs/**/*.md' '*.md'

  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Run markdownlint-cli2
        run: bun run lint:markdown

  og-card-render:
    name: OG card render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Render OG card
        run: bun run render:og-card

      - name: Verify PNG is up to date
        run: |
          if ! git diff --exit-code docs/og-card.png; then
            echo "::error::docs/og-card.png is out of date. Run 'bun run render:og-card' locally and commit the result."
            exit 1
          fi

  svg-audit:
    name: SVG asset audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Run SVG asset audit
        run: bun run audit:svg-assets

  readme-cli-tripwire:
    name: README CLI-command tripwire
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Run README CLI-command tripwire
        run: bun run audit:readme-cli

  package-readmes:
    name: Package READMEs audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Run package READMEs audit
        run: bun run audit:package-readmes

  cast-tripwire:
    name: Cast transcript tripwire
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Build @nimbus-dev/client (required by spawned CLI)
        run: bun run --filter @nimbus-dev/client build

      - name: Run cast tripwire
        run: bun run record-casts --check --artifacts-dir=cast-artifacts

      - name: Upload drift artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cast-drift
          path: cast-artifacts/
          retention-days: 7

  docs-build:
    name: Starlight build test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nimbus CI
        uses: ./.github/actions/setup-nimbus-ci

      - name: Run build
        run: bun --cwd packages/docs run build
