name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]
  # `cla` is a required context in the General ruleset, and a merge-queue entry
  # has no PR of its own to sign — see `cla-merge-queue` below.
  merge_group:
    types: [checks_requested]

# Least privilege at the workflow level: every job starts read-only. The single
# `cla` job re-grants exactly the writes contributor-assistant needs, so the
# elevated token never leaks to any job added here later.
permissions:
  contents: read

concurrency:
  # A queue entry has neither a PR nor an issue number; without its own SHA every
  # queue run would share the group `cla-`, and a newer pending one would evict
  # the older — leaving that entry's required `cla` context unreported.
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.event.merge_group.head_sha }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Scoped to this job only (upstream documents these at top level):
    #   actions:write       — re-runs the workflow after a `recheck`/sign comment
    #   pull-requests:write — posts the not-signed / signed PR comment
    #   statuses:write      — sets the commit status the action reports through
    # contents stays `read`: signatures are written to the remote `.github` repo
    # with the App token below, never with GITHUB_TOKEN.
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    # Only run on the sign/recheck comment or on a PR event — never on other comments.
    if: >-
      (github.event.issue.pull_request && contains(fromJSON('["I have read the CLA Document and I hereby sign the CLA","recheck"]'), github.event.comment.body))
      || github.event_name == 'pull_request_target'
    steps:
      - name: Mint CLA App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLA_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: ${{ github.event.repository.name }},.github
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.apptoken.outputs.token }}
        with:
          path-to-document: 'https://github.com/nimbus-agent/.github/blob/main/CLA/ICLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          remote-repository-name: '.github'
          branch: 'cla-signatures'
          allowlist: 'bot*,asafgolombek,claude'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your PR. Before it can be merged, please sign the [Individual CLA](https://github.com/nimbus-agent/.github/blob/main/CLA/ICLA.md) by commenting exactly: **I have read the CLA Document and I hereby sign the CLA**. Contributing on behalf of an employer? See the [Corporate CLA](https://github.com/nimbus-agent/.github/blob/main/CLA/CCLA.md).'

  # The merge queue re-runs every required context on the MERGED result, and
  # `cla` is one of them. A queue entry has no PR to sign or comment on, and it
  # only exists because its PR already passed `cla` — the queue admits a PR only
  # once every required check is green on it. So this job reports the same
  # context name and passes. It holds no token and no write permission: it
  # cannot sign, and it cannot vouch for anything the PR-time check did not.
  cla-merge-queue:
    name: cla
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: CLA was verified on the PR before it entered the queue
        env:
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: echo "merge_group ${QUEUE_REF} — CLA already verified at PR time"
