name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# Least privilege at the workflow level: every job starts read-only. The single
# `cla` job re-grants exactly the writes contributor-assistant needs, so the
# elevated token never leaks to any job added here later.
permissions:
  contents: read

# One group per PR, so two runs never post comments or write signatures for the same PR at once.
# Only a run whose job will execute may join it. Every comment on a PR (a bot's review, a reply)
# starts this workflow too, and the job's `if:` skips it, but a run joins its group when it is
# created, before that `if:` is read, and GitHub cancels a group's pending run whenever a newer one
# joins. On #1679 a reply evicted the queued run for a new head commit, so that commit never got
# its required `cla` check and the PR stayed BLOCKED with every visible check green. A run the
# `if:` will skip gets a group of its own. The condition repeats the job's `if:`, and
# `scripts/ci/cla-concurrency.test.ts` fails if the two drift apart.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request_target'
    || (github.event.issue.pull_request
    && contains(fromJSON('["I have read the CLA Document and I hereby sign the CLA","recheck"]'), github.event.comment.body)))
    && format('cla-{0}', github.event.pull_request.number || github.event.issue.number)
    || format('cla-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Scoped to this job only (upstream documents these at top level):
    #   actions:write       — re-runs the workflow after a `recheck`/sign comment
    #   pull-requests:write — posts the not-signed / signed PR comment
    #   statuses:write      — sets the commit status the action reports through
    # contents stays `read`: signatures are written to the remote `.github` repo
    # with the App token below, never with GITHUB_TOKEN.
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    # Only run on the sign/recheck comment or on a PR event — never on other comments.
    if: >-
      (github.event.issue.pull_request && contains(fromJSON('["I have read the CLA Document and I hereby sign the CLA","recheck"]'), github.event.comment.body))
      || github.event_name == 'pull_request_target'
    steps:
      - name: Mint CLA App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLA_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: ${{ github.event.repository.name }},.github
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.apptoken.outputs.token }}
        with:
          path-to-document: 'https://github.com/nimbus-agent/.github/blob/main/CLA/ICLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          remote-repository-name: '.github'
          branch: 'cla-signatures'
          allowlist: 'bot*,asafgolombek,claude'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your PR. Before it can be merged, please sign the [Individual CLA](https://github.com/nimbus-agent/.github/blob/main/CLA/ICLA.md) by commenting exactly: **I have read the CLA Document and I hereby sign the CLA**. Contributing on behalf of an employer? See the [Corporate CLA](https://github.com/nimbus-agent/.github/blob/main/CLA/CCLA.md).'
