name: Labeller
# SECURITY: `pull_request_target` runs with repo secrets + a write token on fork PRs.
# This workflow is the canonical SAFE use — it does NOT check out PR head code and only runs
# the SHA-pinned actions/labeler. Do NOT add a `checkout` of the PR head ref or any `run:` step
# that executes PR-controlled code here — that would turn this into an RCE / secret-exfil vector.
on: [pull_request_target]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
