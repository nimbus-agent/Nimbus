name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # release-please authenticates with the minted release-bot App token (step below), not
    # GITHUB_TOKEN; these job-level permissions scope the automatic GITHUB_TOKEN the other
    # steps (checkout, harden-runner) use.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus
          permission-contents: write
          permission-pull-requests: write
          # `issues: write` is required to flip the `autorelease:` labels on the
          # release PR (labels are an issues-API concept for GitHub Apps) — both
          # for release-please's own pending→tagged flip and the reconcile step below.
          permission-issues: write
          # `workflows: write` is required to CREATE THE TAG, which is not obvious.
          # GitHub refuses to let a GitHub App create a ref pointing at a commit whose
          # `.github/workflows/**` differs from the default branch, unless the App holds
          # `workflows: write` — it counts as the App "creating or updating a workflow".
          # A release tag always points at the release PR's merge commit, which falls
          # behind main the moment any later PR touches a workflow file, so this fires on
          # exactly the releases we care about. REST reports it only as an opaque
          # `403 Resource not accessible by integration` on `POST /git/refs`; the git
          # transport spells it out ("refusing to allow a GitHub App to create or update
          # workflow ... without `workflows` permission"). Proven by probe: the same token
          # creating the same ref shape at main's head returns 201, and at PR #827's merge
          # commit returns 403. This must stay in lockstep with the App's granted
          # permissions: minting fails outright if the App lacks `Workflows: write`.
          permission-workflows: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      # Phantom-release guard. release-please in this repo intermittently merges the
      # "chore: release main" PR (bumping the manifest) but never creates the tag/GitHub
      # Release — its release-creation phase fails, after which it aborts every run with
      # "untagged, merged release PRs outstanding". Since the switch to the App token that
      # failure is consistent with the `workflows: write` gate documented on the mint step
      # above (release-please tags the release PR's merge commit, which is exactly the
      # blocked shape), so granting that permission may fix it at the source and reduce
      # this step to a safety net; the phantoms predating the App had some other cause and
      # were never attributed. The symptom is the same either way: a
      # merged release PR left labelled `autorelease: pending` with no matching tag. This
      # step automates the standing manual recovery (create the tag + relabel), so releases
      # ship hands-free regardless of why the native step misfired. It is idempotent: on a
      # healthy run (nothing pending) it no-ops. The tag is created with the App token, which
      # — unlike GITHUB_TOKEN — DOES trigger the tag-driven release.yml build.
      - name: Reconcile phantom release (create missing tag + relabel)
        # `always()`: this is the recovery path — it must run even when the
        # release-please step above errored (the very failure it recovers from),
        # not just on success. Skipped only if the job is cancelled outright.
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pending=$(gh pr list --repo "$REPO" --state merged --label "autorelease: pending" \
                      --json number,mergeCommit --jq '.[] | [.number, .mergeCommit.oid] | @tsv')
          if [ -z "$pending" ]; then
            echo "No untagged, merged release PRs — nothing to reconcile."
            exit 0
          fi
          while IFS=$'\t' read -r num sha; do
            [ -n "${num:-}" ] || continue
            ver=$(gh api "repos/${REPO}/contents/.release-please-manifest.json?ref=${sha}" \
                    --jq '.content' | tr -d '\n' | base64 -d | jq -r '."."')
            if [ -z "$ver" ] || [ "$ver" = "null" ]; then
              echo "::warning::could not read manifest version for PR #${num} at ${sha}; skipping"
              continue
            fi
            tag="v${ver}"
            # Resolve the tag to its COMMIT (the commits endpoint dereferences both
            # lightweight and annotated tags); empty => the tag does not exist.
            #
            # `gh` writes its JSON error body to STDOUT, not stderr, so a missing tag
            # returns exit 1 AND prints {"message":"No commit found for SHA: vX.Y.Z",
            # "status":"422"}. Capturing that with `$(... || true)` leaves `existing`
            # NON-empty, which silently defeated the `-z` check below: every phantom
            # fell through to the "points elsewhere" branch and was never tagged.
            # (This is why v0.27.0 sat unreleased.) So: assign ONLY on a zero exit,
            # and additionally require the value to look like a commit sha, so no
            # future error-body shape can impersonate a resolved tag.
            # Three outcomes must stay distinct — collapsing them is what broke this
            # step in the first place:
            #   exit 0            -> the tag resolves; compare it to the merge commit
            #   HTTP 404 or 422   -> genuinely absent; this is the phantom, so create it
            #   anything else     -> auth / rate-limit / network: we CANNOT tell whether
            #                        the tag exists, so fail loudly instead of guessing
            #                        (creating a tag on a bad read is unrecoverable).
            # NOTE: a missing ref on the commits endpoint returns **422** ("No commit
            # found for SHA"), not 404 — verified live. Treating only 404 as absent
            # would make every real phantom fatal and defeat the recovery entirely.
            set +e
            out=$(gh api "repos/${REPO}/commits/${tag}" --jq '.sha' 2>&1)
            rc=$?
            set -e
            existing=""
            if [ "$rc" -eq 0 ]; then
              existing="$out"
              if ! [[ "$existing" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::${tag} lookup returned a non-sha payload: ${out}"
                exit 1
              fi
            elif grep -qE '\(HTTP (404|422)\)' <<<"$out"; then
              existing=""
            else
              echo "::error::${tag} lookup failed and it is NOT a missing-tag response — refusing to guess: ${out}"
              exit 1
            fi
            if [ -z "$existing" ]; then
              echo "Phantom detected: PR #${num} merged as ${ver} but ${tag} is missing. Creating it."
              gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}"
              echo "Created ${tag} at ${sha} (App token → triggers release.yml)."
            elif [ "$existing" != "$sha" ]; then
              # Tag name exists but points elsewhere — do NOT relabel, or we would mark the
              # PR released against the wrong tree. Surface it for a human instead.
              echo "::warning::${tag} exists but points at ${existing}, not PR #${num}'s merge commit ${sha}; not relabelling — needs manual review."
              continue
            else
              echo "${tag} already points at ${sha} — relabelling PR #${num} only."
            fi
            gh pr edit "$num" --repo "$REPO" \
              --add-label "autorelease: tagged" --remove-label "autorelease: pending"
            echo "Relabelled PR #${num}: autorelease: pending → tagged."
          done <<< "$pending"

      # Silent-drop guard. DISTINCT from the phantom-release step above: that one recovers a
      # release PR that merged without a tag. This one catches the opposite failure — no
      # release PR is ever produced, and the run still reports success.
      #
      # release-please parses each commit with the conventional-commits grammar and SKIPS any
      # commit it cannot parse, then decides from what is left. On 2026-08-05 it logged:
      #
      #   ❯ commit could not be parsed: dd98484b … feat(index): … (#1047)
      #   ❯ error message: Error: unexpected token '(' at 155:42, valid tokens [)]
      #   ❯ commits: 2                                        <- was 3
      #   ✔ No user facing commits found since b561a9d… - skipping
      #
      # Line 155 of that message was `collapseWhitespace(stripHtmlTagsToSpaces(…))` — a nested
      # call containing an ellipsis, inside PROSE. Parens were balanced; the grammar simply
      # rejects `(` there. The feat was dropped, only docs/chore remained, and v1.20.0 stayed
      # the latest release while schema V49 sat on main. Nothing went red.
      #
      # This is structural, not bad luck: squash-merge puts the ENTIRE PR description into the
      # commit body (see CLAUDE.md), so any prose token the grammar dislikes can silently cost
      # a release. The invariant below is the one thing that cannot be true on a healthy run:
      # a user-facing commit exists since the last release, yet there is neither a new release
      # nor an open release PR.
      - name: Guard — a user-facing commit must produce a release or a release PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RELEASES_CREATED: ${{ steps.release-please.outputs.releases_created }}
        run: |
          set -euo pipefail

          # No release yet => nothing to compare against; the first release is not this step's
          # business. Any other read failure is fatal rather than silently "clean".
          set +e
          tag=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -qE '\(HTTP 404\)' <<<"$tag"; then
              echo "No published release yet — nothing to compare against."
              exit 0
            fi
            echo "::error::could not read the latest release, refusing to guess: ${tag}"
            exit 1
          fi

          # Subjects only: a body line can look like a conventional header and would inflate
          # the count, which would make this guard fire on runs that are actually healthy.
          subjects=$(gh api "repos/${REPO}/compare/${tag}...main" \
                       --jq '.commits[].commit.message | split("\n")[0]')
          facing=$(grep -cE '^(feat|fix)(\([^)]*\))?!?:' <<<"$subjects" || true)

          echo "Since ${tag}: $(wc -l <<<"$subjects") commit(s), ${facing} user-facing."
          if [ "$facing" -eq 0 ]; then
            echo "No feat/fix since ${tag} — release-please correctly produced nothing."
            exit 0
          fi

          pending=$(gh pr list --repo "$REPO" --state open \
                      --label "autorelease: pending" --json number --jq 'length')
          if [ "${RELEASES_CREATED:-false}" = "true" ] || [ "$pending" -gt 0 ]; then
            echo "Healthy: releases_created=${RELEASES_CREATED:-false}, open release PR(s)=${pending}."
            exit 0
          fi

          echo "::error::${facing} user-facing commit(s) since ${tag}, but release-please produced neither a release nor a release PR."
          echo "::error::Most likely it could not PARSE one of them and skipped it. Open this run's release-please step and look for 'commit could not be parsed' and a 'commits: N' lower than the count above."
          echo "::error::Unstick with a 'Release-As: X.Y.Z' trailer as the LAST line of a PR description, and keep prose with nested parens out of commit bodies."
          grep -E '^(feat|fix)(\([^)]*\))?!?:' <<<"$subjects" | sed 's/^/  dropped-or-unreleased: /'
          exit 1
