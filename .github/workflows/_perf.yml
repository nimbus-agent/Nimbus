name: Performance Benchmarks

# Triggers (spec §4.3, design D-W/D-AB):
#   - push to main: writes the per-OS baseline artifact subsequent PRs diff against.
#   - schedule: '0 4 * * 1-6' (Mon–Sat, Linux only via cost-fallback gate);
#               '0 4 * * 0'   (Sunday, full three-OS coverage).
#   - pull_request: run only when labels include `perf` (auto-applied by labeler.yml
#     on changes under packages/gateway/src/{engine,db,embedding,connectors,llm,voice,perf}/**).
#
# Cost-fallback gate (spec §4.3): macOS+Windows skip the heavy bench/upload/
# compare steps on Mon–Sat nightlies; cheap setup steps (Harden Runner,
# Checkout, Setup Bun, install) run unconditionally. Net: ~95% per-non-Linux-OS
# minutes saved on weekday nights. Push-to-main and perf-PRs always run all
# three OSes, so artifacts on `main` are kept fresh on every merge.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 4 * * 1-6"   # Mon–Sat 04:00 UTC — Linux only (cost-fallback gate, D-W/D-AB)
    - cron: "0 4 * * 0"     # Sunday 04:00 UTC — full three-OS coverage

# Note: per-job permissions and concurrency are used (not workflow-level)
# per SonarQube `githubactions:S8264` / `S8233` (least-privilege at the
# narrowest scope) and because workflow-level `concurrency` cannot read
# `matrix.*` — it would degrade to one shared group across all OSes and
# serialise the matrix.
#
# A workflow-level `permissions: {}` baseline is still set so any job
# that omits its own permissions block inherits no token scopes (Scorecard
# `Token-Permissions` requires a top-level declaration). Each job below
# explicitly grants only the scopes it actually uses.
permissions: {}

jobs:
  detect-trigger:
    name: Decide whether to run the bench matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push|schedule)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              # Only run when the `perf` label is on the PR.
              labels="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
              if echo "$labels" | tr ' ' '\n' | grep -Fxq "perf"; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  benchmark:
    needs: detect-trigger
    if: needs.detect-trigger.outputs.run == 'true'
    name: Bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write        # github-action-benchmark auto-push to the perf-data orphan branch (push events only)
      pull-requests: write   # for `gh pr comment` upsert in bench-ci.ts
      actions: read          # for `gh run list` + `gh run view` + `gh run download`
      checks: write          # for the advisory Bencher "Bencher Report" check run (`bencher run --github-actions`)
    # Spec § 4.3 — do not skew measurements by cancelling a running matrix.
    # Group by (workflow, os, ref) so different branches don't queue behind
    # each other but two pushes on the same branch+OS serialise.
    # Note: on Mon–Sat nightlies, macOS/Windows provision-then-skip (~2 min)
    # before releasing their concurrency slot. A same-branch push arriving
    # during that window queues briefly; accepted trade-off per D-W.
    concurrency:
      group: bench-${{ github.workflow }}-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Copied to a job-level env so step-level `if:` can gate on the secret's
      # presence (secrets cannot be referenced directly in `if:`). Absent secret
      # => Bencher steps skip cleanly (forks, repo copies, pre-ops-setup window).
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      # The S1 / S4 / S6-* / S7-a / S7-b drivers spawn `bun packages/gateway/
      # src/index.ts`. Gateway init calls `createPlatformServices()`, which on
      # Linux requires `secret-tool` (libsecret-tools) and on macOS needs an
      # unlocked Keychain. Without these the gateway exits 1 before printing
      # `[gateway] ready`, and every spawn-based surface fails fast. Steps
      # mirror `_test-suite.yml` (lines 54-72) — keep in sync.
      - name: Linux — libsecret + D-Bus (gateway vault init)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-vault-deps.sh

      # macOS GHA marks downloaded native libs with `com.apple.quarantine`,
      # which blocks dlopen() of `sqlite-vec.dylib` from the bun:sqlite Workers
      # spawned by the S10 driver and exits the bench with code 139 (SIGSEGV).
      # Strip it pre-bench. Mirrors `_test-suite.yml:59-62`.
      - name: macOS — Strip quarantine from native SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: find node_modules -name "*.dylib" -print0 2>/dev/null | xargs -0 xattr -d com.apple.quarantine 2>/dev/null || true

      - name: macOS — Create and unlock CI Keychain (gateway vault init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security create-keychain -p "" nimbus-ci.keychain
          security list-keychains -d user -s nimbus-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s nimbus-ci.keychain
          security unlock-keychain -p "" nimbus-ci.keychain
          security set-keychain-settings -lut 7200 nimbus-ci.keychain

      # The 12 S8 cells embed with `Xenova/all-MiniLM-L6-v2`, which
      # `@xenova/transformers` pulls from huggingface.co on a cold cache. In run
      # 30300911723 huggingface.co went unreachable from the ubuntu runner and
      # the leg died on the 45-minute job timeout. Persisting the weights across
      # runs takes huggingface.co off the critical path entirely, so S8 stays
      # measurable (and the run ~30 s shorter) whatever the network is doing.
      # The repo id is pinned in `embedding/load-feature-extraction-pipeline.ts`
      # — bump the `-v1` suffix when that pin changes, since actions/cache never
      # overwrites an existing key.
      - name: Cache MiniLM embedding weights (S8)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf-models
          key: ${{ runner.os }}-perf-minilm-xenova-all-minilm-l6-v2-v1

      # Derive runner_id once. bench-ci.ts and the artifact upload BOTH
      # consume this id verbatim — earlier versions had divergent forms
      # (matrix OS for upload, normalised id for lookup) and the artifact
      # name silently never matched. Keep the two sides aligned.
      - name: Derive runner id
        id: runner-id
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)   runner_id="gha-ubuntu" ;;
            macOS)   runner_id="gha-macos" ;;
            Windows) runner_id="gha-windows" ;;
            *)       runner_id="gha-${RUNNER_OS,,}" ;;
          esac
          echo "id=${runner_id}" >> "$GITHUB_OUTPUT"

      - name: Run bench (retry once on a crashed run)
        if: |
          matrix.os == 'ubuntu-24.04' ||
          github.event_name != 'schedule' ||
          github.event.schedule == '0 4 * * 0'
        shell: bash
        env:
          # Points every embedder in the bench at the cached weights above.
          # `createLocalEmbedder` treats this as the transformers cache dir, so a
          # cold cache downloads INTO it and the post-job cache save persists it.
          NIMBUS_EMBEDDING_MODEL_DIR: ${{ runner.temp }}/perf-models
        # The whole bench is one long-lived `bun` process. On the shared GHA
        # runners it intermittently dies with a SIGSEGV (exit 139) inside the
        # `bun:sqlite` Worker / `dlopen(sqlite-vec.dylib)` path the S8/S10
        # surfaces spawn — the same exit-139 class the quarantine-strip step
        # above guards against, but the surviving residue is transient runtime
        # jitter, not a deterministic dlopen block (run 27756789856 segfaulted on
        # macos-15 at SHA 5613f7d3, yet that identical SHA re-ran green twice).
        # A crashed run yields no measurement at all, so it is never a perf
        # signal on any OS; retry once on a warm process. Attempt 2's exit code
        # MUST propagate so two genuine failures still red the leg (no silent
        # flake-hiding). Mirrors the retry-once shape in `_test-suite.yml` and
        # `ci.yml`'s `pr-quality-cross-platform`.
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/perf-fixtures" "${RUNNER_TEMP}/perf-models"
          for attempt in 1 2; do
            # Each attempt writes the single aggregate history line only on a
            # clean finish (bench-cli.ts), and a SIGSEGV is uncatchable so it
            # appends nothing — a retry starts from an empty history, no dupes.
            : > "${RUNNER_TEMP}/run-history.jsonl"
            bun packages/gateway/src/perf/bench-runner.ts \
              --all --gha --runs 5 --corpus small \
              --history "${RUNNER_TEMP}/run-history.jsonl" \
              --fixture-cache "${RUNNER_TEMP}/perf-fixtures"
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Both bench attempts failed with exit code $code"
              exit "$code"
            fi
            echo "Bench attempt $attempt failed (exit $code), retrying in 5 s..."
            sleep 5
          done

      - name: Upload run history artifact
        if: |
          matrix.os == 'ubuntu-24.04' ||
          github.event_name != 'schedule' ||
          github.event.schedule == '0 4 * * 0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # MUST match the format `perf-${runner_id}-${sha}` that
          # bench-ci.ts constructs for `gh run download --name ...`.
          name: perf-${{ steps.runner-id.outputs.id }}-${{ github.sha }}
          path: ${{ runner.temp }}/run-history.jsonl
          retention-days: 90

      # ── Bencher Cloud advisory trend ingest (perf strategy Phase 2) ──────────
      # Runs alongside github-action-benchmark during the soak window. Advisory
      # only: the in-code gateClass comparator stays the sole gate. Skips when
      # BENCHER_API_KEY is unset (forks / pre-ops-setup) and on fork PRs.
      - name: Install Bencher CLI
        # Same secret-presence + leg gate as the emit/publish steps so a
        # provision-then-skip nightly leg (macOS/Windows Mon–Sat) doesn't install
        # the CLI for nothing.
        if: |
          env.BENCHER_API_KEY != '' && (
            matrix.os == 'ubuntu-24.04' ||
            github.event_name != 'schedule' ||
            github.event.schedule == '0 4 * * 0'
          )
        continue-on-error: true # advisory: an install hiccup on any leg must never red the perf job
        uses: bencherdev/bencher@4c83b25441d145ee273adaf74be30f2382e6ba85 # v0.6.11

      - name: Emit Bencher BMF
        id: bencher-emit
        if: |
          env.BENCHER_API_KEY != '' && (
            matrix.os == 'ubuntu-24.04' ||
            github.event_name != 'schedule' ||
            github.event.schedule == '0 4 * * 0'
          )
        continue-on-error: true # advisory: a BMF-emit failure must never red the perf job (publish then skips on the empty `surfaces` output)
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/perf/emit-bencher-bmf.ts \
            --in "${RUNNER_TEMP}/run-history.jsonl" \
            --out "${RUNNER_TEMP}/bencher.json"
          # Expose the surface count so the publish step can skip an empty BMF.
          # `|| echo 0` keeps a malformed/garbage BMF from tripping pipefail.
          surfaces="$(jq 'length' "${RUNNER_TEMP}/bencher.json" 2>/dev/null || echo 0)"
          echo "surfaces=${surfaces}" >> "$GITHUB_OUTPUT"

      - name: Publish to Bencher
        # Skip empty BMF (all-stub run) and fork PRs (secrets unavailable). On a
        # same-repo PR -> the head ref with main as the start point; on any other
        # event (push / schedule / dispatch) -> branch main. Advisory: no
        # thresholds configured => never fails; the `continue-on-error` makes a
        # transient API error non-blocking too.
        if: |
          steps.bencher-emit.outputs.surfaces != '' &&
          steps.bencher-emit.outputs.surfaces != '0' && (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUNNER_ID: ${{ steps.runner-id.outputs.id }}
        run: |
          set -euo pipefail
          common=(
            --project nimbus
            --key "${BENCHER_API_KEY}"
            --adapter json
            --file "${RUNNER_TEMP}/bencher.json"
            --testbed "${RUNNER_ID}"
            --github-actions "${GITHUB_TOKEN}"
          )
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            bencher run \
              "${common[@]}" \
              --branch "${GITHUB_HEAD_REF}" \
              --start-point main \
              --start-point-hash "${BASE_SHA}" \
              --start-point-clone-thresholds \
              --start-point-reset \
              --ci-only-thresholds
          else
            bencher run "${common[@]}" --branch main
          fi

      # Push-to-main, UBUNTU LEG ONLY: feed the trend-class p95/RSS surfaces to
      # the github-action-benchmark dashboard on the orphan `perf-data` branch.
      # Restricted to a single runner so each surface is one coherent series (not
      # three OSes interleaved) and the matrix legs don't race on the same
      # auto-push. Advisory only (fail-on-alert: false) — gating lives in the
      # Compare step (PR events) and the M1-Air reference cron. Never runs on PRs
      # or nightly schedules, so the dashboard tracks the canonical main (ubuntu)
      # baseline. (Per-OS trend tracking is the drift-check's job, wired later.)
      - name: Emit trend benchmark JSON
        if: github.event_name == 'push' && matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/perf/emit-benchmark-json.ts \
            --in "${RUNNER_TEMP}/run-history.jsonl" \
            --out "${RUNNER_TEMP}/benchmark.json"

      - name: Publish to github-action-benchmark trend dashboard
        if: github.event_name == 'push' && matrix.os == 'ubuntu-24.04'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/benchmark.json
          gh-pages-branch: perf-data
          benchmark-data-dir-path: dev/bench
          auto-push: true
          fail-on-alert: false
          comment-on-alert: true
          alert-threshold: "200%"
          max-items-in-chart: 500
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare + post PR-comment delta
        if: |
          matrix.os == 'ubuntu-24.04' ||
          github.event_name != 'schedule' ||
          github.event.schedule == '0 4 * * 0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun packages/gateway/src/perf/bench-ci.ts \
            --current "${RUNNER_TEMP}/run-history.jsonl" \
            --runner "${{ steps.runner-id.outputs.id }}"
