# Build and deploy the Astro Starlight docs site (packages/docs) to GitHub Pages.
# Site URL: https://asafgolombek.github.io/Nimbus/ (project pages — base = /Nimbus/).
# Configured under repo Settings → Pages → Source = GitHub Actions (build_type=workflow).

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# Only one Pages deploy can run at a time; queueing prevents racey
# overwrite of the live site. `cancel-in-progress: false` lets each push
# finish so we don't ship partial builds.
concurrency:
  group: pages
  cancel-in-progress: false

# Workflow-level default is read-only so any new step inherits the safest
# scope. Each job widens its own permissions to exactly what it needs:
# `build` reads source, `deploy` writes Pages + mints the OIDC token
# `actions/deploy-pages` requires.
permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Astro 6 enforces Node >=22.12.0 at runtime (its check.ts shells out to
      # Node, not Bun, so Bun's own runtime version doesn't satisfy this).
      # The default GHA ubuntu image ships Node 20.x, which Astro rejects.
      - name: Setup Node.js (Astro requires >=22.12.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Build Astro Starlight site
        run: bun run --filter @nimbus/docs build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/docs/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke check custom domain
        run: |
          set -e
          # Wait up to 60s for DNS / GitHub Pages to settle.
          response="000"
          for i in $(seq 1 12); do
            response=$(curl -sSL -o /tmp/index.html -w "%{http_code}" https://nimbus-agent.dev/ || echo "000")
            if [ "$response" = "200" ]; then
              break
            fi
            sleep 5
          done
          if [ "$response" != "200" ]; then
            echo "::error::Custom domain failed to respond 200 after 60s (got $response)"
            exit 1
          fi
          if ! grep -q "Nimbus" /tmp/index.html; then
            echo "::error::Deployed page does not contain expected 'Nimbus' string"
            exit 1
          fi
          echo "✓ https://nimbus-agent.dev/ responded 200 with expected content"
