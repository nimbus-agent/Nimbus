name: Test Suite

# Reusable workflow — called by ci.yml (pr-quality-ts and ci-ts).
# Runs all TS/Bun checks and tests for a single OS runner.
#
# Structure: split into parallel jobs so the PR critical path is the max
# of the longest job, not the sum. The old monolithic `test` job ran for
# ~9.5 min on ubuntu PRs; with this split the critical path is the
# `unit-coverage` job (~5 min on ubuntu) plus the `coverage-gates-*` matrices
# (~1 min), and the other jobs run alongside.
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label (e.g. ubuntu-24.04)
        type: string
        required: true
      run-packaging:
        description: Build headless bundle and Linux installers after tests (Ubuntu only)
        type: boolean
        default: false
      run-tests:
        description: >-
          Run the actual test/static jobs. Defaults true. The PR caller sets
          this to false on docs-only PRs so every job skips (reported as a
          passing "skipped" required check) without doing test work. Push and
          release callers leave it true.
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        description: |
          SonarQube Cloud token for the optional SonarQube analysis step
          (Linux-only, gated on the token being non-empty). When omitted the
          analysis step is silently skipped — useful for forks and contributor
          PRs that legitimately have no token access.
        required: false

permissions:
  contents: read

jobs:
  # ── Static checks: typecheck, lint, audits, monorepo build ────────────────
  # All static gates that don't need a test environment. Runs in parallel with
  # the test jobs below; the longest job (unit-coverage) sets the critical
  # path on ubuntu PRs.
  static:
    name: Static — ${{ inputs.runner }}
    if: inputs.run-tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck test/** (baseline ratchet)
        # `typecheck` is blind to test directories — they are in no package's
        # tsconfig `include`, which is how #1038 broke five ToolExecutor call
        # sites under packages/gateway/test/** and still exited 0. This gate
        # covers them against a committed baseline of pre-existing debt; only
        # NEW errors fail, and it emits `::error file=...::` annotations that
        # render inline on the PR diff.
        #
        # Linux-only, mirroring `audit:coverage-floor`: the baseline is a
        # per-(file, code) count and the ratchet now fails in BOTH directions,
        # so a host-specific tsc count difference would red a required check
        # rather than report anything useful. This job runs on ubuntu for every
        # PR (pr-quality-ts), which is the gate that matters.
        if: runner.os == 'Linux'
        run: bun run typecheck:tests

      - name: Lint + format (Biome)
        run: bun run lint

      - name: Doc references (CLAUDE.md / GEMINI.md / docs / .claude/commands)
        # Verifies that every file path written as a backtick-wrapped repo
        # ref or as a Markdown link target in the AI-context docs resolves
        # to a real file in the working tree, and that any `:NN` line-number
        # suffix is within the file's bounds. See
        # scripts/structure-audit/check-doc-references.ts for the scan
        # surface and exclusions (roadmap.md is exempt — it describes
        # forward-looking phase files by design).
        run: bun run audit:doc-refs

      - name: OpenAPI drift check
        run: bun run audit:openapi-drift

      - name: Cross-platform audit (test path assertions)
        run: bun run audit:cross-platform

      - name: Status-drift audit (docs invariant/schema vs code)
        run: bun run audit:status-drift

      - name: GitHub Actions SHA-pin audit (org policy)
        run: bun run audit:action-sha-pins

      - name: workflow_run upstream-trigger audit (pwn-request premise)
        # The two publish-* workflows check out `workflow_run.head_sha` with
        # release secrets in scope. That is only safe because their sole
        # upstream ("Release") runs on tag push, which needs write access.
        # This gate fails the build if an upstream ever becomes fork-reachable.
        run: bun run audit:workflow-run-triggers

      - name: Workflow lint (block-scalar escapes + shell syntax)
        # A heredoc body at column 0 terminates the enclosing `run: |` block
        # scalar and invalidates the whole file. GitHub then records a run with
        # ZERO jobs and a failure conclusion — no job, no log, no annotation —
        # which reads like a product failure. js-yaml parses it happily, so
        # "it parses" is not sufficient validation.
        run: bun run audit:workflow-lint

      # The three audits below guard the compiled binary. They shipped into the local preflight
      # manifest but no workflow ran them, so nothing gated a contributor's PR on them.
      - name: Connector entrypoint contract (bundled-registry startability)
        # A connector guarding startup with import.meta.main is invisible to the bundled registry:
        # the guard is false under an import, so it loads, starts nothing and exits 0 in silence.
        run: bun run audit:connector-entrypoints

      - name: Connector dependency allowlist (pure JS only — the binary bundles them)
        run: bun run audit:connector-deps

      - name: Connector registry drift (generated file vs. tree)
        # The bundled registry is generated into a committed file. Nothing else diffs it, and
        # test:connector-boot cannot: it boots what the registry ships, so a connector missing
        # FROM the registry is invisible to it.
        run: bun run audit:connector-registry-drift

      - name: import.meta path confinement (compiled-binary asset resolution)
        # A source-tree-relative path derived from import.meta.dir resolves inside the read-only
        # bunfs root in a compiled binary. Two such sites made the admin console and the OpenAPI
        # route unreachable in every released binary.
        run: bun run audit:import-meta-dir

      - name: regen-slo drift check
        run: bun run regen-slo:check

      - name: Build all packages
        run: bun run build

  # ── Unit tests + UI + coverage + Sonar ─────────────────────────────────────
  # The longest single job. Produces the merged coverage/lcov.info that the
  # coverage-gates-* matrices and the per-file coverage floor consume.
  unit-coverage:
    name: Unit + Coverage — ${{ inputs.runner }}
    if: inputs.run-tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history is required so the SonarCloud scan further down can
          # resolve the PR base ref and compute "new code" correctly. With the
          # default shallow checkout, Sonar logs
          # `Could not find ref: main in refs/heads, refs/remotes/upstream or
          # refs/remotes/origin` and falls back to treating every changed file
          # as new — which flips `new_coverage` to ~0% and surfaces every
          # legacy hotspot as unreviewed-new, failing the Quality Gate
          # spuriously. Only this job's checkout needs the full history; the
          # other jobs use the default shallow clone.
          fetch-depth: 0

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Diagnostic — runtime environment
        shell: bash
        run: |
          echo "=== Runtime versions ==="
          bun --version
          rustc --version 2>/dev/null || echo "(rustc not installed on this job)"
          node --version 2>/dev/null || echo "(node not installed on this job)"
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd --version | head -1
          fi

      - name: Linux — libsecret + D-Bus (vault / PAL tests)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-vault-deps.sh

      # This job's test command is NOT scoped to `src/`: the Linux path runs `bun test` from
      # inside each package (see `run_pkg` below) and the macOS/Windows path runs
      # `bun test packages/gateway packages/cli ...`. Both therefore also collect
      # `packages/gateway/test/integration/`, which includes sandbox-wrapper-spawn.test.ts — a
      # real end-to-end spawn through the `__nimbus-sandbox` role. That suite deliberately goes
      # RED rather than skipping when its platform dependency is missing on CI (a skip and a pass
      # are indistinguishable in a CI summary, which is exactly how the original Windows spawn
      # defect survived a green three-OS matrix), so every job that collects the file needs the
      # dependency — not just the `integration` job. Same shape as `install-vault-deps.sh`
      # above, which is duplicated across the jobs that collect the vault tests for the same
      # reason.
      - name: Linux — bubblewrap (sandbox spawn test, also collected by this job)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-sandbox-deps.sh

      - name: Build sandbox helper (Windows, sandbox spawn test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun run build:sandbox-helper:win32

      - name: macOS — Strip quarantine from native SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: find node_modules -name "*.dylib" -print0 2>/dev/null | xargs -0 xattr -d com.apple.quarantine 2>/dev/null || true

      - name: macOS — Create and unlock CI Keychain (vault / PAL tests)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security create-keychain -p "" nimbus-ci.keychain
          security list-keychains -d user -s nimbus-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s nimbus-ci.keychain
          security unlock-keychain -p "" nimbus-ci.keychain
          security set-keychain-settings -lut 7200 nimbus-ci.keychain

      # Bun writes JUnit XML here. Do not use `reports/` — it is gitignored and dorny/test-reporter's fast-glob skips ignored paths.
      - name: Prepare test report directory
        shell: bash
        run: mkdir -p junit-reports

      - name: Unit tests (with coverage) — Linux
        if: runner.os == 'Linux'
        shell: bash
        # Branch coverage requires Istanbul source instrumentation: Bun's
        # native `--coverage` emits no BRDA branch records (Bun #7100). Two
        # [test] preloads do it instead — istanbul-register.ts babel-transforms
        # first-party src on load (filling globalThis.__coverage__) and
        # report-coverage.ts flushes a per-process shard to coverage/.nyc-tmp/.
        # We still run `bun test` from inside each package (so Bun resolves the
        # right package.json), then merge-coverage.ts unions all shards into a
        # single repo-root coverage/lcov.info with repo-root-relative SF paths.
        run: |
          set -eo pipefail
          rm -rf coverage
          mkdir -p coverage/.nyc-tmp junit-reports

          run_pkg () {
            local pkg="$1"
            local safe_name="${pkg//\//-}"
            # Skip packages with no test files — `bun test` exits 1 with
            # "No tests found!" which would fail the step under
            # `set -eo pipefail`. Several mcp-connectors are scaffold-only
            # today and have no co-located *.test.ts yet.
            if [ -z "$(find "${pkg}" -path "${pkg}/node_modules" -prune -o \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print -quit)" ]; then
              echo "::notice::Skipping ${pkg} — no test files."
              return 0
            fi
            echo "::group::Tests + coverage — ${pkg}"
            (
              cd "${pkg}"
              bash "${GITHUB_WORKSPACE}/scripts/ci/run-with-optional-dbus.sh" \
                bun test \
                --timeout 60000 \
                --preload "${GITHUB_WORKSPACE}/scripts/coverage/istanbul-register.ts" \
                --preload "${GITHUB_WORKSPACE}/scripts/coverage/report-coverage.ts" \
                --reporter=junit \
                --reporter-outfile="${GITHUB_WORKSPACE}/junit-reports/junit-unit-${safe_name}.xml"
            )
            echo "::endgroup::"
          }

          for pkg in packages/gateway packages/cli; do
            run_pkg "${pkg}"
          done

          for pkg in packages/mcp-connectors/* packages/github-actions/*; do
            if [ -f "${pkg}/package.json" ]; then
              run_pkg "${pkg}"
            fi
          done

          # `mcp-connectors/shared` is a relative-import folder (no package.json)
          # so the loop above skips it, yet it has its own *.test.ts. Collect its
          # coverage explicitly — `bun test --coverage` emits an lcov from a
          # package.json-less dir too — so shared utilities (bodystructure,
          # mail-core, mcp-tool-kit, run-cli-json, search-filter) are measured.
          run_pkg "packages/mcp-connectors/shared"

          # `github-actions/shared` is the same case: a package.json-less relative-import
          # folder (gha-io.ts) shared by the preflight-query + annotate-action actions,
          # with its own *.test.ts. Run it explicitly so it is exercised in CI.
          run_pkg "packages/github-actions/shared"

          # Union the per-process istanbul shards (coverage/.nyc-tmp/*.json)
          # written by the report-coverage preload into a single repo-root
          # coverage/lcov.info carrying BRDA branch records.
          bun "${GITHUB_WORKSPACE}/scripts/coverage/merge-coverage.ts"

          # `scripts/` is not a workspace package (no package.json). Its tests
          # ran without coverage attribution before this fix and still do —
          # the structure-audit/regen-slo helpers covered there don't appear
          # in any per-subsystem coverage gate, so omitting them from
          # `coverage/lcov.info` matches the prior project-wide behaviour.
          bun test scripts \
            --reporter=junit \
            --reporter-outfile=junit-reports/junit-unit-scripts.xml
        env:
          CI: "true"

      - name: Unit tests (with coverage) — macOS/Windows (retry once)
        if: runner.os != 'Linux'
        shell: bash
        # Retry-once tolerates the cold-runner timeout outliers in
        # `packages/gateway/src/perf/` and `packages/gateway/src/platform/` on
        # Windows/macOS that come in under budget on a warm second attempt.
        # Critically, attempt 2's exit code MUST propagate — without that, two
        # consecutive genuine failures look identical to two transient flakes
        # and the job exits 0 (silent flake hiding). Mirrors the same shape
        # used by `pr-quality-cross-platform` in `ci.yml`.
        run: |
          set +e
          for attempt in 1 2; do
            # Redirect-then-cat, NOT a pipe: a pipeline would make `$?` the exit code of the
            # last command and silently mask every failure. Same shape as `ci.yml`'s
            # cross-platform retry, and for the same reason — a silent retry costs a full
            # suite run and leaves nothing in the summary to investigate.
            bun test packages/gateway packages/cli packages/mcp-connectors scripts --timeout 60000 --preload "${GITHUB_WORKSPACE}/scripts/coverage/istanbul-register.ts" --preload "${GITHUB_WORKSPACE}/scripts/coverage/report-coverage.ts" --reporter=junit --reporter-outfile=junit-reports/junit-unit.xml > "${RUNNER_TEMP}/attempt-${attempt}.log" 2>&1
            code=$?
            cat "${RUNNER_TEMP}/attempt-${attempt}.log"
            if [ "$code" -eq 0 ]; then
              if [ "$attempt" -eq 2 ]; then
                echo "::warning title=Retry masked a failure::The unit suite FAILED on attempt 1 and passed on attempt 2 (${{ inputs.runner }}). Green, but two full suite runs were paid for — see the annotations naming the failing test(s)."
              fi
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Both attempts failed with exit code $code"
              exit "$code"
            fi
            echo "Attempt $attempt failed (exit $code), retrying in 5 s..."
            failed=$(grep -E '^\(fail\)' "${RUNNER_TEMP}/attempt-${attempt}.log" | head -20 || true)
            if [ -n "$failed" ]; then
              while IFS= read -r line; do
                echo "::warning title=Flaky test::${line}"
              done <<< "$failed"
            else
              echo "::warning title=Attempt 1 failed with no (fail) line::exit ${code} — a timeout, crash or hang rather than an assertion. See the attempt-1 output above."
            fi
            sleep 5
          done
        env:
          CI: "true"

      - name: UI unit coverage (WS5 Sub-project A)
        # Run BEFORE the Sonar scan so packages/ui/coverage/lcov.info is on
        # disk when Sonar reads sonar.javascript.lcov.reportPaths. Without
        # this ordering every file under packages/ui/src/ shows as 0%
        # covered in Sonar.
        working-directory: packages/ui
        run: bunx vitest run --coverage --coverage.thresholds.lines=80 --coverage.thresholds.branches=75
        env:
          CI: "true"

      - name: Rewrite UI LCOV SF paths to repo-root-relative
        # Vitest writes SF: paths relative to packages/ui/ (its own project
        # root). Sonar resolves SF paths from the repo root, so without this
        # rewrite every file under packages/ui/src/ fails to match and shows
        # 0% covered. Linux-only because the Sonar scan only runs on Linux.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f packages/ui/coverage/lcov.info ]; then
            sed -i 's|^SF:src/|SF:packages/ui/src/|' packages/ui/coverage/lcov.info
          fi

      - name: Coverage floor — per-file 85% line / 80% branch gate
        if: runner.os == 'Linux'
        # The PR gate is Ubuntu-only (matches the pre-existing pr-quality
        # pattern). The 3-OS push matrix still runs `bun test --coverage`
        # on all three OSes, but the floor gate only runs on Linux because
        # platform-specific files (vault/{win32,darwin,linux}.ts) are
        # exempt from the registry — running the gate on Windows/macOS
        # would not change its verdict.
        shell: bash
        run: bun run audit:coverage-floor

      - name: Coverage scopes — the per-area floors CLAUDE.md advertises
        if: runner.os == 'Linux'
        # The floors named in CLAUDE.md (Engine >=85%, Vault >=90%, Embedding
        # >=80%, ...) used to be spelled as `--coverage-threshold-lines=N` in 25
        # package.json scripts. That flag DOES NOT EXIST in Bun (`bun test
        # --help` lists only --coverage/--coverage-reporter/--coverage-dir) and
        # unknown flags are ignored silently; `bunfig.toml`'s `[test] coverage =
        # false` additionally suppresses collection entirely, so no lcov was
        # produced for a threshold to read even in principle. Every one of those
        # gates passed unconditionally.
        #
        # This step enforces the same floors for real, against the merged lcov
        # built a few steps above — so it adds no test run and no CI minutes.
        # It is Linux-only for the same reason the floor gate above is.
        shell: bash
        run: bun run audit:coverage-scopes

      - name: Coverage floor — exclusion parity (sonar <-> registry)
        if: runner.os == 'Linux'
        shell: bash
        run: bun run audit:exclusion-parity

      - name: Upload merged coverage/lcov.info as artifact
        # Published so contributors can download CI's lcov to reseed
        # docs/structure-audit/coverage-baseline.json on a CI-equivalent
        # input (the per-file gate is platform-sensitive: local Windows /
        # macOS lcov can differ from CI Linux lcov by tens of percent on
        # OS-specific files). See docs/contributors/coverage.md "Updating
        # the baseline".
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov-merged
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        # Supplementary reporting only — coverage threshold is enforced by the
        # `bun test --coverage-threshold-lines=…` invocation in the gate steps,
        # not by this upload. The codecov-action v6 OIDC pre-step
        # (actions/github-script) is intermittently flaky on Windows-2025
        # (silent fail with no diagnostic output); decoupling upload from
        # gate success keeps the gate semantics intact while tolerating that
        # flake.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # No `token:`. This is a reusable workflow, and GitHub only passes
          # secrets declared in its `secrets:` contract above — which lists
          # SONAR_TOKEN only. The old CODECOV_TOKEN reference therefore resolved
          # to an empty string here and never reached the action. Uploads
          # authenticate via OIDC (`id-token: write` is granted by the caller for
          # exactly this), so the input was inert. See Nimbus#782.
          # (Deliberately not writing the `secrets.` form above: audit:consumed-by
          # scans for it textually and would read this comment as a live use.)
          use_oidc: true
          files: coverage/lcov.info,packages/ui/coverage/lcov.info

      - name: Disable SonarCloud Automatic Analysis (idempotent)
        # SonarCloud rejects CI analysis when Automatic Analysis is also enabled
        # on the project ("You are running CI analysis while Automatic Analysis
        # is enabled"). We run CI analysis (this workflow) as the source of
        # truth, so autoscan must stay off. This step asks SonarCloud to
        # disable it on every run — the call is idempotent server-side, so the
        # second+ invocations are no-ops.
        #
        # Fail-open: a SONAR_TOKEN scoped only to "Execute Analysis" will get
        # HTTP 403 here. Rather than fail the build silently in a confusing
        # way, we log a warning and proceed; the scan step below will surface
        # the original "Automatic Analysis enabled" error with its clearer
        # remediation path (disable in the SonarCloud UI — see
        # docs/sonar-local.md).
        if: runner.os == 'Linux' && env.SONAR_TOKEN != ''
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e
          # Authorization passed via a Bearer header (SonarCloud-supported for
          # user tokens) rather than via curl basic-auth — the basic-auth form
          # matches the `curl-auth-user` gitleaks rule even when the credential
          # is a shell variable, generating a noisy false-positive on every push.
          # NB: SonarCloud's autoscan/activation endpoint takes `enable` (not
          # `enabled`); the latter returns HTTP 400 with
          # `{"msg":"The 'enable' parameter is missing"}`.
          response=$(curl -sS -o /tmp/autoscan-resp.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -X POST 'https://sonarcloud.io/api/autoscan/activation?projectKey=nimbus-agent_Nimbus&enable=false')
          body=$(cat /tmp/autoscan-resp.txt 2>/dev/null | head -c 500)
          case "$response" in
            200|204)
              echo "Autoscan disabled (HTTP $response)"
              ;;
            401)
              echo "::warning::SONAR_TOKEN rejected (HTTP 401). Verify the repo secret is current."
              ;;
            403)
              echo "::warning::SONAR_TOKEN lacks 'Administer Project' permission (HTTP 403). Disable Automatic Analysis manually in SonarCloud → Administration → Analysis Method."
              ;;
            *)
              echo "::warning::Unexpected response from autoscan/activation: HTTP $response. Body: $body"
              ;;
          esac

      - name: SonarQube Cloud analysis
        # SonarCloud rebranded to SonarQube Cloud; sonarcloud-github-action is
        # deprecated and delegates to sonarqube-scan-action. We invoke the new
        # action directly so its SHA pin is visible (the repo enforces
        # sha_pinning_required=true, which blocks transitively-unpinned actions).
        if: runner.os == 'Linux' && env.SONAR_TOKEN != ''
        # The scan UPLOAD is advisory: a scanner infra failure (network blip, the
        # autoscan-conflict exit 3) must not fail the build here. The actual gate
        # is enforced by the dedicated step below, which reads the resulting
        # analysis and fails only on a *definitive* gate verdict of ERROR.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube quality gate (enforced)
        # THIS is the gate that prevents a PR introducing a new bug / vulnerability
        # / unreviewed security hotspot / sub-80%-coverage new code from merging
        # (the "Sonar way" On-New-Code conditions). It reads the analysis the scan
        # step produced (.scannerwork/report-task.txt), waits for the Compute
        # Engine task, then queries the project_status API.
        #   - gate ERROR            -> fail the job (blocks the PR / push check)
        #   - gate OK               -> pass
        #   - no report / CE failed -> warn + pass (fail-OPEN on scanner infra so a
        #                              network blip is a rerun, not a hard block)
        # Kept as our own curl step (matching the autoscan step's style) rather
        # than a new pinned action, so the fail-open/fail-closed policy is explicit.
        if: runner.os == 'Linux' && env.SONAR_TOKEN != ''
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          report=".scannerwork/report-task.txt"
          if [[ ! -f "$report" ]]; then
            echo "::warning::No Sonar report-task.txt — the scan did not upload (infra failure or token absent). Skipping gate (fail-open)."
            exit 0
          fi
          ce_task_url=$(grep '^ceTaskUrl=' "$report" | cut -d= -f2-)
          if [[ -z "${ce_task_url:-}" ]]; then
            echo "::warning::report-task.txt has no ceTaskUrl. Skipping gate (fail-open)."
            exit 0
          fi
          auth=(-sS -H "Authorization: Bearer ${SONAR_TOKEN}")
          analysis_id=""
          for _ in $(seq 1 40); do
            task_json=$(curl "${auth[@]}" "$ce_task_url" || true)
            status=$(printf '%s' "$task_json" | jq -r '.task.status // empty')
            case "$status" in
              SUCCESS) analysis_id=$(printf '%s' "$task_json" | jq -r '.task.analysisId // empty'); break;;
              FAILED|CANCELED) echo "::warning::Sonar CE task $status. Skipping gate (fail-open)."; exit 0;;
              *) sleep 3;;
            esac
          done
          if [[ -z "$analysis_id" ]]; then
            echo "::warning::Sonar CE task did not finish in time. Skipping gate (fail-open)."
            exit 0
          fi
          gate_json=$(curl "${auth[@]}" "https://sonarcloud.io/api/qualitygates/project_status?analysisId=${analysis_id}" || true)
          gate=$(printf '%s' "$gate_json" | jq -r '.projectStatus.status // empty')
          echo "SonarQube quality gate: ${gate:-unknown}"
          if [[ "$gate" == "ERROR" ]]; then
            printf '%s' "$gate_json" | jq -r '.projectStatus.conditions[]? | select(.status=="ERROR") | "  FAILED: \(.metricKey) actual=\(.actualValue) \(.comparator) \(.errorThreshold)"'
            echo "::error::SonarQube quality gate FAILED — see the failing conditions above and the SonarCloud dashboard."
            exit 1
          fi
          if [[ "$gate" != "OK" ]]; then
            echo "::warning::Sonar gate status '${gate:-unknown}' is not a definitive verdict. Skipping gate (fail-open)."
            exit 0
          fi
          echo "::notice::SonarQube quality gate passed."

      - name: JUnit test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: Unit + Coverage (${{ inputs.runner }})
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  # ── Integration tests ──────────────────────────────────────────────────────
  integration:
    name: Integration — ${{ inputs.runner }}
    if: inputs.run-tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Linux — libsecret + D-Bus (vault / PAL tests)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-vault-deps.sh

      # Fix round 1 (Task 6, Finding A): this job runs packages/gateway/test/integration/, which
      # includes sandbox-wrapper-spawn.test.ts — a real end-to-end spawn through the
      # `__nimbus-sandbox` role. Without bwrap the suite is not READY and silently skipped rather
      # than exercising anything; only the separate `coverage-gates-pal` Sandbox gate installed
      # this before. A skip and a pass look identical in a CI summary, which is exactly how the
      # original Windows spawn defect survived a green three-OS matrix.
      - name: Linux — bubblewrap (sandbox spawn integration test)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-sandbox-deps.sh

      # Same Finding A, Windows side: without the compiled helper, sandbox-wrapper-spawn.test.ts
      # is not READY on Windows either.
      - name: Build sandbox helper (Windows, sandbox spawn integration test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun run build:sandbox-helper:win32

      - name: macOS — Strip quarantine from native SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: find node_modules -name "*.dylib" -print0 2>/dev/null | xargs -0 xattr -d com.apple.quarantine 2>/dev/null || true

      - name: macOS — Create and unlock CI Keychain (vault / PAL tests)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security create-keychain -p "" nimbus-ci.keychain
          security list-keychains -d user -s nimbus-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s nimbus-ci.keychain
          security unlock-keychain -p "" nimbus-ci.keychain
          security set-keychain-settings -lut 7200 nimbus-ci.keychain

      - name: Prepare test report directory
        shell: bash
        run: mkdir -p junit-reports

      - name: Integration tests
        run: bun test packages/gateway/test/integration/ packages/cli/test/integration/ --timeout 60000 --reporter=junit --reporter-outfile=junit-reports/junit-integration.xml
        env:
          CI: "true"

      - name: JUnit test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: Integration (${{ inputs.runner }})
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      # Ordering is load-bearing: this must run BEFORE the cleanup step below, which
      # deletes the only copy of the evidence. See the script header for what the
      # bundle can and cannot reach.
      - name: Collect failure artifacts (triage bundle)
        if: failure()
        shell: bash
        run: bash scripts/ci/collect-failure-artifacts.sh integration

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failure-integration-${{ inputs.runner }}
          path: failure-artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup integration test artifacts
        if: always()
        shell: bash
        run: |
          # `nimbus-*`, not `nimbus-test-*`. The glob was mismatched to its own job:
          # `nimbus-test-*` is produced by UNIT tests (registry-fetcher, engine-ask-stream,
          # the CLI test-runner suite), which run in `unit-coverage` — a job with no
          # cleanup step at all. The suites THIS job runs name their scratch dirs after
          # themselves — `nimbus-share-e2e-`, `nimbus-bindfirst-`, `nimbus-assemble-`,
          # `nimbus-dep-lifecycle-e2e-` — so none of them ever matched and their leftovers
          # stayed put. Measured on a dev machine: 42,400 surviving `nimbus-*` dirs, of
          # which 228 matched the old glob.
          rm -rf /tmp/nimbus-* 2>/dev/null || true
          rm -rf "${TEMP:-/tmp}/nimbus-"* 2>/dev/null || true

  # ── E2E Gateway tests ──────────────────────────────────────────────────────
  e2e-gateway:
    name: E2E Gateway — ${{ inputs.runner }}
    if: inputs.run-tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Linux — libsecret + D-Bus (vault / PAL tests)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-vault-deps.sh

      # This job collects `packages/gateway/test/e2e/exec-e2e.test.ts`, which drives a REAL
      # sandboxed execution through the I33 gate. Like sandbox-wrapper-spawn.test.ts, it goes RED
      # rather than skipping when its platform dependency is missing on CI — a skip and a pass are
      # indistinguishable in a CI summary — so the job that collects it needs the dependency, the
      # same reason install-vault-deps.sh is duplicated across every job that collects vault tests.
      - name: Linux — bubblewrap (sandboxed code-execution e2e, collected by this job)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-sandbox-deps.sh

      - name: Build sandbox helper (Windows, sandboxed code-execution e2e)
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun run build:sandbox-helper:win32

      - name: macOS — Strip quarantine from native SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: find node_modules -name "*.dylib" -print0 2>/dev/null | xargs -0 xattr -d com.apple.quarantine 2>/dev/null || true

      - name: macOS — Create and unlock CI Keychain (vault / PAL tests)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security create-keychain -p "" nimbus-ci.keychain
          security list-keychains -d user -s nimbus-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s nimbus-ci.keychain
          security unlock-keychain -p "" nimbus-ci.keychain
          security set-keychain-settings -lut 7200 nimbus-ci.keychain

      - name: Prepare test report directory
        shell: bash
        run: mkdir -p junit-reports

      - name: E2E Gateway tests
        # Linux: wrap in a D-Bus session + initialized keyring so the spawned gateway's libsecret
        # Vault works (installing the packages above is not enough without a live session bus —
        # mirrors the unit-coverage + Vault-gate steps). macOS/Windows use the unlocked keychain /
        # DPAPI and need no wrapper.
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            bash scripts/ci/run-with-optional-dbus.sh bun test packages/gateway/test/e2e/ --reporter=junit --reporter-outfile=junit-reports/junit-e2e-gateway.xml
          else
            bun test packages/gateway/test/e2e/ --reporter=junit --reporter-outfile=junit-reports/junit-e2e-gateway.xml
          fi
        env:
          CI: "true"

      - name: JUnit test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: E2E Gateway (${{ inputs.runner }})
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      # Highest-value job for this bundle: these are the tests that spawn a real
      # gateway subprocess, and a Linux-only hang here currently leaves nothing to
      # read. Must precede the cleanup step.
      - name: Collect failure artifacts (triage bundle)
        if: failure()
        shell: bash
        run: bash scripts/ci/collect-failure-artifacts.sh e2e-gateway

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failure-e2e-gateway-${{ inputs.runner }}
          path: failure-artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup E2E test artifacts
        if: always()
        shell: bash
        run: |
          # See the integration job above: `nimbus-test-*` belongs to the unit suites,
          # not to anything this job runs, so it never matched here.
          rm -rf /tmp/nimbus-* 2>/dev/null || true
          rm -rf "${TEMP:-/tmp}/nimbus-"* 2>/dev/null || true

  # ── E2E CLI tests ──────────────────────────────────────────────────────────
  e2e-cli:
    name: E2E CLI — ${{ inputs.runner }}
    if: inputs.run-tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Linux — libsecret + D-Bus (vault / PAL tests)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/linux/install-vault-deps.sh

      - name: macOS — Strip quarantine from native SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: find node_modules -name "*.dylib" -print0 2>/dev/null | xargs -0 xattr -d com.apple.quarantine 2>/dev/null || true

      - name: macOS — Create and unlock CI Keychain (vault / PAL tests)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security create-keychain -p "" nimbus-ci.keychain
          security list-keychains -d user -s nimbus-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s nimbus-ci.keychain
          security unlock-keychain -p "" nimbus-ci.keychain
          security set-keychain-settings -lut 7200 nimbus-ci.keychain

      - name: Prepare test report directory
        shell: bash
        run: mkdir -p junit-reports

      - name: E2E CLI tests
        run: bun test packages/cli/test/e2e/ --reporter=junit --reporter-outfile=junit-reports/junit-e2e-cli.xml
        env:
          CI: "true"

      - name: JUnit test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: E2E CLI (${{ inputs.runner }})
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Collect failure artifacts (triage bundle)
        if: failure()
        shell: bash
        run: bash scripts/ci/collect-failure-artifacts.sh e2e-cli

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failure-e2e-cli-${{ inputs.runner }}
          path: failure-artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup E2E test artifacts
        if: always()
        shell: bash
        run: |
          # See the integration job above: `nimbus-test-*` belongs to the unit suites,
          # not to anything this job runs, so it never matched here.
          rm -rf /tmp/nimbus-* 2>/dev/null || true
          rm -rf "${TEMP:-/tmp}/nimbus-"* 2>/dev/null || true

  # ── Headless bundle + Linux installers ─────────────────────────────────────
  # Runs only when explicitly enabled (currently: ubuntu-24.04 on both PR and
  # push). Builds compiled standalone binaries via `bun build --compile`
  # (distinct from the per-package `bun run build` validated by `static`).
  packaging:
    name: Packaging — ${{ inputs.runner }}
    if: inputs.run-packaging && inputs.run-tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Headless bundle + Linux installers
        shell: bash
        run: |
          set -e
          mkdir -p dist
          (cd packages/gateway && bun build src/index.ts --compile --outfile ../../dist/nimbus-gateway --target bun)
          (cd packages/cli && bun build src/index.ts --compile --outfile ../../dist/nimbus --target bun)
          bun scripts/connector-boot-smoke.ts dist/nimbus-gateway
          bun scripts/package-headless-bundle.ts --skip-embedding-model
          bun run package:installers:linux -- --version 0.0.0-ci --skip-appimage
          test -f dist/installers/nimbus-headless_0.0.0-ci_amd64.deb
          test -f dist/installers/nimbus-headless-linux-amd64-v0.0.0-ci.tar.gz

  # Run coverage gates in parallel to reduce critical path.
  # These re-run specific tests to enforce thresholds.
  #
  # SPLIT INTO TWO JOBS DELIBERATELY — do not merge them back together.
  #
  # Threshold gates run on Linux only, EXCEPT the gates whose covered code
  # branches on host platform (`pal: true`), which run on all three OSes. A push
  # run was ~105 jobs against a pool granting ~15 concurrent, and 72 of those
  # were one 24-entry coverage matrix expanded once per OS; the split cuts that
  # to 42 (9 PAL × 3 OS + 15 Linux-only × 1).
  #
  # The obvious single-job spelling was tried first and is WRONG:
  #
  #     if: inputs.run-tests && (inputs.runner == 'ubuntu-24.04' || matrix.gate.pal)
  #
  # `matrix` is NOT in the context set available to a job-level `if:` — GitHub
  # grants `jobs.<job_id>.if` only `github`, `needs`, `vars` and `inputs`,
  # because the job condition is evaluated BEFORE the matrix expands. That
  # spelling therefore evaluates falsy (or errors) on Windows and macOS and
  # silently skips ALL coverage gates there, including the very `pal: true`
  # gates whose preservation is the entire safety argument for running the rest
  # on Linux only. Every other `matrix.`-referencing `if:` in this repo is
  # step-level (8-space), where `matrix` IS available. Hence: one job per class,
  # each gated only on `inputs`, which a job-level `if:` does support.
  #
  # The `fromJSON(...)` single-job alternative is NOT acceptable either: it
  # drops the leg from the matrix entirely, and a leg that never expands never
  # creates its check context. A SKIPPED leg does create one. This repo depends
  # on that — see the trap documented on `pr-quality-ts` in
  # `.github/workflows/ci.yml`, where an un-created child context sat
  # "Expected — Waiting for status to be reported" forever and blocked merges.
  #
  # Both jobs MUST keep the identical `name:` template below. `name:` DOES
  # accept `matrix`, and the expanded check-context names
  # (`Coverage — Vault (ubuntu-24.04)` …) are what branch protection references;
  # changing them breaks the required contexts.
  #
  # Every entry keeps its `pal:` field even though no `if:` reads it any more.
  # It is the machine-readable classification `audit:coverage-gate-pal`
  # (`scripts/structure-audit/check-coverage-gate-pal.ts`) enforces: that gate
  # fails when a Linux-only gate's code gains platform branching, when an entry
  # sits in the wrong job, when a new entry carries no explicit `pal`, and when
  # either `if:` below drifts from the condition it is supposed to carry.
  #
  # `inputs.run-tests` is gated explicitly on both jobs (rather than relied upon
  # through the `needs: unit-coverage` skip chain) to match how every sibling job
  # in this file gates on it directly (`static`, `unit-coverage`, `integration`,
  # `e2e-gateway`, `e2e-cli`, `packaging`).

  # PAL gates (9) — covered code branches on host platform, so these run on
  # every OS the workflow is called with.
  coverage-gates-pal:
    name: Coverage — ${{ matrix.gate.name }} (${{ inputs.runner }})
    if: inputs.run-tests
    needs: unit-coverage
    runs-on: ${{ inputs.runner }}
    # These two coverage-gate jobs were the only jobs in this file with no
    # `timeout-minutes`, so they inherited GitHub's 360-minute default. On
    # 2026-08-19 the Sandbox leg wedged in its apt step on two concurrent runs
    # and would have burned six hours of runner time each; every sibling job
    # here caps at 30, and the whole leg runs in 1-4 minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: Vault
            script: "test:coverage:vault"
            pal: true
          - name: Embedding
            script: "test:coverage:embedding"
            pal: true
          - name: Extensions
            script: "test:coverage:extensions"
            pal: true
          - name: Telemetry
            script: "test:coverage:telemetry"
            pal: true
          - name: DB layer
            script: "test:coverage:db"
            pal: true
          - name: Doctor
            script: "test:coverage:doctor"
            pal: true
          - name: Updater
            script: "test:coverage:updater"
            pal: true
          - name: Perf
            script: "test:coverage:perf"
            pal: true
          - name: Sandbox
            script: "test:coverage:sandbox"
            pal: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Linux — libsecret + D-Bus (vault tests)
        if: runner.os == 'Linux' && matrix.gate.name == 'Vault'
        shell: bash
        run: sudo bash scripts/linux/install-vault-deps.sh

      - name: Linux — bubblewrap + libcap-dev + strace + cppcheck (sandbox tests)
        if: runner.os == 'Linux' && matrix.gate.name == 'Sandbox'
        shell: bash
        run: sudo bash scripts/linux/install-sandbox-deps.sh

      - name: Build sandbox helper (Linux only, sandbox gate)
        if: runner.os == 'Linux' && matrix.gate.name == 'Sandbox'
        shell: bash
        run: bun run build:sandbox-helper

      - name: Static-analyse sandbox helper with cppcheck (Linux only, sandbox gate)
        if: runner.os == 'Linux' && matrix.gate.name == 'Sandbox'
        shell: bash
        run: cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem packages/gateway/src-native/sandbox-helper/main.c

      - name: Setcap on sandbox helper (Linux only, sandbox gate)
        if: runner.os == 'Linux' && matrix.gate.name == 'Sandbox'
        shell: bash
        run: sudo setcap cap_net_admin+ep packages/gateway/src-native/sandbox-helper/nimbus-sandbox-helper

      - name: Build sandbox helper (Windows only, sandbox gate)
        if: runner.os == 'Windows' && matrix.gate.name == 'Sandbox'
        shell: pwsh
        run: bun run build:sandbox-helper:win32

      - name: Probe sandbox helper (Windows only, sandbox gate)
        if: runner.os == 'Windows' && matrix.gate.name == 'Sandbox'
        shell: pwsh
        run: |
          $h = "packages/gateway/src-native/sandbox-helper-win32/nimbus-sandbox-helper.exe"
          $out = & $h --check-caps
          if ($LASTEXITCODE -ne 0 -or $out.Trim() -ne "OK") { throw "check-caps failed: $out" }

      - name: Run coverage gate
        shell: bash
        run: |
          if [[ "${{ matrix.gate.name }}" == "Vault" && "${{ runner.os }}" == "Linux" ]]; then
            bash scripts/ci/run-with-optional-dbus.sh bun run ${{ matrix.gate.script }}
          else
            bun run ${{ matrix.gate.script }}
          fi
        env:
          CI: "true"

      - name: Upload coverage to Codecov
        # See note on the unit-test Codecov step: this upload is supplementary,
        # not the gate. `continue-on-error` tolerates intermittent OIDC pre-step
        # failures on Windows-2025 without masking real coverage-threshold
        # regressions, which are enforced earlier by the `Run coverage gate`
        # step's `bun run` exit code.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # No `token:` — same reason as the upload step above (Nimbus#782).
          use_oidc: true
          flags: ${{ matrix.gate.name }}

  # Linux-only gates (15) — no file in their coverage denominator branches on
  # host platform, which `audit:coverage-gate-pal` re-checks on every run. The
  # `ubuntu-24.04` literal below must match the runner label `ci.yml` actually
  # calls this workflow with; the same audit asserts that too, so bumping the
  # runner in one place cannot silently drop these 15 gates.
  coverage-gates-linux:
    name: Coverage — ${{ matrix.gate.name }} (${{ inputs.runner }})
    if: inputs.run-tests && inputs.runner == 'ubuntu-24.04'
    needs: unit-coverage
    runs-on: ${{ inputs.runner }}
    # 30, same as `coverage-gates-pal` and every sibling job in this file — see
    # the note there. Batching makes each leg serial, so the headroom over the
    # ~3-5 minutes three batches take is smaller here, but still 6x.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # BATCHED, not one-gate-per-job. These 15 gates each ran 0.6-1.3 min but
    # QUEUED 11-20 min behind a saturated concurrent-job cap, and ~0.5 min of
    # every leg was runner start + checkout + `bun install` — the matrix spent
    # far more wall time on setup and queueing than on the thresholds it
    # enforces. Three batches pay that setup 3x instead of 15x and hand 12 job
    # slots back to the account-wide pool that every other PR is waiting on.
    #
    # The trade is honest: this branch of the DAG gets SLOWER in isolation
    # (~1 min of parallel legs becomes ~3-5 min of serial ones). It wins because
    # queueing, not execution, is the dominant term — and it stops being the
    # right call if that ever ceases to be true.
    #
    # Every entry still carries an explicit `pal: false`: `audit:coverage-gate-pal`
    # rule 4 requires the field on every entry, and rule 5 requires every entry in
    # THIS job to be false. That audit parses only `- name:` and `pal:`, so the
    # `scripts:` (plural) key below is invisible to it.
    #
    # Batches group by subsystem so a red check names a coherent area, and the
    # run step below executes every script in a batch even after one fails —
    # preserving the failure locality the 15-way `fail-fast: false` matrix gave.
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: Engine & agents
            flag: engine-agents
            scripts: "test:coverage:engine test:coverage:agents test:coverage:workflow test:coverage:mcp test:coverage:preflight"
            pal: false
          - name: Runtime services
            flag: runtime-services
            scripts: "test:coverage:sync test:coverage:rate-limiter test:coverage:watcher test:coverage:health test:coverage:metrics"
            pal: false
          - name: Interfaces & data
            flag: interfaces-data
            scripts: "test:coverage:people test:coverage:config test:coverage:tui test:coverage:deployment test:coverage:lan"
            pal: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      # The Vault and Sandbox prep steps that used to sit here were dead: this
      # job's matrix has never contained a `Vault` or `Sandbox` entry (both are
      # `pal: true` and live in `coverage-gates-pal`), so every one of their
      # `matrix.gate.name == '…'` conditions was permanently false. The live
      # copies remain in `coverage-gates-pal`, which is where those gates run.

      - name: Run coverage gates
        shell: bash
        run: |
          # Run every gate in the batch even after one fails, so a red check
          # reports ALL failing gates rather than only the first — the failure
          # locality the old 15-way `fail-fast: false` matrix gave, preserved.
          failed=()
          for script in ${{ matrix.gate.scripts }}; do
            echo "::group::${script}"
            if bun run "${script}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::coverage gate failed: ${script}"
              failed+=("${script}")
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "Failing coverage gates in this batch: ${failed[*]}"
            exit 1
          fi
        env:
          CI: "true"

      - name: Upload coverage to Codecov
        # See note on the unit-test Codecov step: this upload is supplementary,
        # not the gate. `continue-on-error` tolerates intermittent OIDC pre-step
        # failures on Windows-2025 without masking real coverage-threshold
        # regressions, which are enforced earlier by the `Run coverage gate`
        # step's `bun run` exit code.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # No `token:` — same reason as the upload step above (Nimbus#782).
          use_oidc: true
          flags: ${{ matrix.gate.flag }}
