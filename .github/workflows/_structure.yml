name: Structure audit

# Reusable workflow — fast PR check (≤30 s budget) for the binary subset of
# audit:* gates: D1/D2/D3 (boundaries), D8 (any-count ratchet), D10/D11
# (Nimbus invariants), the coverage-gate PAL classification
# (`audit:coverage-gate-pal`), release-please manifest drift, and root
# `overrides` drift (`audit:override-drift`).
#
# Ubuntu-only by design: every gate is static analysis with zero OS variance.
# The platform-equality non-negotiable is a runtime property
# (B3 structure audit design § 6.1).
#
# Wired into ci.yml as `pr-quality-structure` (PR side) and `ci-structure`
# (push side). Failures block PRs — the D8 any-count ratchet and the D10/D11
# nimbus-invariant checks are the static-time complement to runtime
# enforcement in `security-invariants.test.ts`.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  structure:
    name: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: D1/D2/D3 — boundaries (dependency-cruiser)
        run: bun run audit:boundaries

      - name: D8 — any-count (manual ratchet)
        run: bun scripts/structure-audit/count-any-usage.ts --check

      - name: D10/D11 — Nimbus invariants (binary)
        run: bun run audit:invariants

      - name: Audit coverage-gate PAL classification
        run: bun run audit:coverage-gate-pal

      - name: Audit release-please manifest drift
        run: bun run audit:release-please

      # A root `overrides` pin outranks every declared range, so a divergence is
      # invisible in CI without this: the Dependabot PR that bumps the declared
      # range merges green and changes nothing installed. Local `preflight:fast`
      # alone would leave the gate unenforced on the merge path.
      - name: Audit root overrides drift
        run: bun run audit:override-drift
