name: Security

on:
  # Trivy uploads its SARIF per-ref, so main's Code Scanning alerts only refresh
  # when this workflow runs *on main*. Without a push trigger a merged fix left
  # the alerts open until the next nightly — three HIGH advisories stayed listed
  # for a day after the upgrade that cleared them — and a vulnerability reaching
  # main was invisible for just as long. Merges are low-volume; re-scan on each.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  # Per-commit on push (never evict a queued scan), per-ref on PR.
  group: security-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # `bun audit` exits non-zero for two unrelated reasons: a HIGH/CRITICAL
      # advisory (which MUST block) and an unreachable audit service (which says
      # nothing about our dependencies). Conflating them let a registry 503 block
      # the 1.12.0 release — see #966.
      #
      # So the two cases are separated rather than blanket-retried:
      #   * a transport failure is retried up to 3 times with backoff;
      #   * anything else fails IMMEDIATELY on attempt 1, with no retry and no
      #     delay, because a real advisory fails identically on every attempt and
      #     re-running it only slows down the feedback.
      # If all 3 attempts hit transport failures the step still FAILS. That is
      # deliberate: `continue-on-error` here would also swallow genuine
      # HIGH/CRITICAL findings, which is the one thing this gate exists to catch.
      - name: bun audit (retry transport failures only)
        run: |
          set +e
          for attempt in 1 2 3; do
            out="$(bun audit --audit-level high 2>&1)"
            code=$?
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            # Bun reports an unreachable/erroring registry endpoint in TWO shapes, and matching
            # only the first is what made this guard fail for the wrong reason on 2026-09-04:
            #
            #   error: audit request failed (status 503)      <- an HTTP status came back
            #   ConnectionClosed: audit request failed        <- the socket died, NO status
            #
            # The old pattern required `(status NNN)`, so the status-less form was classified as
            # a FINDING and failed without retrying — turning a transport blip into a red required
            # check on `main`, with a message asserting an advisory that did not exist. Anchor on
            # `audit request failed` alone, which is the part common to both and which `bun audit`
            # never prints for an actual advisory: a real finding is reported as a vulnerability
            # table, not as a failed request.
            if ! printf '%s' "$out" | grep -qE 'audit request failed'; then
              echo "bun audit reported a finding (exit $code) — not a transport error, failing without retry."
              exit "$code"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "bun audit was unreachable on all 3 attempts (exit $code) — failing closed."
              exit "$code"
            fi
            delay=$((attempt * 10))
            echo "Audit service unreachable (attempt $attempt, exit $code), retrying in ${delay}s..."
            sleep "$delay"
          done

      # `bun audit --audit-level high` only blocks HIGH/CRITICAL. Everything
      # below that used to persist silently — two advisories sat in the output
      # with nothing failing and no record that anyone had judged them. This
      # step holds every live advisory to a written, dated decision in
      # scripts/structure-audit/accepted-advisories.ts, and fails when a
      # decision expires, goes stale, or was never made.
      - name: Accepted-advisory registry
        run: bun run audit:advisories

      # Folded in from the former standalone `js-licenses` job, which paid a
      # whole runner (harden + checkout + `bun install`, ~30s) to run this one
      # command against the same tree this job already has checked out.
      #
      # Consequence worth knowing: a license-allowlist violation now fails the
      # REQUIRED "Dependency audit" check rather than the advisory "JS license
      # compliance" one, so it blocks merge where it previously did not. That is
      # the correct direction — docs/license-policy.md describes it as policy,
      # not advice — but it is a behaviour change, not a pure refactor.
      #
      # JS-side mirror of cargo-deny's license check on the Tauri Rust tree. The
      # allowlist is the intersection of licenses safe to redistribute under both
      # halves of our dual-license model: AGPL-3.0 (gateway/cli/connectors,
      # shipped as compiled binaries) and MIT (sdk/client, published as-is to
      # npm). See docs/license-policy.md for the full policy and the procedure
      # for adding to the allowlist or PACKAGE_OVERRIDES.
      - name: License compliance (workspace-wide)
        run: bun run audit:js-licenses

  trivy-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy's Bun detector expects node_modules (see INFO in scan logs); matches the audit job and improves
      # lockfile / dependency graph accuracy. node_modules remains excluded from traversal via skip-dirs.
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # Install Trivy by direct release-asset URL + the official checksums.txt
      # file. Avoids api.github.com/.../releases/tags/<tag> entirely — that
      # endpoint has been intermittently returning HTTP 403 to authenticated
      # GITHUB_TOKEN requests for cross-org public repos, which broke this
      # job on every nightly schedule run. The pattern mirrors the gitleaks
      # install step below: pinned tag, sha256 verified, no API call.
      - name: Install Trivy
        shell: bash
        env:
          TRIVY_TAG: v0.69.3
        run: |
          set -euo pipefail
          DEST="${HOME}/.local/bin/trivy-bin"
          mkdir -p "${DEST}"
          ver="${TRIVY_TAG#v}"
          asset_name="trivy_${ver}_Linux-64bit.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_TAG}"
          tmpdir="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors \
            -o "${tmpdir}/${asset_name}" "${base_url}/${asset_name}"
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors \
            -o "${tmpdir}/checksums.txt" "${base_url}/trivy_${ver}_checksums.txt"
          (cd "${tmpdir}" && grep -E "  ${asset_name}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${tmpdir}/${asset_name}" -C "${tmpdir}"
          install -m 0755 "${tmpdir}/trivy" "${DEST}/trivy"
          rm -rf "${tmpdir}"
          echo "${DEST}" >> "${GITHUB_PATH}"

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          skip-dirs: "node_modules"
          # Keep SARIF + exit-code aligned with severity filter (avoids failing on lower severities in SARIF build).
          limit-severities-for-sarif: true
          # Keep disabled: trivy-action uses its own cache wiring; avoids duplicate cache restore/save noise.
          cache: false

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  gateway-security-contracts:
    name: Gateway audit JSON + connector.remove vault restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: Audit payload safety + OAuth restore integration
        run: |
          bun test packages/gateway/src/engine/audit-payload-safety.test.ts \
            packages/gateway/test/integration/connector-remove-oauth-restore.integration.test.ts
        env:
          CI: "true"

  cargo-audit:
    # Skipped on PRs that touch no Rust. This name is a literal with no `${{ }}`
    # in it, so a skipped job still posts this exact required context with
    # conclusion `skipped`, which GitHub counts as passing — the trap that once
    # blocked docs-only PRs fires only on names carrying an unexpanded expression.
    #
    # `!cancelled()` rather than `success()` on the needs: a red gitleaks (it
    # scans FULL history, so it can go red on a commit outside this diff) must not
    # silently turn this required scan into a passing `skipped`.
    needs: gitleaks
    if: ${{ !cancelled() && needs.gitleaks.outputs.rust != 'false' }}
    name: Cargo audit (Tauri)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-toolchain

      - name: Cache cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.1

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Run cargo audit (packages/ui/src-tauri)
        working-directory: packages/ui/src-tauri
        # quick-xml 0.39.4 DoS advisories (transitive via plist/wayland-scanner,
        # not reachable without an upstream Tauri bump; Tauri desktop deferred to
        # Phase 13, no runtime exposure). Mirrors the deny.toml ignore list —
        # revisit at the next Tauri bump. See deny.toml for full rationale.
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  cargo-deny:
    # Skipped on PRs that touch no Rust. This name is a literal with no `${{ }}`
    # in it, so a skipped job still posts this exact required context with
    # conclusion `skipped`, which GitHub counts as passing — the trap that once
    # blocked docs-only PRs fires only on names carrying an unexpanded expression.
    #
    # `!cancelled()` rather than `success()` on the needs: a red gitleaks (it
    # scans FULL history, so it can go red on a commit outside this diff) must not
    # silently turn this required scan into a passing `skipped`.
    needs: gitleaks
    if: ${{ !cancelled() && needs.gitleaks.outputs.rust != 'false' }}
    name: Cargo deny (licenses + advisories + bans)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately no "Setup Rust" step here. cargo-deny-action is a *Docker*
      # action (rust:1.85.0-alpine3.20) that brings its own cargo and resolves
      # rust-toolchain.toml inside the container, so a host toolchain is never
      # consulted. The host install was pure cost — and in run 30232465108 it was
      # the step that failed (a static.rust-lang.org TLS reset), taking the job
      # down before cargo-deny ever ran. Do not re-add it.
      - name: Run cargo deny
        # Pinned to v2.0.17 (cargo-deny 0.19.2). The previous pin at
        # e2f4ede (v2.0.4) bundled a cargo-deny version that couldn't
        # parse CVSS 4.0 vectors, causing advisory-db sync to fail on
        # e.g. RUSTSEC-2025-0138.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: packages/ui/src-tauri/Cargo.toml
          # `all` = check advisories, bans, licenses, sources.
          command: check all
          command-arguments: --hide-inclusion-graph

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # PR comments + status check from gitleaks.
      pull-requests: write
    # Hosts the Rust change detection for cargo-audit / cargo-deny. It lives
    # here rather than in a new job because a dedicated `changes` job would
    # itself cost a runner slot, cancelling half the saving — and this job
    # already checks out full history, which is what the diff needs.
    outputs:
      rust: ${{ steps.rust-changed.outputs.rust }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can diff against base.
          fetch-depth: 0
          persist-credentials: false

      # Does this PR touch the Rust surface at all? cargo-audit and cargo-deny
      # scan `packages/ui/src-tauri` (where Cargo.lock and deny.toml live); on
      # the overwhelming majority of PRs, which touch no Rust, they spend two
      # runner slots re-proving an unchanged lockfile.
      #
      # Deliberately `!= 'false'` downstream, never `== 'true'`: if this step
      # fails, the base SHA cannot be resolved, or the event is not a PR, the
      # output is empty and BOTH scans run. The gate fails OPEN for the security
      # check — the only thing it fails closed on is skipping work.
      - name: Detect Rust changes
        id: rust-changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -uo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "${base}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base sha unavailable — running the Rust scans"
            echo "rust=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${base}" HEAD \
            | grep -qE '^(packages/ui/src-tauri/|rust-toolchain\.toml$|\.github/workflows/security\.yml$)'; then
            echo "rust=true" >> "${GITHUB_OUTPUT}"
          else
            echo "rust=false" >> "${GITHUB_OUTPUT}"
          fi

      # Direct binary invocation rather than `gitleaks/gitleaks-action`
      # because that JS action still ships `runs.using: node20`, which
      # GitHub-hosted runners are warning about. The CLI download below
      # is SHA-256 pinned to keep supply-chain hygiene equivalent.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          archive="${tmpdir}/gitleaks.tar.gz"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${tmpdir}" gitleaks
          install -m 0755 "${tmpdir}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --verbose --exit-code 1
