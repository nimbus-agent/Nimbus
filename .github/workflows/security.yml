name: Security

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: bun audit
        run: bun audit --audit-level high

  trivy-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Trivy's Bun detector expects node_modules (see INFO in scan logs); matches the audit job and improves
      # lockfile / dependency graph accuracy. node_modules remains excluded from traversal via skip-dirs.
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # Install Trivy by direct release-asset URL + the official checksums.txt
      # file. Avoids api.github.com/.../releases/tags/<tag> entirely — that
      # endpoint has been intermittently returning HTTP 403 to authenticated
      # GITHUB_TOKEN requests for cross-org public repos, which broke this
      # job on every nightly schedule run. The pattern mirrors the gitleaks
      # install step below: pinned tag, sha256 verified, no API call.
      - name: Install Trivy
        shell: bash
        env:
          TRIVY_TAG: v0.69.3
        run: |
          set -euo pipefail
          DEST="${HOME}/.local/bin/trivy-bin"
          mkdir -p "${DEST}"
          ver="${TRIVY_TAG#v}"
          asset_name="trivy_${ver}_Linux-64bit.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_TAG}"
          tmpdir="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors \
            -o "${tmpdir}/${asset_name}" "${base_url}/${asset_name}"
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors \
            -o "${tmpdir}/checksums.txt" "${base_url}/trivy_${ver}_checksums.txt"
          (cd "${tmpdir}" && grep -E "  ${asset_name}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${tmpdir}/${asset_name}" -C "${tmpdir}"
          install -m 0755 "${tmpdir}/trivy" "${DEST}/trivy"
          rm -rf "${tmpdir}"
          echo "${DEST}" >> "${GITHUB_PATH}"

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          skip-dirs: "node_modules"
          # Keep SARIF + exit-code aligned with severity filter (avoids failing on lower severities in SARIF build).
          limit-severities-for-sarif: true
          # Keep disabled: trivy-action uses its own cache wiring; avoids duplicate cache restore/save noise.
          cache: false

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  gateway-security-contracts:
    name: Gateway audit JSON + connector.remove vault restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: Audit payload safety + OAuth restore integration
        run: |
          bun test packages/gateway/src/engine/audit-payload-safety.test.ts \
            packages/gateway/test/integration/connector-remove-oauth-restore.integration.test.ts
        env:
          CI: "true"

  cargo-audit:
    name: Cargo audit (Tauri)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (SHA-pinned; version driven by input below)
        with:
          toolchain: "1.95.0"

      - name: Cache cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.1

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Run cargo audit (packages/ui/src-tauri)
        working-directory: packages/ui/src-tauri
        run: cargo audit

  cargo-deny:
    name: Cargo deny (licenses + advisories + bans)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (SHA-pinned; version driven by input below)
        with:
          toolchain: "1.95.0"

      - name: Run cargo deny
        # Pinned to v2.0.17 (cargo-deny 0.19.2). The previous pin at
        # e2f4ede (v2.0.4) bundled a cargo-deny version that couldn't
        # parse CVSS 4.0 vectors, causing advisory-db sync to fail on
        # e.g. RUSTSEC-2025-0138.
        uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
        with:
          manifest-path: packages/ui/src-tauri/Cargo.toml
          # `all` = check advisories, bans, licenses, sources.
          command: check all
          command-arguments: --hide-inclusion-graph

  js-licenses:
    name: JS license compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: License compliance (workspace-wide)
        # JS-side mirror of cargo-deny's license check on the Tauri Rust
        # tree. The allowlist is the intersection of licenses safe to
        # redistribute under both halves of our dual-license model:
        # AGPL-3.0 (gateway/cli/connectors, shipped as compiled binaries)
        # and MIT (sdk/client, published as-is to npm). See
        # docs/license-policy.md for the full policy and the procedure
        # for adding to the allowlist or PACKAGE_OVERRIDES.
        run: bun run audit:js-licenses

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # PR comments + status check from gitleaks.
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so gitleaks can diff against base.
          fetch-depth: 0
          persist-credentials: false

      # Direct binary invocation rather than `gitleaks/gitleaks-action`
      # because that JS action still ships `runs.using: node20`, which
      # GitHub-hosted runners are warning about. The CLI download below
      # is SHA-256 pinned to keep supply-chain hygiene equivalent.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          archive="${tmpdir}/gitleaks.tar.gz"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${tmpdir}" gitleaks
          install -m 0755 "${tmpdir}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --verbose --exit-code 1
