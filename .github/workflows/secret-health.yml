name: Secret health

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "Cert expiry warning threshold (days)"
        required: false
        default: "21"
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check release credential health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"
      - name: Mint release-bot token (health probe)
        id: app-mint
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus,homebrew-tap,scoop-bucket,linux-repo
          permission-contents: write
          permission-pull-requests: write
      - name: Run secret-health check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THRESHOLD_DAYS: ${{ github.event.inputs.threshold_days || '21' }}
          APP_MINT_STATUS: ${{ steps.app-mint.outcome }}
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          NIMBUS_CHECKS_TOKEN: ${{ secrets.NIMBUS_CHECKS_TOKEN }}
          SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
          GPG_SIGNING_SUBKEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: bun scripts/release/check-secret-health.ts
