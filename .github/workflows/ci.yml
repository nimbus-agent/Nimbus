name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # PRs share a per-ref group, so a superseded run is cancelled (cheap — the
  # branch head moved). Pushes get a per-COMMIT group so they never share a
  # group at all.
  #
  # `cancel-in-progress: false` alone is NOT enough for pushes: it only keeps
  # the *in-progress* run alive. GitHub still allows one pending run per group
  # and "any previously pending workflow in the concurrency group is
  # cancelled" when a newer one arrives. Consecutive merges therefore evicted
  # each other while queued and lost their validation entirely — 33 of 60 push
  # runs cancelled with ZERO jobs, so the commits that actually shipped were
  # never tested. A per-SHA group means every merge commit validates on its own.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Filter: detect changes to optimize PR feedback ──────────────────────────
  filter:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      rust: ${{ steps.changes.outputs.rust }}
      # code-changed=false when every changed file matches docs/, *.md,
      # LICENSE*, CHANGELOG*, or .github/*.md. Gates the heavy TS/Bun and
      # cross-platform PR jobs so docs-only PRs still get a structure audit
      # (which checks doc-ref drift — the relevant gate for docs PRs) without
      # paying for a full 3-runner test cycle.
      code-changed: ${{ steps.changes.outputs.code-changed }}
      # gateway-touched / cli-touched gate the per-package cross-platform
      # matrix entries (see pr-quality-cross-platform). True when any path
      # *could* affect that package's tests — including shared deps (sdk,
      # client, mcp-connectors), root config (bun.lock, package.json,
      # tsconfig, biome), and scripts/. CLI imports from sdk/client/
      # mcp-connectors, so any change there triggers both. The result is
      # that a pure cli-src PR skips the Windows-gateway cross-platform
      # leg (the slowest in the matrix) and vice versa.
      gateway-touched: ${{ steps.changes.outputs.gateway-touched }}
      cli-touched: ${{ steps.changes.outputs.cli-touched }}
      # JSON-encoded matrix `include:` list for pr-quality-cross-platform.
      # Built from gateway-touched / cli-touched so each matrix entry is
      # only emitted when its package was touched. Empty list ("[]") on a
      # PR that affects neither package — the job is skipped wholesale.
      cross-platform-matrix: ${{ steps.changes.outputs.cross-platform-matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to HEAD~1 for new branches where before-SHA is all-zeros.
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || echo "")
          echo "ui=$(echo "$CHANGED" | grep -qE '^packages/ui/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust=$(echo "$CHANGED" | grep -qE '^packages/ui/src-tauri/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # gateway-touched / cli-touched use "exclude" logic — true unless
          # every changed file is exclusively under a path that can't affect
          # that package's tests. This is more robust than enumerating the
          # positive set: workflow changes, root config, scripts, and shared
          # deps (mcp-connectors) all correctly trigger both. (@nimbus-dev/sdk
          # and @nimbus-dev/client are consumed from npm, not in-monorepo dirs.)
          GATEWAY_EXCLUDE='^(packages/(cli|ui|docs)/|docs/|LICENSE([-_].*)?$|CHANGELOG([-_].*)?$|.*\.md$|.*\.MD$)'
          CLI_EXCLUDE='^(packages/(gateway|ui|docs)/|docs/|LICENSE([-_].*)?$|CHANGELOG([-_].*)?$|.*\.md$|.*\.MD$)'
          if [[ -z "$CHANGED" ]]; then
            GW=true
            CLI=true
          else
            echo "$CHANGED" | grep -qvE "$GATEWAY_EXCLUDE" && GW=true || GW=false
            echo "$CHANGED" | grep -qvE "$CLI_EXCLUDE" && CLI=true || CLI=false
          fi
          echo "gateway-touched=$GW" >> "$GITHUB_OUTPUT"
          echo "cli-touched=$CLI" >> "$GITHUB_OUTPUT"

          # Cross-platform matrix: emit only the packages this PR can affect.
          #
          # This used to always emit all 4 entries, on the stated grounds that
          # branch-protection rulesets require the expanded check names. That is
          # no longer true — the General ruleset (14784377) requires exactly:
          # "PR quality — required gates", the six Security contexts, the two
          # CodeQL "Analyze (…)" contexts and "cla". No expanded Cross-platform
          # name appears in any ruleset, so narrowing the matrix removes no
          # required context. `pr-quality-required` still `needs:` this job, so
          # the gate keeps its dependency either way.
          #
          # gateway-touched / cli-touched are exclude-logic (true unless every
          # changed file is provably irrelevant to that package) and both fall
          # back to true on an empty diff, so the failure mode is running MORE
          # than needed, never less. A PR touching only packages/cli/ drops the
          # two gateway legs — macOS especially, where the account-wide cap is
          # just 5 concurrent jobs.
          ENTRIES=()
          if [[ "$GW" == "true" ]]; then
            ENTRIES+=('{"os":"macos-15","pkg":"gateway"}' '{"os":"windows-2025","pkg":"gateway"}')
          fi
          if [[ "$CLI" == "true" ]]; then
            ENTRIES+=('{"os":"macos-15","pkg":"cli"}' '{"os":"windows-2025","pkg":"cli"}')
          fi
          # An empty matrix makes GitHub fail the job rather than skip it, which
          # would red every docs-only PR through `pr-quality-required`. Neither
          # flag can be false on an empty diff, but belt-and-braces: fall back to
          # the cli pair, the cheaper of the two.
          if [[ ${#ENTRIES[@]} -eq 0 ]]; then
            ENTRIES+=('{"os":"macos-15","pkg":"cli"}' '{"os":"windows-2025","pkg":"cli"}')
          fi
          MATRIX="[$(IFS=,; echo "${ENTRIES[*]}")]"
          echo "cross-platform-matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          # Fail-safe: an empty diff (e.g. base resolution glitch) is treated as
          # "code might have changed" so we never skip the test suite on an
          # unknown change set.
          if [[ -z "$CHANGED" ]]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            # Non-doc-only changes: anything outside docs/, *.md, LICENSE,
            # CHANGELOG. `.github/workflows/*.yml` is intentionally NOT
            # whitelisted — workflow changes must run the full test suite
            # to verify CI itself didn't regress.
            NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|LICENSE([-_].*)?$|CHANGELOG([-_].*)?$|.*\.md$|.*\.MD$)' || true)
            if [[ -z "$NON_DOC" ]]; then
              echo "code-changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "code-changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ── PR: fast feedback (three jobs run in parallel) ─────────────────────────

  # TS/Bun test suite — ubuntu only, runs in parallel with pr-quality-rust
  pr-quality-ts:
    name: PR quality — TS/Bun (ubuntu-24.04)
    # Always run on PRs so the required reusable-workflow child checks
    # (`… / Static`, `… / Unit + Coverage`, … `/ Packaging`) always REPORT a
    # status. On docs-only PRs we pass run-tests=false, which skips every child
    # job — a skipped required check counts as passing. Gating the *caller* on
    # `code-changed` instead (the old behavior) meant the reusable workflow
    # never ran, so the 6 child contexts were never created and sat
    # "Expected — Waiting for status to be reported" forever, blocking the merge.
    # Test execution on code PRs is unchanged (code-changed=true → run-tests=true).
    if: github.event_name == 'pull_request'
    needs: filter
    uses: ./.github/workflows/_test-suite.yml
    with:
      runner: ubuntu-24.04
      run-packaging: true
      run-tests: ${{ needs.filter.outputs.code-changed == 'true' }}
    secrets:
      # Optional; the reusable workflow silently skips the SonarQube step
      # when this is unset (e.g. on fork PRs).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      checks: write
      # Required by _test-suite.yml (Codecov use_oidc: true on coverage-gates).
      id-token: write

  # Rust/Tauri checks — ubuntu only, runs in parallel with pr-quality-ts
  pr-quality-rust:
    name: PR quality — Rust/Tauri (ubuntu-24.04)
    if: github.event_name == 'pull_request' && needs.filter.outputs.rust == 'true'
    needs: filter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust + Tauri checks
        uses: ./.github/actions/setup-rust-tauri

  # Cross-platform smoke — non-Linux gateway/cli unit tests at PR time.
  # The full 3-OS matrix runs on push to main, but that catches platform
  # divergence only AFTER merge. This narrow PR-time job runs the gateway
  # and CLI unit tests on macOS + Windows so cross-platform regressions
  # (BUG-009 cross-OS path-shape mismatch was the motivating example)
  # surface before the merge button is pressed. Scope is intentionally narrow:
  # no integration, no e2e, no coverage upload — just `bun test` on source.
  #
  # Gateway and CLI run as SEPARATE matrix entries so they execute in parallel,
  # not back-to-back in one runner. This halves the critical-path wall time on
  # Windows (the slowest leg of the PR matrix). The per-package isolation also
  # remains a hard requirement: the CLI suite's mock harness
  # (`packages/cli/test/helpers/cli-mocks.ts`) installs process-global
  # `mock.module` registrations and assumes per-package process isolation —
  # running gateway + CLI tests in one process let a gateway test's global
  # `mock.restore()` corrupt CLI repl tests on macOS. Separate matrix entries
  # restore that isolation by construction.
  pr-quality-cross-platform:
    name: PR quality — Cross-platform (${{ matrix.pkg }}, ${{ matrix.os }})
    # The filter emits only the packages this PR can affect (see
    # ci.yml#Detect-changed-paths). No expanded Cross-platform check name is a
    # required context in any ruleset — verified against the live General
    # ruleset — so a narrowed matrix leaves nothing "Expected — Waiting for
    # status to be reported". `pr-quality-required` needs: this job, which is
    # what actually gates.
    #
    # The job still RUNS on every PR: the expensive steps below are individually
    # gated on `code-changed`, so a docs-only PR spins up the remaining legs and
    # reports success without doing test work.
    if: github.event_name == 'pull_request'
    needs: filter
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.filter.outputs.cross-platform-matrix) }}
    runs-on: ${{ matrix.os }}
    # Backstop only — each test attempt has its own 15-min wall-clock cap (see the
    # unit-tests step), so a hang fails fast via retry rather than burning this
    # ceiling. Sized for setup + retried typecheck + 2 capped test attempts:
    # 2 × 15 min of tests alone is 30 min, so this MUST stay above that or a
    # double-timeout is cancelled at the job ceiling ("The operation was canceled")
    # instead of surfacing the wrapper's exit 124 — the very failure mode the
    # per-attempt cap exists to prevent. Raise both together or neither.
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        if: needs.filter.outputs.code-changed == 'true'
        uses: ./.github/actions/setup-nimbus-ci

      - name: macOS — Strip quarantine from native SQLite extensions
        if: runner.os == 'macOS' && needs.filter.outputs.code-changed == 'true'
        shell: bash
        run: find node_modules -name "*.dylib" -print0 2>/dev/null | xargs -0 xattr -d com.apple.quarantine 2>/dev/null || true

      - name: macOS — Create and unlock CI Keychain
        if: runner.os == 'macOS' && needs.filter.outputs.code-changed == 'true'
        shell: bash
        run: |
          security create-keychain -p "" nimbus-ci.keychain
          security list-keychains -d user -s nimbus-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s nimbus-ci.keychain
          security unlock-keychain -p "" nimbus-ci.keychain
          security set-keychain-settings -lut 7200 nimbus-ci.keychain

      # Typecheck runs on the gateway matrix entry only. Typecheck is
      # monorepo-wide and identical between entries, so doing it twice per OS
      # would be pure runner-minute waste with no signal gain — host-specific TS
      # quirks still surface on the gateway entry. cli consumes the published
      # @nimbus-dev/client from npm, so no local client build is needed.
      - name: Typecheck (catches host-specific TS quirks)
        if: matrix.pkg == 'gateway' && needs.filter.outputs.code-changed == 'true'
        shell: bash
        # @nimbus/docs is excluded here: it has no host-specific TS surface and
        # its astro-sync content-type generation flakes a 60s Vite timeout on slow
        # macOS runners. Full workspace typecheck (incl. docs) still runs once on
        # Ubuntu in _test-suite.yml. Retry-once mirrors the unit-tests step below.
        run: |
          set +e
          for attempt in 1 2; do
            bun run typecheck:no-docs
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then echo "Both attempts failed (exit $code)"; exit "$code"; fi
            echo "Attempt $attempt failed (exit $code), retrying in 5 s..."
            sleep 5
          done

      - name: ${{ matrix.pkg }} unit tests (retry once on slow runners)
        if: needs.filter.outputs.code-changed == 'true'
        shell: bash
        # `--timeout 60000` matches every other Bun test invocation in the repo
        # (`_test-suite.yml` runs these SAME gateway/cli suites at 60 s on the
        # push 3-OS matrix + the Ubuntu PR gate, and passes). This step was the
        # ONLY invocation left on Bun's per-test default: the root `bunfig.toml`
        # sets `[test] timeout = 30000`, but Bun does NOT honor it for
        # `bun test <path>` runs, so the effective default here was 5000 ms.
        #
        # The flake is systemic runner slowness, not two specific tests: on a
        # loaded Windows runner the full combined suite (~3,800 tests / ~420
        # files) starves random I/O-heavy tests — sqlite-vec dlopen, multi-step
        # schema migrations, on-disk fixtures, latency sampling — past 5 s, and
        # a DIFFERENT test trips each run. Per-test `}, 30000)` overrides were
        # whack-a-mole (e.g. only the first of ~11 heavy embedding tests had
        # one); the job-level timeout is the durable fix. These tests run in
        # <300 ms on Linux/macOS — confirmed not logic bugs.
        #
        # Retry-once still tolerates a cold-start outlier and, unlike the
        # `_test-suite.yml` retry, PROPAGATES attempt 2's exit code so a real
        # regression fails the job. The job-level `timeout-minutes` bounds a
        # true hang; assertion failures fail in <1 s regardless of `--timeout`,
        # so this does not mask logic bugs.
        #
        # Each attempt is additionally wrapped in a 15-minute wall-clock timeout
        # (`scripts/run-with-timeout.ts` — portable because GNU `timeout` is not on
        # the macOS runner). `--timeout 60000` is PER-TEST and does not fire on a
        # hung-at-exit `bun test` (a lingering timer keeps the process alive after
        # all tests finish); without a whole-run cap such a hang spins until the
        # job's `timeout-minutes` ceiling and surfaces as "The operation was
        # canceled.". The wrapper kills the hang (exit 124) so retry-once actually
        # runs — recovering a transient hang in minutes instead of burning the full
        # ceiling.
        #
        # The cap is 900 s, NOT the 600 s it was through 2026-08-14. The old value
        # was justified by "far above a healthy Windows run (~2-3 min)", and that
        # premise silently expired: the gateway leg on windows-2025 drifted to
        # 340 s → 404 s → 516 s → 557 s over a single day, and the run that broke it
        # was killed mid-suite at 600 s (exit 124 on BOTH attempts, zero test
        # failures). The runner is also highly variable — 11,166 tests / 796 files
        # took 404 s and then 516 s on consecutive runs, a 28 % swing on identical
        # work — so a cap sized to the observed mean will keep false-killing green
        # suites. 900 s sits far enough above the worst observed healthy run (557 s)
        # to absorb that variance while still bounding a true hang well under the
        # job ceiling. Re-check this number if a healthy run ever exceeds ~700 s;
        # the durable fix is making the suite faster, not raising the cap again.
        run: |
          set +e
          for attempt in 1 2; do
            bun scripts/run-with-timeout.ts 900 bun test "packages/${{ matrix.pkg }}/src" --timeout 60000
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Both attempts failed with exit code $code"
              exit "$code"
            fi
            echo "Attempt $attempt failed (exit $code), retrying in 5 s..."
            sleep 5
          done
        env:
          CI: "true"

  # Code duplication scan — runs in parallel with the above two jobs.
  # Scans only packages/ for code duplication; docs-only PRs can't introduce
  # new code-duplication regressions, so we skip when code-changed is false.
  pr-quality-duplication:
    name: PR quality — Duplication scan
    if: github.event_name == 'pull_request' && needs.filter.outputs.code-changed == 'true'
    needs: filter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Detect code duplication (jscpd)
        # Reads .jscpd.json (min-lines 5 / min-tokens 50 / shared ignore set) so
        # the local `audit:duplication` script and CI measure identically. The
        # threshold there is a RATCHET: it fails on regression and is lowered as
        # further dedup lands; the standing target remains < 3%.
        #
        # Current numbers, measured — the previous note here said "~4.41%", which
        # matched neither the threshold nor the duplication:
        #   threshold  4%   (.jscpd.json)
        #   actual     3.48% duplicated LINES (6,122 of 176k) across 600 clones
        # so there is 0.52pp of slack, not "just above".
        #
        # The threshold gates the LINE percentage, NOT the token percentage —
        # which matters, because the token figure (4.19%) is ABOVE the threshold
        # and reading the wrong column suggests this job should be failing.
        # Verified by bisecting the config: threshold 3.6 passes, 3.4 fails.
        # See docs/superpowers/specs/2026-06-17-jscpd-big-dedup-design.md.
        run: bunx jscpd packages

  # Structure audit — D1/D2/D3 boundaries, D8 any-count ratchet, D10/D11
  # nimbus-invariants, release-please manifest drift. Static-time complement
  # to runtime enforcement in `security-invariants.test.ts`.
  pr-quality-structure:
    name: PR quality — Structure audit
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_structure.yml
    permissions:
      contents: read

  # ── Release safety, at PR time ─────────────────────────────────────────────
  #
  # Two checks that both protect the same thing: the squash commit this PR will
  # become, which release-please parses to build the changelog.
  #
  # (1) The PR body IS that commit's body. `pr-title-lint.yml` already guards the
  #     title for this reason; nothing guarded the body, and twice a code span
  #     holding an unbalanced `(` made release-please throw and DROP the commit —
  #     v2.4.6 lost #1218, v2.4.7 lost #1224 (the PR fixing the first). The
  #     release still ships; only the entry vanishes, and the tag is immutable.
  #
  # (2) If this IS the release PR, its changelog must account for every
  #     user-facing commit since the tag. That check already existed but ran only
  #     on push-to-main, where it goes red AFTER the release PR exists and is not
  #     one of that PR's checks — so v2.4.7 merged CLEAN with the guard already
  #     red on main. Running it here is what makes the finding arrive in time.
  #
  # Cheap by construction: no build, no bun install beyond the lockfile, two
  # short scripts. It is in `pr-quality-required`'s needs list, so it blocks.
  pr-quality-release-safety:
    name: PR quality — Release safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3'
      - name: Install
        run: bun install --frozen-lockfile
      - name: The squash commit this PR will produce must parse
        env:
          # From the event payload, never from a checkout of PR code.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/release/check-pr-message-parses.ts
      - name: If this is the release PR, it must account for every user-facing commit
        # release-please's branch. Any other PR skips: the completeness question is
        # only meaningful about a release PR.
        if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/release/release-pr-completeness.ts

  # ── The single required PR gate ────────────────────────────────────────────
  #
  # Branch-protection rulesets match check names LITERALLY, and a job skipped by
  # its own `if:` never expands `${{ }}` in its `name:` — it reports the raw
  # template instead. So a skipped reusable-workflow child posts
  # `… / Static — ${{ inputs.runner }}`, the required context
  # `… / Static — ubuntu-24.04` is never created, and the PR sits on
  # "Expected — Waiting for status to be reported" forever. That is why every
  # docs-only PR needed an OrganizationAdmin bypass to merge.
  #
  # Passing `run-tests=false` to the reusable workflow (so the caller always
  # runs) does NOT fix this: the children are still skipped at job level, so
  # their names still never expand.
  #
  # This job is the durable fix. It always runs, its name is a static string
  # with no interpolation, and it fails if any PR gate did not succeed. Make it
  # the only required `pr-quality-*` context and the whole class of bug is gone
  # — adding, renaming or matrix-ing a gate no longer needs a ruleset edit.
  #
  # `skipped` counts as a pass: it means `filter` legitimately decided the gate
  # does not apply (no Rust change, docs-only diff). It never means a gate was
  # silently lost — a gate that ran and failed reports `failure`, and one whose
  # dependency failed reports `skipped` only after that dependency has already
  # reported `failure` here.
  pr-quality-required:
    name: PR quality — required gates
    if: always() && github.event_name == 'pull_request'
    needs:
      - filter
      - pr-quality-ts
      - pr-quality-rust
      - pr-quality-cross-platform
      - pr-quality-duplication
      - pr-quality-structure
      - pr-quality-release-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Fail if any required PR gate did not succeed
        env:
          # Space-separated results of every job in `needs`, in declaration order.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "PR gate results: ${RESULTS}"

          # Fail CLOSED. An empty or short result set means the expression did
          # not evaluate as expected (renamed job, edited `needs:`), and an
          # empty list would otherwise skip the loop entirely and report green —
          # turning the one job that exists to catch failures into a rubber
          # stamp. Keep EXPECTED in step with the `needs:` list above.
          EXPECTED=7
          count=$(printf '%s\n' ${RESULTS} | grep -c . || true)
          if [[ "${count}" -ne "${EXPECTED}" ]]; then
            echo "::error::expected ${EXPECTED} gate results, got ${count} (${RESULTS}) — the needs: list and this check have drifted"
            exit 1
          fi

          failed=0
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a required PR gate reported '${r}'"; failed=1 ;;
            esac
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::one or more required PR gates did not pass — see the jobs above"
            exit 1
          fi
          echo "All ${count} required PR gates passed or were legitimately skipped."

  # ── Push: full cross-platform matrix (two parallel matrix jobs) ────────────

  # TS/Bun suite — all 3 OSes, runs in parallel with ci-rust
  # strategy must be declared before `uses` so `matrix.*` is valid for this job (GitHub Actions schema).
  ci-ts:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    name: CI — TS/Bun (${{ matrix.os }})
    uses: ./.github/workflows/_test-suite.yml
    with:
      runner: ${{ matrix.os }}
      run-packaging: ${{ matrix.os == 'ubuntu-24.04' }}
    secrets:
      # Optional; the reusable workflow silently skips the SonarQube step
      # when this is unset.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      checks: write
      id-token: write

  # Rust/Tauri checks — all 3 OSes, runs in parallel with ci-ts
  ci-rust:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    name: CI — Rust/Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust + Tauri checks
        uses: ./.github/actions/setup-rust-tauri

  # Structure audit on push — same gates as `pr-quality-structure`. Cheap to
  # re-run; catches the case where a force-push or merge bypasses the PR gate.
  ci-structure:
    if: github.event_name == 'push'
    name: CI — Structure audit
    uses: ./.github/workflows/_structure.yml
    permissions:
      contents: read

  # ── E2E Desktop ─────────────────────────────────────────────────────────────

  # E2E Desktop (PR) — optional: add label ci:e2e-desktop to the PR
  e2e-desktop-pr:
    name: E2E Desktop (PR) — ubuntu-24.04
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:e2e-desktop') && needs.filter.outputs.ui == 'true'
    needs: [filter, pr-quality-ts, pr-quality-rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Setup Rust + Tauri (install only, no checks)
        uses: ./.github/actions/setup-rust-tauri
        with:
          run-checks: "false"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build Tauri app
        run: cd packages/ui && bunx tauri build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E desktop tests
        shell: bash
        run: |
          mkdir -p junit-reports
          bun test packages/ui/test/e2e/ --reporter=junit --reporter-outfile=junit-reports/junit-e2e-desktop.xml
        env:
          CI: "true"

      - name: JUnit test report (E2E desktop)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: E2E desktop (PR)
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  # E2E Desktop (Playwright + Tauri WebDriver) — push to main only, full OS matrix
  e2e-desktop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `ci-ts` is the whole _test-suite.yml (30 jobs incl. 24 coverage shards),
    # and `needs:` on a reusable-workflow caller waits for ALL of it — measured
    # at 33.4min median DAG wait. E2E consumes no artifact from it: it does its
    # own checkout, install and Tauri setup. `ci-rust` (1.17-1.72min) is the
    # prerequisite that carries meaning: a broken Tauri build makes E2E
    # unrunnable.
    #
    # Dropping `ci-ts` means E2E now runs even when the TS suite fails on a
    # `main` push — an accepted cost, not an oversight: it's cheaper than a
    # duplicate typecheck job on every push, and measured data shows it's rare.
    # See the P4b progress log in docs/infrastructure-roadmap.md ("A
    # TS-failing, Rust-passing `main` commit burns E2E runners") for the
    # numbers and the revisit trigger.
    needs: [ci-rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    name: E2E Desktop — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Setup Rust + Tauri (install only, no checks)
        uses: ./.github/actions/setup-rust-tauri
        with:
          run-checks: "false"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build Tauri app
        run: cd packages/ui && bunx tauri build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E desktop tests
        shell: bash
        run: |
          mkdir -p junit-reports
          bun test packages/ui/test/e2e/ --reporter=junit --reporter-outfile=junit-reports/junit-e2e-desktop.xml
        env:
          CI: "true"

      - name: JUnit test report (E2E desktop)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: E2E desktop (${{ matrix.os }})
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
