name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  # Nightly: the desktop E2E matrix (and the Rust checks it needs) on `main`. A push runs that
  # matrix only when it changed `packages/ui/`; this catches anything else that breaks it within a
  # day. Every other job is gated on `push` or `pull_request` and does not run on a schedule.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  # PRs share a per-ref group, so a superseded run is cancelled (cheap — the
  # branch head moved). Pushes get a per-COMMIT group so they never share a
  # group at all.
  #
  # `cancel-in-progress: false` alone is NOT enough for pushes: it only keeps
  # the *in-progress* run alive. GitHub still allows one pending run per group
  # and "any previously pending workflow in the concurrency group is
  # cancelled" when a newer one arrives. Consecutive merges therefore evicted
  # each other while queued and lost their validation entirely — 33 of 60 push
  # runs cancelled with ZERO jobs, so the commits that actually shipped were
  # never tested. A per-SHA group means every merge commit validates on its own.
  # The event name is part of it so the nightly schedule, which runs on `main`'s head, never
  # queues behind (or evicts) the push run of that same commit.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Filter: detect changes to optimize PR feedback ──────────────────────────
  filter:
    name: Detect changes
    runs-on: ubuntu-24.04
    # A paths-filter that decides the rest of the run. Without a cap it
    # inherits GitHub's 360-minute default, and every downstream job `needs:`
    # it — so one wedged filter holds the whole workflow's slot for six hours.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      rust: ${{ steps.changes.outputs.rust }}
      # code-changed=false when every changed file matches docs/, *.md,
      # LICENSE*, CHANGELOG*, or .github/*.md. Gates the heavy TS/Bun and
      # cross-platform PR jobs so docs-only PRs still get a structure audit
      # (which checks doc-ref drift — the relevant gate for docs PRs) without
      # paying for a full 3-runner test cycle.
      #
      # Also false for a release PR that is a version bump and nothing else (`release-only`
      # below): structure audit and release safety still run on it, and release safety
      # typechecks it.
      code-changed: ${{ steps.release-only.outputs.release-only != 'true' && steps.changes.outputs.code-changed || 'false' }}
      # "true" only for release-please's own PR whose diff touches release-please's files and
      # changes nothing in them but version strings and its changelog entry — decided by
      # `scripts/ci/release-only-diff.ts` AS IT IS ON THE BASE COMMIT. See the steps below.
      release-only: ${{ steps.release-only.outputs.release-only == 'true' }}
      embedding-native: ${{ steps.changes.outputs.embedding-native }}
      # "true" when this run uploaded ONE Windows timings snapshot for both Windows shards of
      # `pr-quality-cross-platform` to read. See the snapshot steps below.
      windows-timings: ${{ steps.windows-timings.outputs.present }}
      # There is deliberately no per-package narrowing output here any more.
      # `pr-quality-cross-platform` used to emit a {os, pkg} matrix so a cli-only
      # PR could drop the two gateway legs; it now runs ONE leg per OS executing
      # the same whole-repo command as the push matrix, so there is no package
      # dimension left to narrow. That is cheaper, not dearer: a PR touching both
      # packages went from four legs to two.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to HEAD~1 for new branches where before-SHA is all-zeros.
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || echo "")
          echo "ui=$(grep -qE '^packages/ui/' <<<"$CHANGED" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust=$(grep -qE '^packages/ui/src-tauri/' <<<"$CHANGED" && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # Fail-safe: an empty diff (e.g. base resolution glitch) is treated as
          # "code might have changed" so we never skip the test suite on an
          # unknown change set.
          if [[ -z "$CHANGED" ]]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            # Non-doc-only changes: anything outside docs/, *.md, LICENSE,
            # CHANGELOG. `.github/workflows/*.yml` is intentionally NOT
            # whitelisted — workflow changes must run the full test suite
            # to verify CI itself didn't regress.
            NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|LICENSE([-_].*)?$|CHANGELOG([-_].*)?$|.*\.md$|.*\.MD$)' || true)
            if [[ -z "$NON_DOC" ]]; then
              echo "code-changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "code-changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # NB: these use a here-string, not `echo "$CHANGED" | grep -q`. Under `pipefail`,
          # `grep -q` exits on the first match and can SIGPIPE the producer, so the pipeline
          # reports non-zero and the `|| echo false` branch wins — a FALSE NEGATIVE that silently
          # skips the job. Reproduced with a large change set: piped said `false` where the
          # here-string said `true`.
          # The onnx clean-room check is expensive (two container images), so it is scoped to the
          # paths that can actually break the embedded native payload — the plugin, the worker
          # build, the harness itself, the embedding/worker sources, and any dependency change
          # that could swap the onnxruntime version out from under it. Same fail-safe as above:
          # an unknown change set runs it rather than skipping.
          if [[ -z "$CHANGED" ]]; then
            echo "embedding-native=true" >> "$GITHUB_OUTPUT"
          else
            echo "embedding-native=$(grep -qE '^(scripts/(onnx-binding-plugin\.ts|build-workers\.ts|verify-onnx-cleanroom\.sh)|packages/gateway/src/(workers|embedding)/|packages/gateway/package\.json$|bun\.lock|\.github/workflows/ci\.yml$)' <<<"$CHANGED" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      # ONE snapshot of the Windows per-file timings, taken here and handed to both Windows shards
      # of `pr-quality-cross-platform` as an artifact. Each shard must split the suite with the SAME
      # table: `--shard=k/N` partitions by the timings it reads, so two shards reading different
      # tables need not partition the same file list, and a test file can drop out of the PR gate
      # with every check green. Restoring "newest by prefix" inside each shard could do exactly
      # that — the jobs start minutes apart, and every push to `main` saves a newer entry.
      #
      # It lives in THIS job, not a job of its own, because `pr-quality-required` counts `skipped`
      # as passing: a failed snapshot job would skip both shards and leave the gate green. `filter`
      # is already a `needs:` of everything, and these steps are `continue-on-error`, so the worst a
      # cache problem can do is leave the shards balanced by file count. `enableCrossOsArchive`
      # lets this Ubuntu job read an entry the Windows push leg saved, and the workspace-relative
      # path is what makes the two sides' cache versions match. No leading dot in the name:
      # upload-artifact skips hidden files.
      - name: Snapshot Windows test timings (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-test-timings.json
          key: test-timings-Windows-pr-${{ github.run_id }}
          restore-keys: |
            test-timings-Windows-
          enableCrossOsArchive: true

      - name: Hand the snapshot to the Windows shards
        id: upload-windows-timings
        if: github.event_name == 'pull_request' && hashFiles('ci-test-timings.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-snapshot-windows
          path: ci-test-timings.json
          retention-days: 1

      - name: Record whether a snapshot was handed over
        id: windows-timings
        shell: bash
        env:
          UPLOADED: ${{ steps.upload-windows-timings.outcome == 'success' }}
        run: echo "present=${UPLOADED}" >> "$GITHUB_OUTPUT"

      # ── Release PR fast path ────────────────────────────────────────────────────────────────
      #
      # release-please rewrites its release PR after every merge, and every rewrite ran the whole
      # gate: 137 of 446 PR runs in the 30 days to 2026-10-16. None of the 8 that went red was
      # caused by the release diff — all were flaky tests in code `main` had already tested on
      # three OSes — and the tag's own Release workflow runs the full Ubuntu suite again before it
      # builds anything. So a release PR whose diff is a version bump and nothing else skips the
      # test jobs (`code-changed` above).
      #
      # Only release-please's own PR can take this path: the bot's login AND a same-repository
      # branch AND release-please's branch prefix, so a fork that names its branch to match does
      # not qualify. And the decision is made by the detector AS IT IS ON THE BASE COMMIT, reading
      # the base's release-please config, so the PR being judged can neither edit the judge nor
      # widen what counts as release-managed. Any error leaves `release-only` unset, which means a
      # full run (`continue-on-error` below is that fail-safe, not a way past it).
      - name: Setup Bun (release PRs only)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'nimbus-release-bot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4'

      - name: Is this release PR a version bump and nothing else?
        id: release-only
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'nimbus-release-bot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git show "${BASE_SHA}:scripts/ci/release-only-diff.ts" > "${RUNNER_TEMP}/release-only-diff.ts"
          bun "${RUNNER_TEMP}/release-only-diff.ts" "${BASE_SHA}" "${HEAD_SHA}" >> "$GITHUB_OUTPUT"

  # ── PR: fast feedback (three jobs run in parallel) ─────────────────────────

  # TS/Bun test suite — ubuntu only, runs in parallel with pr-quality-rust
  pr-quality-ts:
    name: PR quality — TS/Bun (ubuntu-24.04)
    # Always run on PRs so the required reusable-workflow child checks
    # (`… / Static`, `… / Unit + Coverage`, … `/ Packaging`) always REPORT a
    # status. On docs-only PRs we pass run-tests=false, which skips every child
    # job — a skipped required check counts as passing. Gating the *caller* on
    # `code-changed` instead (the old behavior) meant the reusable workflow
    # never ran, so the 6 child contexts were never created and sat
    # "Expected — Waiting for status to be reported" forever, blocking the merge.
    # Test execution on code PRs is unchanged (code-changed=true → run-tests=true).
    if: github.event_name == 'pull_request'
    needs: filter
    uses: ./.github/workflows/_test-suite.yml
    with:
      runner: ubuntu-24.04
      run-packaging: true
      run-tests: ${{ needs.filter.outputs.code-changed == 'true' }}
    secrets:
      # Optional; the reusable workflow silently skips the SonarQube step
      # when this is unset (e.g. on fork PRs).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      checks: write
      # Required by _test-suite.yml (Codecov use_oidc: true on the unit-coverage upload).
      id-token: write

  # Rust/Tauri checks — ubuntu only, runs in parallel with pr-quality-ts
  pr-quality-rust:
    name: PR quality — Rust/Tauri (ubuntu-24.04)
    if: github.event_name == 'pull_request' && needs.filter.outputs.rust == 'true'
    needs: filter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust + Tauri checks
        uses: ./.github/actions/setup-rust-tauri

  # Cross-platform gate — the non-Linux half of the PR test gate.
  # The full 3-OS matrix runs on push to main, but that catches platform
  # divergence only AFTER merge. This job runs the same suite on macOS +
  # Windows so cross-platform regressions (BUG-009 cross-OS path-shape
  # mismatch was the motivating example) surface before the merge button.
  #
  # Gateway and CLI used to run as SEPARATE matrix entries, for parallelism and
  # for process isolation: the CLI suite's mock harness
  # (`packages/cli/test/helpers/cli-mocks.ts`) installs process-global
  # `mock.module` registrations, and running gateway + CLI in one process once
  # let a gateway test's global `mock.restore()` corrupt CLI repl tests on macOS.
  #
  # That isolation was never a property of the product — only of this job. The
  # macOS and Windows PUSH legs have run gateway + cli + scripts (plus
  # mcp-connectors, until #1347 extracted it) in ONE process the whole time
  # (`_test-suite.yml`), so `main` was already paying whatever that costs
  # while the PR gate was insulated from it. Checked against the 2026-08-22
  # macOS push run before this job was changed: every
  # `cli-mocks` consumer (`ask`/`audit`/`catchup`/`clip`…) and `repl-core.test.ts`
  # loaded in the same process as the gateway suite, and not one CLI test failed.
  # The hazard is stale.
  #
  # So a per-package split now buys parallelism at the cost of the only thing
  # that makes this gate predictive. If the hazard ever returns, this job is
  # where it should surface — at PR time, on the contributor's branch, instead
  # of on `main` where it is everyone's problem.
  pr-quality-cross-platform:
    name: PR quality — Cross-platform (${{ matrix.label }})
    # One leg per OS (Windows split into two shards of it, see the matrix), running the
    # SAME whole-repo `bun test` command as the push matrix. That equality is the
    # entire point of this job's shape, and it was not true before 2026-08-23: this
    # job ran `bun test packages/<pkg>/src` while the push leg ran `bun test
    # packages/gateway packages/cli scripts` in ONE process. Over the 200 CI runs on
    # `main` between 2026-08-02 and 2026-08-22, 50 failed and 35 of those had a
    # failing macOS job — and 33 of the 35 were files this job never loaded at all
    # (`scripts/`, `test/integration/`, `test/e2e/`). They were only ever
    # discovered after merge, on `main`.
    #
    # Both legs now pass `--parallel` (Bun 1.4): files run across worker processes,
    # each in a fresh global (`--parallel` implies `--isolate`). The parity that
    # matters is unchanged — the same files, in the same process SHAPE, on both legs —
    # but the shape itself moved from "one process, mocks leak across files" to
    # "isolated files, nothing leaks". Measured locally on 4 cores, packages/gateway/src
    # went from 384 s to 112 s with an identical pass/fail set. `--parallel` belongs to
    # the shape: removing it from one leg and not the other breaks the equality this
    # job exists to keep.
    #
    # The process composition matters as much as the file set, which is the part
    # that is easy to under-fix. `mock.module` is process-global in Bun, so a
    # per-package run and a whole-repo run do not have the same mock registrations
    # in play — #1307 merged a test that was green on this job on all three OSes
    # (the two files that mock its dependency live under `packages/gateway/test/`,
    # which `packages/gateway/src` never loads) and red on the macOS push leg
    # within minutes. Scoping alone would not have caught it; running the same
    # command in the same shape does.
    #
    # No expanded Cross-platform check name is a required context in any ruleset —
    # verified against the live General ruleset (14784377), which requires exactly
    # "PR quality — required gates", the six Security contexts, the two CodeQL
    # "Analyze (…)" contexts and "cla" — so renaming the legs leaves nothing
    # "Expected — Waiting for status to be reported". `pr-quality-required`
    # needs: this job, which is what actually gates.
    #
    # The job still RUNS on every PR: the expensive steps below are individually
    # gated on `code-changed`, so a docs-only PR spins up both legs and reports
    # success without doing test work. Keep it that way — a job that does not
    # expand cannot report, and an unreported required-gate dependency blocks the
    # PR forever rather than failing it.
    if: github.event_name == 'pull_request'
    needs: filter
    strategy:
      fail-fast: false
      # Windows runs as TWO shards of the same suite; macOS as one. Measured on #1654's run, the
      # windows-2025 leg spent ~610 s of ~15 min in the test step against ~200 s for macOS, so the
      # test step IS that leg's critical path and splitting it is the one change that halves it.
      # `bun test --shard=k/N` partitions the file list, so the shards together run exactly the
      # files the single command did — parity with the push leg is on the UNION of the shards,
      # and `cross-platform-parity.test.ts` checks the shard set is complete. macOS stays `1/1`
      # (no split), which still gets slowest-first ordering from the timings file below.
      #
      # `label` is the check name and `id` names the artifact (an artifact name cannot hold `/`).
      # The macOS label is the bare OS, so its check name is unchanged.
      matrix:
        include:
          - { os: macos-15, shard: "1/1", label: "macos-15", id: "macos-15" }
          - { os: windows-2025, shard: "1/2", label: "windows-2025, 1/2", id: "windows-2025-shard-1" }
          - { os: windows-2025, shard: "2/2", label: "windows-2025, 2/2", id: "windows-2025-shard-2" }
    runs-on: ${{ matrix.os }}
    # Backstop only — each test attempt has its own 25-min wall-clock cap (see the
    # unit-tests step), so a hang fails fast via retry rather than burning this
    # ceiling. Sized for setup + retried typecheck + 2 capped test attempts:
    # 2 × 25 min of tests alone is 50 min, so this MUST stay above that or a
    # double-timeout is cancelled at the job ceiling ("The operation was canceled")
    # instead of surfacing the wrapper's exit 124 — the very failure mode the
    # per-attempt cap exists to prevent. Raise both together or neither.
    #
    # The binding arithmetic, which the 600 s → 900 s raise did not state and therefore
    # could not check: `setup + typecheck retry + 2 × cap <= ceiling`, every term a BOUND
    # or a measured worst, never a typical value.
    #
    #   setup            465 s  Job time minus the capped test step, windows-2025, ten
    #                           successful runs 2026-09-29/30: 213 · 221 · 225 · 226 · 263
    #                           · 289 · 293 · 303 · 322 · 465. The earlier figure, ~270 s,
    #                           was ONE run and sits at this sample's median; the 465 s run
    #                           spent 398 s in dependency setup alone.
    #   typecheck retry  125 s  One attempt killed at its 120 s cap + the 5 s pause. The
    #                           attempt that then passes is already inside `setup`. Two
    #                           killed attempts fail the job before any test runs, so this
    #                           is the most a retry can add to a job that still reaches
    #                           the tests.
    #   tests           3005 s  2 × 1500 s cap + the 5 s pause between attempts.
    #
    # 465 + 125 + 3005 = 3595 s ≈ 59.9 min — so 60 would have been 5 s from cancelling the
    # second attempt, and this is 65: 305 s spare, 7.8 % of the ceiling. (The 1080 s /
    # 48-minute pair was sized against the 270 s figure and against an UNCAPPED typecheck,
    # so its stated 450 s margin was not a bound at all.) A cap raised alone would have
    # been silently useless: the second attempt could never finish.
    timeout-minutes: 65
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must precede dependency setup so `bun install` already runs under the Defender
      # exclusions, and the TEMP/TMP it exports reach every later step (the test run's
      # `os.tmpdir()` fixtures above all). TEMP goes to a plain directory on the runner's local
      # D: drive: an SQLite commit there costs 1.4 ms against 16-20 ms on C:, where the Dev Drive
      # that used to hold TEMP lived. Fail-soft: a failure warns and leaves the leg exactly as it
      # was. Rationale and measurements: the header of the script.
      - name: Windows — TEMP on the local disk + Defender exclusions
        if: runner.os == 'Windows' && needs.filter.outputs.code-changed == 'true'
        shell: pwsh
        run: ./scripts/ci/setup-windows-temp.ps1

      - name: Setup Bun and install dependencies
        if: needs.filter.outputs.code-changed == 'true'
        uses: ./.github/actions/setup-nimbus-ci

      - name: macOS — Strip quarantine from native SQLite extensions
        if: runner.os == 'macOS' && needs.filter.outputs.code-changed == 'true'
        shell: bash
        run: find node_modules -name "*.dylib" -print0 2>/dev/null | xargs -0 xattr -d com.apple.quarantine 2>/dev/null || true

      - name: macOS — Create and unlock CI Keychain
        if: runner.os == 'macOS' && needs.filter.outputs.code-changed == 'true'
        shell: bash
        run: |
          security create-keychain -p "" nimbus-ci.keychain
          security list-keychains -d user -s nimbus-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s nimbus-ci.keychain
          security unlock-keychain -p "" nimbus-ci.keychain
          security set-keychain-settings -lut 7200 nimbus-ci.keychain

      # Typecheck is monorepo-wide, so it runs once per OS — which is exactly
      # once per leg now that the matrix has no package dimension. (It used to be
      # pinned to the `gateway` entry to avoid running twice on the same OS.)
      # cli consumes the published @nimbus-dev/client from npm, so no local client
      # build is needed.
      - name: Typecheck (catches host-specific TS quirks)
        if: needs.filter.outputs.code-changed == 'true'
        shell: bash
        # @nimbus/docs is excluded here: it has no host-specific TS surface and
        # its astro-sync content-type generation flakes a 60s Vite timeout on slow
        # macOS runners. Full workspace typecheck (incl. docs) still runs once on
        # Ubuntu in _test-suite.yml. Retry-once mirrors the unit-tests step below.
        #
        # Each attempt is capped at 120 s, for the same reason the test attempts are: an
        # uncapped step has no place in the job ceiling's arithmetic (see `timeout-minutes`
        # above), and a wedged `tsc` would otherwise eat the time the second test attempt
        # needs. Measured over 22 legs on 2026-09-29/30 this step takes 6–11 s on both
        # OSes, so 120 s is more than ten times a healthy run. A kill exits 124 and is
        # retried like any other failure.
        run: |
          set +e
          for attempt in 1 2; do
            bun scripts/run-with-timeout.ts 120 bun run typecheck:no-docs
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then echo "Both attempts failed (exit $code)"; exit "$code"; fi
            echo "Attempt $attempt failed (exit $code), retrying in 5 s..."
            sleep 5
          done

      # Must precede the test step: the whole-repo run collects
      # `packages/gateway/test/integration/platform/sandbox/`, whose spawn suite
      # goes RED rather than skipping when its platform dependency is missing (a
      # skip and a pass are indistinguishable in a CI summary — exactly how the
      # original Windows spawn defect survived a green three-OS matrix).
      - name: Build sandbox helper (Windows, for the spawn suite)
        if: needs.filter.outputs.code-changed == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: bun run build:sandbox-helper:win32

      # Per-file durations from push runs on `main` (written by `_test-suite.yml`'s macOS/Windows
      # step with `--update-timings`). With them, `--shard` splits the suite by measured TIME rather
      # than by file count, and `--parallel` starts the slowest files first so one long e2e file
      # does not start last and stretch the run. Written on `main`, so every PR can read them — a
      # PR-scoped entry would only ever serve that PR, the trap #1654 removed. With no timings at
      # all the shards still cover every file, balanced by count.
      #
      # Windows takes the ONE snapshot `filter` uploaded, so both shards split with the same table
      # (see the snapshot steps there). The download is NOT continue-on-error: if a snapshot
      # exists and one shard cannot fetch it, that shard would split differently from its sibling,
      # so it fails instead. macOS is a single `1/1` job with nothing to keep in step, so it
      # restores the newest entry directly.
      - name: Windows — fetch the shared timings snapshot
        if: needs.filter.outputs.code-changed == 'true' && runner.os == 'Windows' && needs.filter.outputs.windows-timings == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-timings-snapshot-windows
          path: ${{ runner.temp }}

      - name: macOS — restore per-file test timings (from main)
        if: needs.filter.outputs.code-changed == 'true' && runner.os == 'macOS'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-test-timings.json
          key: test-timings-macOS-pr-${{ github.run_id }}
          restore-keys: |
            test-timings-macOS-
          enableCrossOsArchive: true

      - name: macOS — move the timings out of the checkout
        if: needs.filter.outputs.code-changed == 'true' && runner.os == 'macOS'
        shell: bash
        run: if [ -f ci-test-timings.json ]; then mv ci-test-timings.json "${RUNNER_TEMP}/"; fi

      - name: Unit + integration tests (one targeted retry on slow runners)
        if: needs.filter.outputs.code-changed == 'true'
        shell: bash
        # `scripts/ci/test-with-retry.ts` runs the suite and retries ONCE. The retry re-runs only
        # the files that failed when the JUnit report accounts for every failure Bun counted, and
        # the whole command otherwise (a file that failed to load, an error between tests, an
        # attempt killed by the cap). A whole-shard retry cost ~13 min on windows-2025 2/2 to
        # recover one starved test, and 2/2 needed one in 14 of 41 runs (2026-10-10 → 10-16).
        # Attempt 2's exit code is the step's, so a real regression still fails it. The script
        # also fences the test output off from workflow-command processing and writes its own
        # annotations: GitHub keeps only 10 warnings and 10 errors per step, and the suite's own
        # output used to spend them before the retry warnings were printed. Rationale and the Bun
        # behaviour it relies on: the script header.
        #
        # `--timeout=60000` matches every other `bun test` invocation in the repo. Bun does NOT
        # honour `bunfig.toml`'s `[test] timeout` for `bun test <path>`, so without the flag the
        # per-test default here is 5000 ms, which was the systemic Windows timeout of #541.
        #
        # `--cap-seconds=1500` caps each ATTEMPT's wall clock. `--timeout` is per test and does not
        # fire on a `bun test` hung at exit; the cap turns that into exit 124 and a retry instead of
        # a cancellation at the job ceiling. It has been 600 s, 900 s (2026-08-14), 1080 s
        # (2026-08-28) and 1500 s (2026-09-30); each value expired once healthy runs grew into it.
        # Healthy single-attempt steps 2026-10-10 → 10-16: windows 1/2 3.7 min and 2/2 8.7 min
        # median (p90 10.5), macOS 4.2 min. Raising it moves `timeout-minutes` above with it.
        run: bun scripts/ci/test-with-retry.ts --label="${{ matrix.label }}" --cap-seconds=1500 --report-dir="${RUNNER_TEMP}" -- bun test packages/gateway packages/cli scripts --timeout=60000 --parallel --shard=${{ matrix.shard }} --timings="${RUNNER_TEMP}/ci-test-timings.json"
        env:
          CI: "true"

      # Where the single-process run spends its time, per test file, so speeding this leg up
      # starts from data. Diagnostics only: `always()` so a failed or retried run still reports,
      # and the summarizer exits 0 when a killed attempt left no report.
      - name: Slowest test files (job summary + JUnit artifact)
        if: always() && needs.filter.outputs.code-changed == 'true'
        shell: bash
        run: |
          for attempt in 1 2; do
            report="${RUNNER_TEMP}/junit-attempt-${attempt}.xml"
            if [ "$attempt" -eq 2 ] && [ ! -f "$report" ]; then break; fi
            bun scripts/ci/junit-slowest-files.ts "$report" --top=30 \
              "--title=Slowest test files — ${{ matrix.label }}, attempt ${attempt}" >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Upload test timings
        if: always() && needs.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-${{ matrix.id }}
          path: ${{ runner.temp }}/junit-attempt-*.xml
          if-no-files-found: ignore
          retention-days: 14

      # There is no separate "platform-sensitive integration tests" step any more.
      # #1298 added one because the step above was scoped to `packages/<pkg>/src` and
      # so never collected `packages/gateway/test/integration/` — it named the sandbox
      # spawn suite explicitly, and nothing else, to avoid paying for the whole
      # integration suite on two slow runners. The whole-repo command above now
      # collects that directory (and `test/e2e/`, and `scripts/`) on its own, so
      # keeping the step would run those tests twice per leg. Do not re-add a
      # narrowly-named suite here: if a test needs to run cross-platform at PR
      # time, it already does.
      # macOS denials never reach the child's stderr — the kernel logs them, and the process just
      # dies (SIGABRT -> exit 134 through the wrapper's signal translation) with both streams
      # empty. That is why two rounds of in-test diagnostics could not name the macOS cause while
      # the Windows one was legible immediately: on Windows the launcher's own message is on
      # stderr, on macOS it is nowhere the test can see. This reads it from the one place it
      # exists. `|| true` so a log-query failure cannot mask the real test failure above.
      # The predicate below was `senderImagePath CONTAINS "Sandbox" OR eventMessage CONTAINS
      # "deny"` over `--last 5m`, and on the run that needed it, it printed only boot-time
      # `(Sandbox)` kext chatter and not one denial — so `darwin.ts`'s instruction to "add exactly
      # what that log names" had nothing to read. Two changes: `--last 30m` (the suite retries, so
      # the interesting spawn can be well outside a 5-minute window by the time this runs), and
      # `--info --debug`, without which sandbox denial records are not emitted by `log show` at
      # all. The subsystem predicate is the one that actually matches a denial line.
      - name: macOS — sandbox denials from the kernel log (on failure only)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          echo "Sandbox denials logged in the last 30 minutes:"
          log show --last 30m --style compact --info --debug \
            --predicate 'subsystem == "com.apple.sandbox" OR senderImagePath CONTAINS "Sandbox" OR eventMessage CONTAINS "deny("' \
            2>/dev/null | grep -iE "deny\(|Sandbox:" | head -60 || true
          echo "(empty above means the denial was not captured — see the permissive-probe line in the test output instead)"

  # Code duplication scan — runs in parallel with the above two jobs.
  # Scans only packages/ for code duplication; docs-only PRs can't introduce
  # new code-duplication regressions, so we skip when code-changed is false.
  # Proves the embedded onnxruntime payload loads on a machine with NOTHING of ours installed.
  #
  # This gate exists because the same bug was "fixed" twice and verified twice in environments
  # that masked the failure: once in the source tree (which has `dist/bin/`) and once on a Windows
  # box that happened to carry `onnxruntime.dll` in System32. Both reported success; neither
  # worked for users. The harness refuses to report a pass unless it first proves the run image is
  # clean, so a green here cannot come from a preinstalled runtime.
  pr-quality-onnx-cleanroom:
    name: PR quality — ONNX clean room
    if: github.event_name == 'pull_request' && needs.filter.outputs.embedding-native == 'true'
    needs: filter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # The harness pulls two images and the probe downloads nothing, but the BUILD stage
          # resolves the onnx payload out of node_modules, so egress stays audited rather than
          # blocked.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Verify the onnx payload in a clean room
        run: bash scripts/verify-onnx-cleanroom.sh

  pr-quality-duplication:
    name: PR quality — Duplication scan
    if: github.event_name == 'pull_request' && needs.filter.outputs.code-changed == 'true'
    needs: filter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Detect code duplication (jscpd)
        # Reads .jscpd.json (min-lines 5 / min-tokens 50 / shared ignore set) so
        # the local `audit:duplication` script and CI measure identically. The
        # threshold there is a RATCHET: it fails on regression and is lowered as
        # further dedup lands. When a dedup lands, set it to the measurement
        # rounded UP to one decimal, never below it. Code added elsewhere
        # dilutes the percentage without removing a clone, so that alone is no
        # reason to tighten it.
        #
        # Current numbers, measured 2026-10-04 after the quality-sweep dedup
        # (2.42% and 488 clones on main before it):
        #   threshold  1.7%  (.jscpd.json; set when the dedup measured 1.6004%)
        #   actual     1.60% duplicated LINES (3,559 of 222.5k) across 341 clones
        # so there is about 0.1pp of slack. A PR that adds a sizeable clone
        # will trip it; dedup the clone rather than raising the number.
        #
        # The threshold gates the LINE percentage, NOT the token percentage.
        # The token figure (1.93%) is ABOVE the threshold, so reading that
        # column makes this job look like it should be failing.
        # Verified with --threshold: 1.59 fails; 1.6 and 1.7 pass.
        run: bunx jscpd packages

  # Structure audit — D1/D2/D3 boundaries, D8 any-count ratchet, D10/D11
  # nimbus-invariants, release-please manifest drift. Static-time complement
  # to runtime enforcement in `security-invariants.test.ts`.
  pr-quality-structure:
    name: PR quality — Structure audit
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_structure.yml
    permissions:
      contents: read

  # ── Release safety, at PR time ─────────────────────────────────────────────
  #
  # Two checks that both protect the same thing: the squash commit this PR will
  # become, which release-please parses to build the changelog.
  #
  # (1) The PR body IS that commit's body. `pr-title-lint.yml` already guards the
  #     title for this reason; nothing guarded the body, and twice a code span
  #     holding an unbalanced `(` made release-please throw and DROP the commit —
  #     v2.4.6 lost #1218, v2.4.7 lost #1224 (the PR fixing the first). The
  #     release still ships; only the entry vanishes, and the tag is immutable.
  #
  # (2) If this IS the release PR, its changelog must account for every
  #     user-facing commit since the tag. That check already existed but ran only
  #     on push-to-main, where it goes red AFTER the release PR exists and is not
  #     one of that PR's checks — so v2.4.7 merged CLEAN with the guard already
  #     red on main. Running it here is what makes the finding arrive in time.
  #
  # Cheap by construction: no build, no bun install beyond the lockfile, two
  # short scripts. It is in `pr-quality-required`'s needs list, so it blocks.
  pr-quality-release-safety:
    name: PR quality — Release safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4'
      - name: Install
        run: bun install --frozen-lockfile
      - name: The squash commit this PR will produce must parse
        env:
          # From the event payload, never from a checkout of PR code.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/release/check-pr-message-parses.ts
      - name: If this is the release PR, it must account for every user-facing commit
        # release-please's branch. Any other PR skips: the completeness question is
        # only meaningful about a release PR.
        if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/release/release-pr-completeness.ts
      - name: If this is the release PR, it must typecheck
        # A release PR that is only a version bump skips the test jobs (`filter`'s
        # `release-only`), and with them the `Static` typecheck. Its one source change is
        # `packages/gateway/src/version.ts`, so it is checked here instead — cheaply, on every
        # release PR whether or not it took the fast path.
        if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        run: bun run typecheck:no-docs

  # ── The single required PR gate ────────────────────────────────────────────
  #
  # Branch-protection rulesets match check names LITERALLY, and a job skipped by
  # its own `if:` never expands `${{ }}` in its `name:` — it reports the raw
  # template instead. So a skipped reusable-workflow child posts
  # `… / Static — ${{ inputs.runner }}`, the required context
  # `… / Static — ubuntu-24.04` is never created, and the PR sits on
  # "Expected — Waiting for status to be reported" forever. That is why every
  # docs-only PR needed an OrganizationAdmin bypass to merge.
  #
  # Passing `run-tests=false` to the reusable workflow (so the caller always
  # runs) does NOT fix this: the children are still skipped at job level, so
  # their names still never expand.
  #
  # This job is the durable fix. It always runs, its name is a static string
  # with no interpolation, and it fails if any PR gate did not succeed. Make it
  # the only required `pr-quality-*` context and the whole class of bug is gone
  # — adding, renaming or matrix-ing a gate no longer needs a ruleset edit.
  #
  # `skipped` counts as a pass: it means `filter` legitimately decided the gate
  # does not apply (no Rust change, docs-only diff). It never means a gate was
  # silently lost — a gate that ran and failed reports `failure`, and one whose
  # dependency failed reports `skipped` only after that dependency has already
  # reported `failure` here.
  pr-quality-required:
    name: PR quality — required gates
    if: always() && github.event_name == 'pull_request'
    needs:
      - filter
      - pr-quality-ts
      - pr-quality-rust
      - pr-quality-cross-platform
      - pr-quality-duplication
      - pr-quality-onnx-cleanroom
      - pr-quality-structure
      - pr-quality-release-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Fail if any required PR gate did not succeed
        env:
          # Space-separated results of every job in `needs`, in declaration order.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "PR gate results: ${RESULTS}"

          # Fail CLOSED. An empty or short result set means the expression did
          # not evaluate as expected (renamed job, edited `needs:`), and an
          # empty list would otherwise skip the loop entirely and report green —
          # turning the one job that exists to catch failures into a rubber
          # stamp. Keep EXPECTED in step with the `needs:` list above.
          EXPECTED=8
          count=$(printf '%s\n' ${RESULTS} | grep -c . || true)
          if [[ "${count}" -ne "${EXPECTED}" ]]; then
            echo "::error::expected ${EXPECTED} gate results, got ${count} (${RESULTS}) — the needs: list and this check have drifted"
            exit 1
          fi

          failed=0
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a required PR gate reported '${r}'"; failed=1 ;;
            esac
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::one or more required PR gates did not pass — see the jobs above"
            exit 1
          fi
          echo "All ${count} required PR gates passed or were legitimately skipped."

  # ── Push: full cross-platform matrix (two parallel matrix jobs) ────────────

  # TS/Bun suite — all 3 OSes, runs in parallel with ci-rust
  # strategy must be declared before `uses` so `matrix.*` is valid for this job (GitHub Actions schema).
  ci-ts:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    name: CI — TS/Bun (${{ matrix.os }})
    uses: ./.github/workflows/_test-suite.yml
    with:
      runner: ${{ matrix.os }}
      run-packaging: ${{ matrix.os == 'ubuntu-24.04' }}
    secrets:
      # Optional; the reusable workflow silently skips the SonarQube step
      # when this is unset.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      checks: write
      id-token: write

  # Rust/Tauri checks — all 3 OSes, runs in parallel with ci-ts. Also nightly, because the
  # nightly desktop E2E below `needs:` it.
  ci-rust:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    name: CI — Rust/Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust + Tauri checks
        uses: ./.github/actions/setup-rust-tauri

  # Structure audit on push — same gates as `pr-quality-structure`. Cheap to
  # re-run; catches the case where a force-push or merge bypasses the PR gate.
  ci-structure:
    if: github.event_name == 'push'
    name: CI — Structure audit
    uses: ./.github/workflows/_structure.yml
    permissions:
      contents: read

  # ── E2E Desktop ─────────────────────────────────────────────────────────────

  # E2E Desktop (PR) — optional: add label ci:e2e-desktop to the PR
  e2e-desktop-pr:
    name: E2E Desktop (PR) — ubuntu-24.04
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:e2e-desktop') && needs.filter.outputs.ui == 'true'
    needs: [filter, pr-quality-ts, pr-quality-rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Setup Rust + Tauri (install only, no checks)
        uses: ./.github/actions/setup-rust-tauri
        with:
          run-checks: "false"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build Tauri app
        run: cd packages/ui && bunx tauri build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E desktop tests
        shell: bash
        run: |
          mkdir -p junit-reports
          bun test packages/ui/test/e2e/ --reporter=junit --reporter-outfile=junit-reports/junit-e2e-desktop.xml
        env:
          CI: "true"

      - name: JUnit test report (E2E desktop)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: E2E desktop (PR)
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  # E2E Desktop (Playwright + Tauri WebDriver) — full OS matrix, on a push to main that changed
  # `packages/ui/` (Rust included), and nightly. It used to run on EVERY push: three Tauri builds
  # plus Playwright, 6-15 min each (Windows ~15), on commits that never touched the desktop app,
  # holding macOS/Windows runner slots the PR legs queue for. The nightly run catches anything
  # outside `packages/ui/` that breaks it, within a day.
  e2e-desktop:
    # `!cancelled()` plus explicit results, so the NIGHTLY run depends on `ci-rust` alone: without
    # it, a failed `filter` (which only exists to pick UI pushes) would skip the nightly silently.
    if: >-
      !cancelled()
      && needs.ci-rust.result == 'success'
      && (github.event_name == 'schedule'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.filter.result == 'success' && needs.filter.outputs.ui == 'true'))
    # `ci-ts` is the whole _test-suite.yml (once 30 jobs incl. 24 coverage
    # shards; the shards are gone, the push matrix is still the slowest thing in
    # the run), and `needs:` on a reusable-workflow caller waits for ALL of it —
    # measured at 33.4min median DAG wait. E2E consumes no artifact from it: it does its
    # own checkout, install and Tauri setup. `ci-rust` (1.17-1.72min) is the
    # prerequisite that carries meaning: a broken Tauri build makes E2E
    # unrunnable.
    #
    # Dropping `ci-ts` means E2E now runs even when the TS suite fails on a
    # `main` push — an accepted cost, not an oversight: it's cheaper than a
    # duplicate typecheck job on every push, and measured data shows it's rare.
    # See the P4b progress log in docs/infrastructure-roadmap.md ("A
    # TS-failing, Rust-passing `main` commit burns E2E runners") for the
    # numbers and the revisit trigger.
    needs: [filter, ci-rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    name: E2E Desktop — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Setup Rust + Tauri (install only, no checks)
        uses: ./.github/actions/setup-rust-tauri
        with:
          run-checks: "false"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build Tauri app
        run: cd packages/ui && bunx tauri build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E desktop tests
        shell: bash
        run: |
          mkdir -p junit-reports
          bun test packages/ui/test/e2e/ --reporter=junit --reporter-outfile=junit-reports/junit-e2e-desktop.xml
        env:
          CI: "true"

      - name: JUnit test report (E2E desktop)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0 (Node 24)
        if: always()
        with:
          token: ${{ secrets.NIMBUS_CHECKS_TOKEN || github.token }}
          name: E2E desktop (${{ matrix.os }})
          path: junit-reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
