# THROWAWAY, never merged. The published release on a stock runner.
name: spike-linux-forwarder
on:
  push:
    branches: [dev/asaf/linux-forwarder-spike]
permissions:
  contents: read
jobs:
  release-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (Node 24 runtime)
        with:
          bun-version: "1.4"
      - name: Install the published deb
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          curl -fsSL -o n.deb https://github.com/nimbus-agent/Nimbus/releases/download/v10.11.1/nimbus-headless_10.11.1_amd64.deb
          sudo apt-get install -y -qq ./n.deb 2>&1 | grep -E "AppArmor|Setting up nimbus|WARNING" || true
          ls -l /etc/apparmor.d/nimbus-bwrap
      - name: Doctor
        run: |
          nimbus doctor 2>&1 | grep -E "Sandbox|nimbus " || true
      - name: Real connectors
        run: bun spike/release-proof.ts
