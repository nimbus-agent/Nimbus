# THROWAWAY, never merged. The published release on a stock runner.
name: spike-linux-forwarder
on:
  push:
    branches: [dev/asaf/linux-forwarder-spike]
permissions:
  contents: read
jobs:
  release-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (Node 24 runtime)
        with:
          bun-version: "1.4"
      - name: Prepare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap gcc libc6-dev
          gcc -O1 -Wall -o spike-launcher spike/launcher.c
          sudo cp spike-launcher /usr/local/bin/spike-launcher
          sudo cp "$(which bun)" /usr/local/bin/bun-spike
          sudo chmod 755 /usr/local/bin/spike-launcher /usr/local/bin/bun-spike
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile nimbus-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/nimbus-bwrap > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/nimbus-bwrap
          id -u
      - name: Variant D
        run: /usr/local/bin/bun-spike spike/host.ts
