# THROWAWAY, never merged. Names the syscall behind the forwarder's seccomp kill on real Ubuntu.
name: spike-linux-forwarder
on:
  push:
    branches: [dev/asaf/linux-forwarder-spike]
permissions:
  contents: read
jobs:
  seccomp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (Node 24 runtime)
        with:
          bun-version: "1.4"
      - name: Prepare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap strace gcc libc6-dev
          gcc -O1 -Wall -o spike-launcher spike/launcher.c
          sudo cp spike-launcher /usr/local/bin/spike-launcher
          sudo cp "$(which bun)" /usr/local/bin/bun
          sudo chmod 755 /usr/local/bin/spike-launcher /usr/local/bin/bun
          sudo ln -s "$PWD" /repo
          sudo ln -s "$PWD/spike" /fw
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile nimbus-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/nimbus-bwrap > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/nimbus-bwrap
          ldd --version | head -1
          cat /etc/resolv.conf | grep -v '^#'
      - name: "Resolver"
        run: |
          set +e
          ls -l /etc/resolv.conf
          readlink -f /etc/resolv.conf
          grep -E '^hosts' /etc/nsswitch.conf
          echo "--- inside today's argv, no /run bind"
          bwrap --unshare-user --share-net --ro-bind /usr /usr --ro-bind /etc /etc --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev /usr/bin/sh -c 'ls -l /etc/resolv.conf; cat /etc/resolv.conf | head -3; echo "cat exit $?"; ls /run 2>&1 | head -3'
          echo "--- who listens on 53"
          sudo ss -lntup | grep -E ':53\b'
          echo "--- with the stub symlink forced, on a fresh file, no /run bind"
          sudo cp -P /etc/resolv.conf /tmp/resolv.bak
          sudo ln -sf ../run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          ls -l /etc/resolv.conf
          cat > /tmp/l.ts <<'EOF'
          const { lookup } = await import("node:dns/promises");
          console.log(await lookup("nimbus-sandbox-check.invalid").then(() => "RESOLVED", (e) => e.code));
          console.log(await lookup("api.github.com").then((r) => "api.github.com " + r.address, (e) => e.code));
          process.exit(0);
          EOF
          mkdir -p /tmp/cw; cp /tmp/l.ts /tmp/cw/l.ts
          bwrap --unshare-user --share-net --ro-bind /usr /usr --ro-bind /etc /etc --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp --bind /tmp/cw /tmp/cw /usr/local/bin/bun --no-env-file /tmp/cw/l.ts; echo "no /run bind exit $?"
          bwrap --unshare-user --share-net --ro-bind /usr /usr --ro-bind /etc /etc --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp --bind /tmp/cw /tmp/cw --ro-bind /run/systemd/resolve/stub-resolv.conf /run/systemd/resolve/stub-resolv.conf /usr/local/bin/bun --no-env-file /tmp/cw/l.ts; echo "file bound exit $?"
          sudo cp -P /tmp/resolv.bak /etc/resolv.conf
