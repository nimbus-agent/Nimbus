name: Dependabot shepherd

# Walks every open Dependabot PR against `main`: replaces the description with a
# parse-safe summary, and enables auto-merge (= enqueue, with the merge queue on)
# when every bump is non-breaking. Majors are left for a human. The decisions live
# in `scripts/dependabot/shepherd.ts`; this file only schedules and authenticates it.
#
# Scheduled, deliberately NOT `on: pull_request` — see the header of shepherd.ts:
# a Dependabot-triggered run cannot read the release-bot App secrets, and a merge
# enabled under GITHUB_TOKEN would land on `main` without triggering its `push`
# workflows (CI, release-please, Security). Hourly is fast enough: Dependabot opens
# its PRs weekly, and a PR still needs its ~40-minute gate before it can merge.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without writing anything"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Two overlapping runs would race on the same PRs; the later one just waits.
  group: dependabot-shepherd
  cancel-in-progress: false

jobs:
  shepherd:
    name: Shepherd Dependabot PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # `main`'s own scripts. No PR code is ever checked out or run: the shepherd
      # reads PR metadata through the API and writes a description + an
      # auto-merge request, nothing else.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3'
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: Nimbus
          # Editing a PR description and enabling auto-merge need exactly these
          # two; nothing else is requested.
          permission-contents: write
          permission-pull-requests: write
      - name: Shepherd
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: bun scripts/dependabot/shepherd.ts ${DRY_RUN}
