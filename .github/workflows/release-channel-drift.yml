name: Release channel drift

# Does every download channel actually serve the version we published?
#
# This ran weekly inside `org-drift-sweep.yml` until 2026-08-09. That cadence was
# how winget sat at 1.19.1 for six days across seven releases: the break began on
# a Tuesday, one day after the last sweep, and the next scheduled look was six
# days out. `publish-package-managers.yml` now files an issue the moment a publish
# FAILS, which is faster than any poll — but it cannot see the other half of the
# problem, where our publish job goes green and the channel still does not serve
# the version. A winget PR that Microsoft's validation closes unmerged looks
# exactly like success from here. That is what this daily read catches.
#
# Every read is public (our releases + manifest, the channel repos,
# microsoft/winget-pkgs), so `github.token` suffices — no App token, no PAT.
on:
  schedule:
    # 07:00 UTC daily — a break is at most ~24h old when it surfaces, not ~7d.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: release-channel-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staleness:
    name: release-staleness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # `continue-on-error` is NOT swallowing the failure — the findings are
      # captured and become the issue body below, and the job still ends red via
      # the final gate step. A bare red job is precisely the signal that went
      # unread nine times; the issue is what a human actually sees.
      - name: Audit release-train staleness
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun scripts/structure-audit/check-release-staleness.ts --strict > findings.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat findings.txt

      - name: File a release-health issue
        if: ${{ steps.audit.outputs.code != '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_KEY: release-channel-drift
          HEALTH_TITLE: "🚨 A release channel is not serving the published version"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "\`audit:release-staleness\` found a channel behind the published version. Until it clears, users of that channel install an older Nimbus than the release notes claim."
            echo
            echo '```'
            cat findings.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > body.md
          HEALTH_BODY="$(cat body.md)" bun scripts/release/open-health-issue.ts

      - name: Close the release-health issue, if any
        if: ${{ steps.audit.outputs.code == '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_KEY: release-channel-drift
          HEALTH_RESOLVE: "1"
          HEALTH_BODY: "Resolved: every channel now serves the published version. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bun scripts/release/open-health-issue.ts

      # The audit's own verdict decides the job's colour, after the issue exists.
      - name: Fail if the audit found drift
        if: ${{ steps.audit.outputs.code != '0' }}
        run: |
          echo "::error::release-staleness reported drift — see the release-health issue"
          exit 1

  # Does the trust-feed snapshot baked into the release still match the live Nimbus trust feed?
  # (marketplace trust layer PR 5). A stale snapshot is not a security failure, since every gateway
  # fetches the feed hourly, but it lowers the offline floor a fresh install starts from. So the
  # comparison runs here, daily, and files an issue; the offline half of the same audit gates PRs.
  # Fix: the `trust:refresh-snapshot` package script, then a PR with the regenerated module.
  trust-snapshot:
    name: trust-snapshot-staleness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The audit imports registry-format and the gateway's trust-feed module, so it needs the
      # workspace dependencies, installed with CI's own Bun (not `latest`, which can disagree with
      # the frozen lockfile).
      - name: Setup Bun + install
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      # Same shape as the staleness job: the finding becomes the issue body, and the final step
      # decides the job's colour.
      - name: Compare the baked snapshot with the live trust feed
        id: audit
        continue-on-error: true
        run: |
          set +e
          bun scripts/trust/check-trust-snapshot.ts --live > findings.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat findings.txt

      - name: File a trust-snapshot issue
        if: ${{ steps.audit.outputs.code != '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_KEY: trust-snapshot-stale
          HEALTH_TITLE: "🚨 The baked trust-feed snapshot does not match the live trust feed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "\`audit:trust-snapshot --live\` found the snapshot baked into the next release out of step with the live trust feed. If the live feed is AHEAD, refresh the snapshot with the \`trust:refresh-snapshot\` package script and open a PR before the next release. If it went BACKWARDS or differs at the same sequence, that is an integrity problem, not staleness: every gateway refuses that feed, the refresh script refuses it too, and the nimbus-trust gh-pages history needs investigating."
            echo
            echo '```'
            cat findings.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > body.md
          HEALTH_BODY="$(cat body.md)" bun scripts/release/open-health-issue.ts

      - name: Close the trust-snapshot issue, if any
        if: ${{ steps.audit.outputs.code == '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEALTH_KEY: trust-snapshot-stale
          HEALTH_RESOLVE: "1"
          HEALTH_BODY: "Resolved: the baked snapshot matches the live trust feed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bun scripts/release/open-health-issue.ts

      - name: Fail if the snapshot is out of step
        if: ${{ steps.audit.outputs.code != '0' }}
        run: |
          echo "::error::audit:trust-snapshot --live failed — see the trust-snapshot issue"
          exit 1
