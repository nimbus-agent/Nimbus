name: Publish Linux repo

# Triggered by the Release workflow COMPLETING — not the `release: released`
# event. release-please publishes the (empty) GitHub Release the instant the
# release PR merges, which fires `released` ~18 min before release.yml finishes
# building + attaching SHA256SUMS/.deb/.rpm. Keying off `released` therefore
# always raced an asset-less release ("no assets to download"). `workflow_run`
# fires only after release.yml has uploaded every asset.
#
# The job `if` gates on: the Release run SUCCEEDED, the ref is a `v*` tag (so
# sdk-*/client-* releases — which never build installers and don't trigger
# release.yml anyway — are doubly excluded), and the tag is NON-prerelease (no
# `-`, matching the old "released only fires for stable" behavior).
#
# `workflow_dispatch` lets a maintainer re-publish a tag if a run failed
# transiently — re-running is safe (it republishes the same inputs; signature
# timestamps mean a re-run lands a fresh commit, not a no-op).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. v0.5.0)"
        required: true
        type: string

#
# TWO DEPLOY MODES, chosen by the repo variable NIMBUS_LINUX_REPO_DEPLOY:
#
#   unset or "git"  commit the packages into linux-repo and let its legacy Pages build serve them.
#                   Every release adds ~138 MiB to that repo's history, which is already 14.7 GiB
#                   against GitHub's recommended 1 GB, and no package can pass 100 MiB.
#   "actions"       build the tree from nothing but release assets, attach it to a `site-*` release
#                   on linux-repo, and dispatch linux-repo's deploy-site.yml, which serves it with a
#                   custom Actions deploy. Nothing enters Git, and no Git file limit applies.
#
# The variable is what makes this switchable and reversible without a code change. Runbook and
# rollback: docs/ci-secrets.md § linux-repo deploy.

permissions:
  contents: read

jobs:
  publish-linux-repo:
    name: Build + publish apt/yum repo
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # One publish at a time across EVERY tag, not per tag. Per tag, two releases close together
    # raced: in Git mode the loser failed at push, and in Actions mode an older one could replace a
    # newer one. At job level so that a run this job's `if` skips never takes the slot. GitHub keeps
    # one run waiting and cancels an older waiting one; the newest release is the one that matters.
    concurrency:
      group: publish-linux-repo
      cancel-in-progress: false
    # Stable `v*` tags whose Release build succeeded (or a manual re-run). See the
    # `on:` header for why this replaces the `release: released` trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check the deploy mode
        env:
          DEPLOY_MODE: ${{ vars.NIMBUS_LINUX_REPO_DEPLOY }}
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in
            "" | git | actions) echo "deploy mode: ${DEPLOY_MODE:-git}" ;;
            *)
              echo "::error::NIMBUS_LINUX_REPO_DEPLOY must be unset, git or actions, got: ${DEPLOY_MODE}"
              exit 1
              ;;
          esac

      - name: Checkout Nimbus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the default branch; check out the released
          # tag's tree instead (head_sha = the commit release.yml built from).
          # Manual dispatch falls back to the tag input.
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag_name }}
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci
        with:
          verify-lock: "false"

      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: nimbus-agent
          repositories: linux-repo
          permission-contents: write

      # Fail fast with actionable messages if any required secret is missing.
      - name: Require publish + signing secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ] || [ -z "${GPG_PASSPHRASE}" ]; then
            echo "::error::GPG_SIGNING_SUBKEY and/or GPG_PASSPHRASE are not set. They sign the apt Release + yum repomd (same secrets release.yml already uses)."
            exit 1
          fi

      - name: Install reprepro + createrepo_c
        run: |
          set -euo pipefail
          # Drop the GHA runner's preinstalled Microsoft apt repos (azure-cli + prod);
          # they periodically 403 and fail `apt-get update` wholesale. Not needed here.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro createrepo-c

      - name: Download released .deb + .rpm + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out \
            --pattern SHA256SUMS \
            --pattern "nimbus-headless_${VERSION}_amd64.deb" \
            --pattern "nimbus-headless-${VERSION}-x86_64.rpm"

      - name: Resolve + verify artifact checksums
        id: art
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          bun scripts/release/linux-repo-config.ts \
            --version "$VERSION" \
            --sha256sums out/SHA256SUMS \
            --base-url "https://nimbus-agent.github.io/linux-repo" \
            --distributions-out staging/apt/conf/distributions \
            --repo-file-out staging/nimbus.repo
          # Verify the downloaded artifacts match SHA256SUMS before publishing.
          # Match ONLY the two files we downloaded (the .deb + .rpm), anchored to
          # end-of-line so the `.asc` lines are excluded: SHA256SUMS lists every
          # release asset (.msi/.pkg/tarballs/AppImage/...), and a broad grep would
          # make `sha256sum -c` fail on the assets this job never fetches.
          ( cd out && sha256sum -c <(grep -E "(nimbus-headless_${VERSION}_amd64\.deb|nimbus-headless-${VERSION}-x86_64\.rpm)\$" SHA256SUMS) )

      - name: Import GPG signing key (ephemeral GNUPGHOME)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
        run: |
          set -euo pipefail
          # `export` so THIS step's `gpg --import` lands in the ephemeral home;
          # GITHUB_ENV then propagates the same path to the later sign/export steps.
          # (Without export, the import would use the default ~/.gnupg and the sign
          # step — which reads GNUPGHOME from GITHUB_ENV — would find no secret key.)
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Clone the linux-repo Pages repo
        if: vars.NIMBUS_LINUX_REPO_DEPLOY != 'actions'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/nimbus-agent/linux-repo.git" repo

      - name: Start from an empty tree
        if: vars.NIMBUS_LINUX_REPO_DEPLOY == 'actions'
        run: mkdir repo

      - name: Build the apt repo (reprepro) + the yum repo (createrepo_c)
        env:
          DEPLOY_MODE: ${{ vars.NIMBUS_LINUX_REPO_DEPLOY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
          # Optional override for the retention count; unset falls back to
          # DEFAULT_RETAINED_RELEASES in scripts/release/linux-repo-config.ts.
          # An unset repo variable expands to "" and means "default"; a value
          # that is not an integer FAILS the publish rather than quietly pruning
          # with a retention nobody chose.
          NIMBUS_LINUX_REPO_RETAIN: ${{ vars.NIMBUS_LINUX_REPO_RETAIN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DEB="$PWD/out/nimbus-headless_${VERSION}_amd64.deb"
          RPM="$PWD/out/nimbus-headless-${VERSION}-x86_64.rpm"

          # --- apt (reprepro) ---
          mkdir -p repo/apt/conf
          cp staging/apt/conf/distributions repo/apt/conf/distributions
          # Drop any prior version first so re-running a tag (or bumping) never
          # trips reprepro's "already registered" guard. Tolerate "not present".
          # This is also apt's retention: reprepro garbage-collects the pool file
          # the removal left unreferenced, so apt/ holds only the newest release.
          reprepro -b repo/apt remove stable nimbus-headless 2>/dev/null || true
          reprepro -b repo/apt includedeb stable "$DEB"

          # --- yum (createrepo_c) ---
          # ORDER IS LOAD-BEARING, and these three commands must stay in this
          # order inside THIS step (`set -e` aborts the whole publish if any of
          # them fails, before the later commit/push step can run):
          #   1. stage the new RPM
          #   2. prune old RPMs        <- deletes packages only, never metadata
          #   3. createrepo_c          <- (re)builds metadata from what is left
          # Generating metadata last is what makes the two halves of the danger
          # impossible: the repodata is derived from the post-prune directory, so
          # it cannot reference a deleted RPM, and nothing deletes anything after
          # it is written, so no RPM it references can vanish. A prune that left
          # stale repodata behind would break `yum install` outright — worse than
          # the oversized channel this prune exists to fix.
          mkdir -p repo/yum
          cp "$RPM" repo/yum/
          # An empty tree has no earlier RPMs to retain, so fetch them. The prune below still
          # decides what stays.
          if [ "$DEPLOY_MODE" = "actions" ]; then
            bun scripts/release/linux-repo-config.ts --stage-yum-rpms repo/yum --version "$VERSION"
          fi
          bun scripts/release/linux-repo-config.ts --prune-yum repo/yum --version "$VERSION"
          # Full regeneration, NOT `--update`: `--update` treats the existing
          # repodata as a cache, and after a delete we want the metadata built
          # from nothing but the current directory listing. Re-checksumming a
          # handful of retained RPMs costs seconds.
          createrepo_c repo/yum

      - name: Sign apt Release + yum repomd (loopback gpg)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          REL="repo/apt/dists/stable/Release"
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback \
            --detach-sign --armor -o "${REL}.gpg" "$REL"
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback \
            --clearsign -o "repo/apt/dists/stable/InRelease" "$REL"
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback \
            --detach-sign --armor "repo/yum/repodata/repomd.xml"

      - name: Write the public key, client .repo, and .nojekyll
        run: |
          set -euo pipefail
          gpg --batch --armor --export > repo/gpg.key
          cp staging/nimbus.repo repo/nimbus.repo
          # Disable Jekyll so Pages serves the apt/yum trees verbatim.
          touch repo/.nojekyll

      # DELIBERATELY still `git commit` + `git push`, unlike the brew/scoop publisher.
      #
      # Those two moved to the GraphQL `createCommitOnBranch` mutation so their
      # commits come out Verified (see publish-package-managers.yml). That mutation
      # sends the ENTIRE commit as one base64 JSON request body, which is fine for a
      # 1 KB formula and unworkable here: every publish adds a fresh .deb AND .rpm —
      # each bundling both Bun-compiled binaries — plus regenerated apt/yum metadata,
      # and base64 inflates that by a further ~4/3. It would fail at the API's request
      # ceiling, not at anything we could tune.
      #
      # CONSEQUENCE FOR THE RULESET WORK: commits here stay unsigned, so
      # `required_signatures` must NOT be added to the linux-repo ruleset — it would
      # break the next apt/yum publish outright. Making these Verified needs a
      # different mechanism (e.g. bot-side commit signing), tracked separately.
      - name: Commit + push to linux-repo
        if: vars.NIMBUS_LINUX_REPO_DEPLOY != 'actions'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          cd repo
          git config user.name "nimbus-release-bot"
          git config user.email "release-bot@nimbus-agent.invalid"
          # Stage first: first-publish files are untracked, and `git diff`
          # ignores untracked files — staging then diffing --cached makes the
          # no-op check see new files too.
          git add -A
          if git diff --cached --quiet; then echo "no repo change"; exit 0; fi
          git commit -m "nimbus ${TAG#v}"
          git push

      # A release asset and a repository_dispatch, because both need only the Contents permission the
      # bot already has on linux-repo. An Actions artifact would need `actions` on both repos and the
      # bot's private key in linux-repo, which credential-registry.ts keeps out of it on purpose.
      # The run id makes the tag unique, so re-publishing a version never collides.
      - name: Hand the tree to linux-repo
        if: vars.NIMBUS_LINUX_REPO_DEPLOY == 'actions'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          SITE_TAG="site-${TAG#v}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SITE_TAG=$SITE_TAG" >> "$GITHUB_ENV"
          # What the wait below reads. Unique to this run, unlike a version, which the switch to this
          # mode and any re-publish find already served before their own deploy has happened.
          printf '%s\n' "$SITE_TAG" > repo/site-id.txt
          tar -C repo -cf site.tar .
          gh release create "$SITE_TAG" site.tar \
            --repo nimbus-agent/linux-repo --target main --prerelease --latest=false \
            --title "$SITE_TAG" --notes "The Pages site for nimbus ${TAG#v}. Not a Nimbus release."
          gh api -X POST repos/nimbus-agent/linux-repo/dispatches \
            -f event_type=deploy-site -f "client_payload[site_tag]=$SITE_TAG"

      # linux-repo's run is not this run, so its failure would reach nobody. Reading what is served
      # catches that, and anything else between here and a user. A failure here opens the issue below.
      - name: Wait until Pages serves this release
        if: vars.NIMBUS_LINUX_REPO_DEPLOY == 'actions'
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          BASE="https://nimbus-agent.github.io/linux-repo"
          for _ in $(seq 1 40); do
            served=$(curl -fsS "$BASE/site-id.txt?v=$GITHUB_RUN_ID-$RANDOM" 2>/dev/null || true)
            if [ "$served" = "$SITE_TAG" ]; then
              echo "Pages serves $SITE_TAG (nimbus ${TAG#v})"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Pages did not serve $SITE_TAG within 10 minutes. See deploy-site.yml in nimbus-agent/linux-repo."
          exit 1

      # Three, so an earlier tree stays one dispatch away. Failing to prune costs only storage.
      - name: Prune old site releases
        if: vars.NIMBUS_LINUX_REPO_DEPLOY == 'actions'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release list --repo nimbus-agent/linux-repo --limit 50 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("site-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r old; do
                gh release delete "$old" --repo nimbus-agent/linux-repo --cleanup-tag --yes
              done

  # A red run here reaches nobody: the Release and its smoke test stay green, because they read the
  # release assets and not this repo. apt and dnf users stayed on 9.2.1 through 13 failed runs that way.
  publish-health-alert:
    name: Report publish failures in an issue
    needs: publish-linux-repo
    if: always() && needs.publish-linux-repo.result != 'skipped'
    # One at a time, for the same reason as Security's alert: two runs could both find no issue and
    # open one each.
    concurrency:
      group: publish-linux-repo-health-alert
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag_name }}
          RESULT: ${{ needs.publish-linux-repo.result }}
        run: |
          set -euo pipefail
          title="The apt and dnf repo is not publishing"
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)

          if [[ "$RESULT" == "success" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" --repo "$REPO" --comment "Published ${TAG}: ${RUN_URL}"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "Still failing at ${TAG} (${RESULT}): ${RUN_URL}"
          else
            body="Publishing ${TAG} to \`nimbus-agent/linux-repo\` ended in **${RESULT}**: ${RUN_URL}

          apt and dnf users stay on the last version that published until this is fixed. GitHub refuses a file over 100 MiB in that repository, so check the package sizes first.

          This issue closes itself on the next successful publish."
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
