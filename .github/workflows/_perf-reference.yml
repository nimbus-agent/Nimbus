name: Performance Reference Run (M1 Air)

# Triggers (spec §4.2 + design D-T):
#
#   workflow_dispatch — manual. Operator triggers from the Actions UI after
#     preparing the M1 Air per the §4.2 protocol checklist and explicitly
#     attests completion via the protocol_attested boolean input.
#
#   schedule — nightly unattended run at 05:00 UTC. The dedicated persistent
#     M1 Air is held in the §4.2 protocol state between runs (AC powered, Low
#     Power Mode off, display on, no background activity), so no operator
#     inputs are supplied; the attestation step treats a schedule event as
#     already-attested via its event-name branch. GitHub runs scheduled
#     workflows only on the default branch of THIS repo — never for forks or
#     fork PRs — so the nightly trigger is non-fork-triggered by construction.
#
# This workflow runs on the self-hosted runner registered with the
# `reference-m1air` label (see docs/perf/reference-runner-setup.md). It
# performs the bench, sanity-checks the resulting history.jsonl line, and
# opens a `perf`-labelled bot PR for review.

on:
  # Nightly unattended reference run. cron is 5-field UTC. The dedicated M1 Air
  # is held in the §4.2 protocol state, so no inputs are supplied; the attestation
  # step resolves the missing inputs.protocol_attested to attested for the
  # schedule event. GitHub runs schedule only on this repo's default branch —
  # never for forks/fork PRs.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      protocol_attested:
        description: "Have you completed the §4.2 reference protocol checklist? (AC powered, Low Power Mode off, fresh reboot ≥5 min, no Spotlight/Time Machine/iCloud/Messages activity, display on)"
        required: true
        type: boolean
        default: false
      notes:
        description: "Optional free-form notes (e.g., thermal state, deviations from protocol). Goes into PR body, not the history line."
        required: false
        type: string
        default: ""

# Spec §4.3 — only one reference run at a time. cancel-in-progress: false
# so a queued dispatch waits for the current run to finish rather than
# corrupting its measurements.
concurrency:
  group: bench-reference
  cancel-in-progress: false

# Default-deny at the workflow level (Scorecard `Token-Permissions`).
# The `reference-run` job grants the specific scopes it needs (contents:
# write to push the perf branch, pull-requests: write for `gh pr create`).
permissions: {}

jobs:
  reference-run:
    name: Reference benchmark run (M1 Air)
    runs-on: [self-hosted, macOS, ARM64, reference-m1air]
    # 3 runs × ~15 min worst-case + setup overhead. Reference protocol
    # explicitly forbids parallelism, so this is a wall-clock budget.
    timeout-minutes: 60
    permissions:
      contents: write       # branch push
      pull-requests: write  # gh pr create
    env:
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}

    steps:
      - name: Validate protocol attestation
        # Manual dispatch must explicitly attest the §4.2 checklist via
        # protocol_attested=true. A scheduled run is implicitly attested —
        # the dedicated M1 Air is held in the protocol state between runs,
        # and schedule events carry no workflow_dispatch inputs (GitHub does
        # not apply input defaults to schedule events). schedule only fires
        # on this repo's default branch, never for forks/fork PRs.
        if: github.event_name != 'schedule' && inputs.protocol_attested != true
        run: |
          echo "::error::Reference run requires §4.2 protocol attestation."
          echo "Re-dispatch with protocol_attested=true after completing the checklist."
          echo "See docs/perf/reference-runner-setup.md and spec §4.2."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0           # we read git history (HEAD:docs/perf/history.jsonl)
          persist-credentials: true # we push back to the same repo

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Run reference benchmark (3 runs, all surfaces)
        # Direct bench-runner.ts invocation matches the existing _perf.yml
        # pattern. No separate `bun run build` step needed — the bench
        # harness runs against TS source via Bun.
        run: |
          set -euo pipefail
          bun packages/gateway/src/perf/bench-runner.ts \
            --all \
            --reference \
            --runs 3 \
            --protocol-confirmed \
            --history "${{ github.workspace }}/docs/perf/history.jsonl"

      # ── Bencher Cloud advisory reference-trend ingest (perf strategy Phase 2)
      # Dormant until the self-hosted reference-m1air runner is provisioned (this
      # workflow only runs then). Advisory; skips when BENCHER_API_KEY is unset.
      - name: Install Bencher CLI
        if: ${{ env.BENCHER_API_KEY != '' }}
        continue-on-error: true # advisory: an install hiccup must never red the reference run
        uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12

      - name: Emit Bencher BMF (reference)
        id: bencher-emit
        if: ${{ env.BENCHER_API_KEY != '' }}
        continue-on-error: true # advisory: a BMF-emit failure must never red the reference run
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/perf/emit-bencher-bmf.ts \
            --in "${{ github.workspace }}/docs/perf/history.jsonl" \
            --out "${RUNNER_TEMP}/bencher.json"
          # `|| echo 0` keeps a malformed/garbage BMF from tripping pipefail.
          surfaces="$(jq 'length' "${RUNNER_TEMP}/bencher.json" 2>/dev/null || echo 0)"
          echo "surfaces=${surfaces}" >> "$GITHUB_OUTPUT"

      - name: Publish to Bencher (reference)
        if: ${{ steps.bencher-emit.outputs.surfaces != '' && steps.bencher-emit.outputs.surfaces != '0' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bencher run \
            --project nimbus \
            --key "${BENCHER_API_KEY}" \
            --adapter json \
            --file "${RUNNER_TEMP}/bencher.json" \
            --testbed reference-m1air \
            --branch main

      - name: Derive latest.json projection
        # Reads the new tail of history.jsonl, finds the most recent
        # complete reference-m1air line, writes it verbatim to
        # packages/docs/public/perf/latest.json. If the new tail is itself
        # incomplete, the script walks past it; latest.json is then
        # rewritten with the same content already on disk and git sees no
        # change. Sub-project D Phase 2, spec §5.
        shell: bash
        run: |
          set -euo pipefail
          bun packages/gateway/src/perf/derive-latest-json.ts \
            --history "${{ github.workspace }}/docs/perf/history.jsonl" \
            --output  "${{ github.workspace }}/packages/docs/public/perf/latest.json"

      - name: Sanity-check history.jsonl + latest.json diff
        id: sanity
        shell: bash
        run: |
          set -euo pipefail

          # Sub-project D Phase 2 spec §5.2 — the diff must contain
          # docs/perf/history.jsonl plus EITHER packages/docs/public/perf/latest.json
          # (new-tail-complete case) OR nothing else (new-tail-incomplete case).
          # Determine which case we're in by inspecting the new tail.
          # Capture the raw line first so a jq parse failure can produce a
          # proper GHA error annotation rather than letting `set -e` kill
          # the step with only jq's raw stderr.
          raw_tail=$(tail -n 1 docs/perf/history.jsonl)
          new_tail_incomplete=$(echo "$raw_tail" | jq -r '(.incomplete == true)' 2>/dev/null) || {
            echo "::error::history.jsonl last line is not valid JSON:"
            echo "$raw_tail"
            exit 1
          }
          if [[ "$new_tail_incomplete" != "true" && "$new_tail_incomplete" != "false" ]]; then
            # jq parsed valid JSON, but the comparison produced something other than
            # a boolean — e.g., the JSON was a non-object (array, number, string).
            echo "::error::history.jsonl last line is valid JSON but not an object:"
            echo "$raw_tail"
            exit 1
          fi

          # 1. Exactly the right files modified, given the case.
          # `git diff --name-only HEAD` reports only TRACKED file changes
          # relative to the last commit. We use this rather than
          # `git status --porcelain` because the self-hosted M1 Air
          # runner is persistent — untracked files from previous runs
          # (temp dirs, build artifacts) would otherwise leak into
          # `changed` and fail the set comparison spuriously.
          changed=$(git diff --name-only HEAD | sort)
          if [[ "$new_tail_incomplete" == "true" ]]; then
            expected=$(printf 'docs/perf/history.jsonl\n' | sort)
          else
            expected=$(printf 'docs/perf/history.jsonl\npackages/docs/public/perf/latest.json\n' | sort)
          fi
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected changed files (new_tail_incomplete=$new_tail_incomplete)."
            echo "expected:"
            echo "$expected"
            echo "got:"
            echo "$changed"
            exit 1
          fi

          # 2. history.jsonl: exactly one line added.
          before=$(git show HEAD:docs/perf/history.jsonl 2>/dev/null | wc -l || echo 0)
          after=$(wc -l < docs/perf/history.jsonl)
          if [[ "$((after - before))" != "1" ]]; then
            echo "::error::Expected +1 line in history.jsonl; got delta $((after - before))"
            exit 1
          fi

          # 3. When the new tail is complete: latest.json semantically equals the
          #    output of a fresh re-derive, AND has the expected runner/SHA/os.
          if [[ "$new_tail_incomplete" == "false" ]]; then
            expected_json="${RUNNER_TEMP}/latest.json.expected"
            bun packages/gateway/src/perf/derive-latest-json.ts \
              --history docs/perf/history.jsonl \
              --output  "$expected_json"
            actual_canon=$(jq -S . packages/docs/public/perf/latest.json)
            expected_canon=$(jq -S . "$expected_json")
            if [[ "$actual_canon" != "$expected_canon" ]]; then
              echo "::error::latest.json does not match the projection of the current history.jsonl."
              diff <(echo "$expected_canon") <(echo "$actual_canon") || true
              exit 1
            fi
            jq -e \
              --arg sha "$GITHUB_SHA" \
              '.schema_version == 2
               and .runner == "reference-m1air"
               and .nimbus_git_sha == $sha
               and (.os_version | type == "string" and length > 0)' \
              packages/docs/public/perf/latest.json >/dev/null || {
                echo "::error::latest.json failed sanity assertions:"
                cat packages/docs/public/perf/latest.json
                exit 1
              }
          else
            # Incomplete-tail case: confirm history.jsonl tail still has the
            # expected runner + SHA. (latest.json is unchanged — its content is
            # whatever the previous reference run committed.)
            tail -n 1 docs/perf/history.jsonl | jq -e \
              --arg sha "$GITHUB_SHA" \
              '.runner == "reference-m1air"
               and .nimbus_git_sha == $sha
               and (.os_version | type == "string" and length > 0)' \
              >/dev/null || {
                echo "::error::history.jsonl last line failed validation:"
                tail -n 1 docs/perf/history.jsonl
                exit 1
              }
          fi

          echo "branch=perf/reference-run-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "new_tail_incomplete=$new_tail_incomplete" >> "$GITHUB_OUTPUT"

      - name: Commit and push branch
        env:
          BRANCH: ${{ steps.sanity.outputs.branch }}
          NEW_TAIL_INCOMPLETE: ${{ steps.sanity.outputs.new_tail_incomplete }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pre-check: branch must not already exist on origin. If it does,
          # the operator is likely re-dispatching after a partial failure;
          # tell them exactly what to do rather than failing with a
          # cryptic git push rejection.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin. If re-running after a partial failure, delete it first:"
            echo "  git push origin --delete $BRANCH"
            echo "Or wait until tomorrow for a fresh branch name."
            exit 1
          fi
          git checkout -b "$BRANCH"
          # Stage history.jsonl always; stage latest.json only when the new
          # tail was complete (otherwise the file is unchanged on disk and
          # git add is a no-op anyway, but keeping the conditional makes
          # intent explicit).
          git add docs/perf/history.jsonl
          if [[ "$NEW_TAIL_INCOMPLETE" == "false" ]]; then
            git add packages/docs/public/perf/latest.json
          fi
          msg_suffix=""
          if [[ "$NEW_TAIL_INCOMPLETE" == "true" ]]; then
            msg_suffix=" (incomplete — latest.json unchanged)"
          fi
          git commit -m "perf: reference benchmark run $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})${msg_suffix}"
          git push origin "$BRANCH"

      - name: Open perf-labelled PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.sanity.outputs.branch }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Reference benchmark run

          - **Runner:** \`reference-m1air\` (self-hosted, M1 Air, 8 GB / 256 GB)
          - **Triggered by:** @${{ github.actor }} via ${{ github.event_name }}
          - **macOS version:** see \`os_version\` field in the new history line
          - **Notes:** ${NOTES:-_(none)_}

          ### § 4.2 Reference protocol checklist ${{ github.event_name == 'schedule' && '(nightly — runner held in §4.2 protocol state)' || '(operator attested)' }}

          - [x] AC powered
          - [x] Low Power Mode off
          - [x] Fresh reboot ≥5 min before run
          - [x] No Spotlight / Time Machine / iCloud / Messages / Bun / Docker / Xcode activity
          - [x] Display on, screensaver disabled
          - [x] macOS version recorded (auto-captured in \`os_version\`)

          ### History line + published snapshot

          One aggregated line (median across 3 runs per surface, spec §4.5) appended to \`docs/perf/history.jsonl\`. When the run is complete, \`packages/docs/public/perf/latest.json\` is also updated to mirror that line; on merge it ships to <https://nimbus-agent.dev/perf/> within ~5 minutes via the existing docs deploy. (If the run was incomplete, \`latest.json\` is left untouched per spec §5.2.)

          ### Reviewer action

          Spot-check the surface values for sanity (compare against last reference run if available). Merge to record the run as the new reference baseline. PR-C-2b will then populate \`SLO_THRESHOLDS\` workload values from this line.
          EOF
          )
          gh pr create \
            --title "perf: reference benchmark run $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --body "$body" \
            --label perf \
            --base main \
            --head "$BRANCH"
          echo "PR opened on branch $BRANCH" >> "$GITHUB_STEP_SUMMARY"
