name: Publish @nimbus-dev/client

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm provenance (sigstore signature backed by GitHub OIDC).
      # Lets consumers verify the package was built by this workflow on this commit
      # via `npm audit signatures`.
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      # Pin Node so npm CLI version is predictable for `npm publish --provenance`
      # (provenance requires npm >= 9.5; the runner default is fine, but pinning
      # avoids surprises when GitHub bumps the runner image).
      - name: Setup Node (for npm publish --provenance)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build client (dist ESM + CJS)
        run: bun run --filter @nimbus-dev/client build

      - name: Typecheck
        run: bun run --filter @nimbus-dev/client typecheck

      - name: Unit tests — client
        run: bun test packages/client
        env:
          CI: "true"

      # npm publish does NOT rewrite the workspace: protocol, so a published
      # tarball that declares `@nimbus-dev/sdk: workspace:*` is uninstallable by
      # any consumer outside this monorepo (`bun add @nimbus-dev/client` fails to
      # resolve the workspace dep). Rewrite internal workspace deps to the
      # concrete published sdk version before publishing. The committed
      # package.json keeps `workspace:*` for local monorepo development; only the
      # published tarball carries the concrete pin.
      - name: Pin internal workspace deps to concrete versions
        working-directory: packages/client
        run: |
          node -e '
            const fs = require("fs");
            let sdkVer;
            try {
              sdkVer = require("../sdk/package.json").version;
            } catch (err) {
              throw new Error("cannot read ../sdk/package.json: " + err.message);
            }
            if (typeof sdkVer !== "string" || !/^[0-9]+\.[0-9]+\.[0-9]+/.test(sdkVer)) {
              throw new Error("@nimbus-dev/sdk version is missing or not semver: " + JSON.stringify(sdkVer));
            }
            const pkg = require("./package.json");
            if (pkg.dependencies?.["@nimbus-dev/sdk"] === undefined) {
              throw new Error("client package.json has no @nimbus-dev/sdk dependency to rewrite");
            }
            pkg.dependencies["@nimbus-dev/sdk"] = "^" + sdkVer;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("rewritten @nimbus-dev/sdk ->", pkg.dependencies["@nimbus-dev/sdk"]);
          '

      # Use `npm publish --provenance` (not `bun publish`) so the published tarball
      # carries an npm provenance attestation. Bun's publish does not yet emit one.
      #
      # Migration to npm trusted publishing (token-less): once configured at
      # https://www.npmjs.com/package/@nimbus-dev/client/access (Trusted Publisher
      # for this repo + workflow), the NODE_AUTH_TOKEN env can be dropped. id-token:
      # write above is already in place.
      - name: Publish to npm with provenance
        working-directory: packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
