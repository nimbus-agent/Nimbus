# Local / CI SonarScanner configuration for SonarCloud.
# Replace the two placeholders below with values from https://sonarcloud.io → your project → Information.
# See docs/sonar-local.md for SonarLint and scanner usage.

sonar.organization=asafgolombek
# Must match the SonarCloud project key (e.g. MCP search_sonar_issues_in_projects).
sonar.projectKey=asafgolombek_Nimbus

sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8

# Source roots — `packages` covers every workspace package. `sonar.sources`
# and `sonar.tests` deliberately overlap; `sonar.test.inclusions` below
# routes test files into the tests bucket, and `sonar.exclusions` prunes
# non-source artefacts (Astro docs, dist/build, src-tauri, generated
# nimbus-*.js bundles).
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test/**/*.ts,**/test/**/*.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.astro/**,**/src-tauri/**,**/*.d.ts,**/packages/cli/src/nimbus.js,**/packages/gateway/src/nimbus-gateway.js,**/packages/mcp-connectors/*/src/nimbus-mcp-*.js,**/packages/docs/**

# Coverage — `bun test --coverage-reporter=lcov` writes coverage/lcov.info for
# the gateway / cli / sdk / client / mcp-connectors packages; Vitest writes
# packages/ui/coverage/lcov.info for the UI sub-project. Both must be listed
# so Sonar attributes coverage to every file under sonar.sources.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,packages/ui/coverage/lcov.info

# SQL migration templates are one-string-constant modules with no
# executable JS/TS lines — excluding from coverage prevents them from
# dragging the metric down. Synthetic perf-fixture trace generators and
# the bench surface drivers (`perf/surfaces/*`) run only inside the
# `nimbus bench` CLI, which is gated behind interactive protocol
# confirmation — they execute only in WS5 reference runs, not under
# `bun test`, so their coverage is structurally near-zero in CI.
#
# T2 PR 1 sandbox surface — per-OS PAL files (linux/darwin/win32/
# orphan-reap) execute only one branch per OS, so a single CI runner's
# lcov tops out near 50–60%. The sandbox-runner dispatcher and
# subprocess entry-point scripts (sandbox-wrapper, sandbox-probe) are
# structurally untestable in-process — same shape as the existing
# `packages/github-actions/*/src/main.ts` pattern. Types-only files
# (`slot.ts`, `options.ts`) and pure re-export modules (`sandbox/
# index.ts`) compile to empty runtime emit. The gateway entry
# (`gateway/src/index.ts`) is the top-level `await main()` site. The C
# helper at `src-native/sandbox-helper/` is measured by `cppcheck` on
# CI, not JS lcov.
#
# All of the above are mirrored in
# `scripts/coverage-floor/exclusions.ts`; the directional parity check
# (`bun run audit:exclusion-parity`) enforces every Sonar pattern has a
# local-registry counterpart.
sonar.coverage.exclusions=**/index/*-v[0-9]*-sql.ts,**/perf/fixtures/synthetic-*-trace.ts,**/perf/surfaces/**,packages/gateway/src/index.ts,packages/gateway/src/platform/sandbox/linux.ts,packages/gateway/src/platform/sandbox/darwin.ts,packages/gateway/src/platform/sandbox/win32.ts,packages/gateway/src/platform/sandbox/orphan-reap.ts,packages/gateway/src/platform/sandbox/sandbox-runner.ts,packages/gateway/src/platform/sandbox/sandbox-wrapper.ts,packages/gateway/src/platform/sandbox/index.ts,packages/gateway/src/connectors/lazy-mesh/slot.ts,packages/gateway/src/ipc/server/options.ts,packages/sdk/src/testing/sandbox-probe.ts,packages/gateway/src-native/**

# Synthetic trace fixtures share an intentional shape (seeded LCG +
# tier-scaled page generator); SQL migration templates are inherently
# similar (CREATE TABLE skeletons). Excluding from copy-paste detection
# avoids the duplication-density metric flagging deliberate parallelism.
sonar.cpd.exclusions=**/perf/fixtures/synthetic-*-trace.ts,**/index/*-v[0-9]*-sql.ts

# Type-aware analysis — every package has its own tsconfig. Without
# enumerating them all, only the gateway tsconfig is honoured and
# cli / ui / sdk / client / mcp-connectors fall back to type-unaware
# rules. Globs are supported per SonarCloud docs.
sonar.typescript.tsconfigPaths=packages/*/tsconfig.json,packages/mcp-connectors/*/tsconfig.json

# Block CI on the Quality Gate result. Without this, the scanner
# uploads results and exits 0 — the SonarCloud GitHub App posts a
# side-comment but the workflow check stays green even when the gate
# fails. With wait=true the scan step polls the SonarCloud API for the
# gate verdict and exits non-zero on a failure, so the
# "SonarQube Cloud analysis" step in _test-suite.yml fails the
# pr-quality-ts check (and ci-ts on push). The project uses the built-in
# "Sonar way" gate — custom gates are paywalled to Team/Enterprise plans
# as of 2026, so we accept the default. See docs/sonar-local.md.
sonar.qualitygate.wait=true
