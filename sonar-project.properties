# Local / CI SonarScanner configuration for SonarCloud.
# Replace the two placeholders below with values from https://sonarcloud.io → your project → Information.
# See docs/sonar-local.md for SonarLint and scanner usage.

sonar.organization=nimbus-agent
# Must match the SonarCloud project key (e.g. MCP search_sonar_issues_in_projects).
# Migrated 2026-06-05 from asafgolombek_Nimbus (org asafgolombek), which 404s — the
# live project is nimbus-agent_Nimbus, matching the GitHub org / VS Code publisher / docs domain.
sonar.projectKey=nimbus-agent_Nimbus

sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8

# Source roots — `packages` covers every workspace package. `sonar.sources`
# and `sonar.tests` deliberately overlap; `sonar.test.inclusions` below
# routes test files into the tests bucket, and `sonar.exclusions` prunes
# non-source artefacts (Astro docs, dist/build, src-tauri, generated
# nimbus-*.js bundles).
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test/**/*.ts,**/test/**/*.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.astro/**,**/src-tauri/**,**/*.d.ts,**/packages/cli/src/nimbus.js,**/packages/gateway/src/nimbus-gateway.js,**/packages/mcp-connectors/*/src/nimbus-mcp-*.js,**/packages/docs/**

# Coverage — `bun test --coverage-reporter=lcov` writes coverage/lcov.info for
# the gateway / cli / sdk / client / mcp-connectors packages; Vitest writes
# packages/ui/coverage/lcov.info for the UI sub-project. Both must be listed
# so Sonar attributes coverage to every file under sonar.sources.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,packages/ui/coverage/lcov.info

# SQL migration templates are one-string-constant modules with no
# executable JS/TS lines — excluding from coverage prevents them from
# dragging the metric down. Synthetic perf-fixture trace generators and
# the bench surface drivers (`perf/surfaces/*`) run only inside the
# `nimbus bench` CLI, which is gated behind interactive protocol
# confirmation — they execute only in WS5 reference runs, not under
# `bun test`, so their coverage is structurally near-zero in CI.
#
# T2 PR 1 sandbox surface — per-OS PAL files (linux/darwin/win32/
# orphan-reap) execute only one branch per OS, so a single CI runner's
# lcov tops out near 50–60%. The sandbox-runner dispatcher and
# subprocess entry-point scripts (sandbox-wrapper, sandbox-probe) are
# structurally untestable in-process — same shape as the existing
# `packages/github-actions/*/src/main.ts` pattern. Types-only files
# (`slot.ts`, `options.ts`) and pure re-export modules (`sandbox/
# index.ts`) compile to empty runtime emit. The gateway entry
# (`gateway/src/index.ts`) is the top-level `await main()` site. The C
# helper at `src-native/sandbox-helper/` is measured by `cppcheck` on
# CI, not JS lcov.
#
# `packages/mcp-connectors/*/src/server.ts` — each MCP connector's
# entry-point script ends with top-level `await mcp.connect(transport)`
# against a `StdioServerTransport`. Same structural shape as
# `github-actions/*/src/main.ts` and `sandbox-wrapper.ts` — only the
# sandbox harness (gated on `NIMBUS_TEST_HARNESS`) can run it; the
# in-process unit-test layer reaches the pure helpers (`search-filter`
# et al.) that the server.ts re-exports, never the connect() site. Each
# MCP connector PR (Snyk #386, Bitrise #387, SonarQube #408) regressed
# Sonar new-code coverage from this single file until the exclusion
# landed.
#
# All of the above are mirrored in
# `scripts/coverage-floor/exclusions.ts`; the directional parity check
# (`bun run audit:exclusion-parity`) enforces every Sonar pattern has a
# local-registry counterpart.
#
# `gateway/src/platform/assemble.ts` (boot-assembly I/O orchestrator; the
# federation glue block is inert unless `[federation].enabled` and needs a full
# subprocess boot to exercise) was already exempt in the local registry above;
# listing it here keeps Sonar new-code coverage aligned with that decision.
#
# Structurally-untestable surfaces folded in so overall coverage is measured over
# testable code (the rest of the registry already exempts these from the per-file
# floor; mirroring them here aligns the Sonar % metric):
#   - per-OS Vault PAL `vault/win32.ts` + `vault/darwin.ts` (a single Linux CI
#     runner can only execute the linux branch; the win32/darwin FFI paths are
#     structurally 0% there). `vault/linux.ts` is NOT excluded — it is the active,
#     covered branch on the CI runner.
#   - `platform/assemble-sync-registrations.ts` — boot glue (~89 hardcoded
#     `register(...)` calls) whose coverage flakes ±0.6% with which connectors the
#     boot tests spawn; same I/O-shell class as assemble.ts.
#   - the admin-console renderer
#     (`admin-console/src/**`) — an Electron host + DOM UI with no in-process
#     bun:test seam (same class as `cli/src/commands/tui.tsx`).
#   - GitHub Action entry points (`github-actions/*/src/main.ts`) + the gateway
#     build/terminate scripts — top-level-await entry shells run by `bun run`.
sonar.coverage.exclusions=**/index/*-v[0-9]*-sql.ts,**/perf/fixtures/synthetic-*-trace.ts,**/perf/surfaces/**,**/packages/mcp-connectors/*/src/server.ts,**/packages/mcp-connectors/*/src/tools.ts,**/packages/github-actions/*/src/main.ts,**/packages/admin-console/src/**,packages/gateway/src/index.ts,packages/gateway/src/platform/sandbox/linux.ts,packages/gateway/src/platform/sandbox/darwin.ts,packages/gateway/src/platform/sandbox/win32.ts,packages/gateway/src/platform/sandbox/orphan-reap.ts,packages/gateway/src/platform/sandbox/sandbox-runner.ts,packages/gateway/src/platform/sandbox/sandbox-wrapper.ts,packages/gateway/src/platform/sandbox/index.ts,packages/gateway/src/connectors/lazy-mesh/slot.ts,packages/gateway/src/ipc/server/options.ts,packages/gateway/src/ipc/agent-invoke.ts,packages/gateway/src/ipc/workflow-invoke.ts,packages/gateway/src/ipc/connector-rpc-handlers/context.ts,packages/gateway/src-native/**,packages/gateway/src/connectors/index.ts,packages/gateway/src/embedding/embedding-runtime.ts,packages/gateway/src/index/ranked-item.ts,packages/gateway/src/vault/nimbus-vault.ts,packages/gateway/src/db/query-guard-worker.ts,packages/gateway/src/embedding/embedding-worker.ts,packages/gateway/src/vault/ffi-ptr.ts,packages/gateway/src/platform/index.ts,packages/gateway/src/vault/factory.ts,packages/gateway/src/vault/win32.ts,packages/gateway/src/vault/darwin.ts,packages/gateway/src/platform/assemble-sync-registrations.ts,packages/gateway/compile-gateway.ts,packages/gateway/terminate-gateway-binary.ts,packages/cli/src/index.ts,packages/client/src/index.ts,packages/client/src/stream-events.ts,packages/gateway/src/embedding/load-feature-extraction-pipeline.ts,packages/cli/src/commands/start.ts,packages/cli/src/commands/tui.tsx,packages/cli/src/lib/gateway-process.ts,packages/cli/src/commands/repl.ts,packages/cli/src/commands/doctor.ts,packages/cli/src/commands/share.ts,packages/gateway/src/platform/assemble.ts

# Synthetic trace fixtures share an intentional shape (seeded LCG +
# tier-scaled page generator); SQL migration templates are inherently
# similar (CREATE TABLE skeletons); first-party connectors are authored from
# a shared template, so each `mcp-connectors/*/src/server.ts` (auth header +
# HTTP wrapper + the three read-tool registrations), `connectors/*-sync.ts`
# (per-connector FetchOutcome union + paged-walk skeleton), and
# `connectors/*-mapping.ts` (per-connector raw-record → IndexedItem mapper:
# the same `parseIsoMs`/`clamp`/`epochToMs` helpers + identical metadata-spread
# blocks like `...(x === null ? {} : { x })`) deliberately parallels its
# siblings. The local-FS data profiler is split across the package boundary by
# design — `mcp-connectors/dataprofile/src/profile.ts` and the gateway's
# `connectors/data-profile-mapping.ts` share the column/row-parsing logic but
# cannot import each other (gateway must not depend on a connector package), so
# the mapping-file exclusion covers that parallel pair too. Excluding from
# copy-paste detection avoids the duplication-density metric flagging deliberate
# parallelism — these files are still analyzed for bugs / smells / vulnerabilities.
#
# NOTE: connectors that must SIGN an auth token in both the gateway sync AND
# their MCP server (App Store Connect ES256, Google service-account JWT-bearer)
# do NOT need a CPD exclusion — the signer is shared via `@nimbus-dev/sdk`
# (`signAppStoreConnectJwt` / `mintGoogleAccessToken`), which both sides import,
# so there is no duplicated copy to flag.
#
# `cli/src/lib/gw-state-helpers.ts` is an intentional byte-for-byte standalone
# copy of `gateway-process.ts`. It is NOT dead duplication: command tests
# mock.module() `gateway-process.ts` process-globally (a bun mock.module leak
# that contaminates sibling test files on CI-Linux), so `gateway-process.test.ts`
# imports the standalone copy to exercise the REAL implementation immune to the
# leaked mock. Collapsing the two (re-export barrel) puts both in one module
# graph and the mock leaks in — 8 tests fail on CI-Linux only. Keep both files;
# exclude the pair from the duplication-density metric instead.
sonar.cpd.exclusions=**/perf/fixtures/synthetic-*-trace.ts,**/index/*-v[0-9]*-sql.ts,**/packages/mcp-connectors/*/src/server.ts,**/packages/mcp-connectors/*/src/tools.ts,**/packages/gateway/src/connectors/*-sync.ts,**/packages/gateway/src/connectors/*-mapping.ts,**/packages/cli/src/lib/gw-state-helpers.ts,**/packages/cli/src/lib/gateway-process.ts

# Type-aware analysis — every package has its own tsconfig. Without
# enumerating them all, only the gateway tsconfig is honoured and
# cli / ui / sdk / client / mcp-connectors fall back to type-unaware
# rules. Globs are supported per SonarCloud docs.
sonar.typescript.tsconfigPaths=packages/*/tsconfig.json,packages/mcp-connectors/*/tsconfig.json

# Block CI on the Quality Gate result. Without this, the scanner
# uploads results and exits 0 — the SonarCloud GitHub App posts a
# side-comment but the workflow check stays green even when the gate
# fails. With wait=true the scan step polls the SonarCloud API for the
# gate verdict and exits non-zero on a failure, so the
# "SonarQube Cloud analysis" step in _test-suite.yml fails the
# pr-quality-ts check (and ci-ts on push). The project uses the built-in
# "Sonar way" gate — custom gates are paywalled to Team/Enterprise plans
# as of 2026, so we accept the default. See docs/sonar-local.md.
sonar.qualitygate.wait=true
